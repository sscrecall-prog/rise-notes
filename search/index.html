const NOTES=[{"title": "Motion", "subject": "Physics", "url": "../physics/motion_notes.html", "text": "Motion – Rise Notes 📚 Rise Notes — Lecture 1 ⚡ MOTION Physics Notes · Simple Language · Complete Coverage 🗂️ Topics at a Glance 1 What is Motion? 2 Scalar vs Vector 3 Distance & Displacement 4 Speed & Average Speed 5 Types of Motion 6 Velocity 7 Acceleration 8 Motion Graphs 9 Equations of Motion 10 Motion Under Gravity 11 Uniform Circular Motion 🚀 Topic 1 What is Motion? Motion = जब कोई object अपनी position किसी reference point के relative बदलता है, उसे Motion कहते हैं। 💡 Simple Definition: अगर कोई चीज़ अपनी जगह बदल रही है — वो Motion में है! 🔕 Rest (विराम) = Motion का उल्टा। जब body बिल्कुल नहीं हिलती — वो Rest में है। ⚖️ Topic 2 Scalar vs Vector Quantity 📏 Scalar Quantity सिर्फ Magnitude (value) होती है Direction नहीं होता Examples: Distance (दूरी) Speed (चाल) Time (समय) Mass, Temperature 🧭 Vector Quantity Magnitude + Direction दोनों होते हैं दिशा बताना जरूरी है Examples: Displacement (विस्थापन) Velocity (वेग) Acceleration (त्वरण) Force, Momentum 📍 Topic 3 Distance & Displacement 🛤️ Distance (दूरी) Object ने कुल कितना रास्ता तय किया Direction matter नहीं करती हमेशा Positive या Zero होती है Scalar 📌 Displacement (विस्थापन) Start से End तक shortest path Direction matter करती है Positive, Negative या Zero हो सकता है Vector 📌 Cases समझते हैं CASE 1 — Straight Line A ——— 40m ——— B Distance = 40 m Displacement = 40 m ✅ Straight line में Distance = Displacement CASE 2 — Backtrack A —40m→ B ←10m— C Distance = 50 m Displacement = 30 m (A to C) 📐 Distance ≥ Displacement (हमेशा) 🔑 Round Trip में Displacement = 0 (starting point = ending point), लेकिन Distance ≠ 0! 🔄 Unit Conversion — याद रखो! km/hr × 5/18 = m/s km/hr को m/s में बदलो → ÷ 3.6 m/s × 18/5 = km/hr m/s को km/hr में बदलो → × 3.6 🏎️ Topic 4 Speed & Average Speed ⚡ Speed (चाल) किसी object की position किस rate पर बदल रही है — direction के बिना — वो Speed है। 📏 Speed = Distance ÷ Time | S.I. Unit: m/s | Scalar Quantity S = D / T Speed = Distance/Time D = S × T Distance = Speed × Time T = D / S Time = Distance/Speed 📊 Average Speed जब speed पूरे journey में same नहीं हो, तो total distance को total time से divide करते हैं। ➗ Average Speed = Total Distance Covered ÷ Total Time Taken 🔄 Topic 5 Types of Motion 1️⃣ Uniform Motion (एकसमान गति) Object equal time intervals में equal distance cover करे → Speed constant, Acceleration = 0 🚆 Example: अगर car 10 m/s speed से जा रही है, तो हर second में exactly 10 meter तय होगा। 🛤️ Linear Motion Constant speed में straight line — जैसे highway पर train 🕐 Circular Motion Constant angular velocity में circle — जैसे clock की needle 🌍 Rotational Motion Fixed axis पर constant angular speed — जैसे Earth का rotation 2️⃣ Non-Uniform Motion (असमान गति) Object की speed या direction बदलती रहे → equal time में equal distance नहीं 🎢 Example: Car पहले 2 sec में 10m, अगले 2 sec में 15m चली → Non-Uniform 🏃 Linear Motion Changing speed में straight line — acceleration के साथ ⚾ Circular Motion Changing speed में circle — जैसे vertically thrown ball 🎡 Rotational Motion Changing angular speed — angular acceleration के साथ 🧭 Topic 6 Velocity (वेग) Velocity = Speed + Direction। यानी object किस direction में कितनी speed से जा रहा है। 🎯 Velocity = Displacement ÷ Time | S.I. Unit: m/s | Vector Quantity 🏎️ Speed सिर्फ magnitude Scalar quantity \"20 m/s से जा रही है\" = Distance / Time 🧭 Velocity Magnitude + Direction Vector quantity \"20 m/s East में जा रही है\" = Displacement / Time v = d / t Velocity = Displ./Time t = d / v Time = Displ./Velocity d = v × t Displ. = Velocity × Time 📈 Topic 7 Acceleration (त्वरण) Acceleration = velocity कितनी तेज़ी से बदल रही है (speed या direction में)। ⚡ Acceleration = Change in Velocity ÷ Time | S.I. Unit: m/s² a = (v − u) / t v=final, u=initial velocity 🏃‍♂️ Speed बढ़ रही है → Positive Acceleration 🛑 Speed घट रही है → Deceleration / Retardation ↩️ Direction बदल रही है → Also Acceleration! 🔴 Deceleration = Negative Acceleration (Retardation) — जब speed घटती है। 📊 Topic 8 Motion Graphs 📉 What does each Graph tell us? Distance–Time Slope = Speed Displacement–Time Slope = Velocity Velocity–Time Slope = Acceleration Area = Displacement ① Stationary Body (Rest) O t s s = constant Horizontal line = No movement ② Uniform Motion O t s Straight line Straight slope = Constant speed ③ Non-Uniform (Accelerating) O t s Curved line Curve = Speed is changing ④ Velocity–Time Graph O t v Area = Displacement Slope = Accel. Slope=Acceleration · Area=Displacement 💡 Distance-Time Graph — Quick Tips 🔸 Steep slope → Fast speed 🔸 Gentle slope → Slow speed 🔸 Horizontal line → Object at rest 🔸 Curve (concave up) → Accelerating 🔸 Curve (concave down) → Decelerating 🧮 Topic 9 Equations of Motion (UTSAV Concept) 📝 Variables — पहले याद करो u → Initial velocity (शुरुआती वेग) v → Final velocity (अंतिम वेग) a → Acceleration (त्वरण) t → Time (समय) s → Distance / Displacement 🔢 Three Equations of Motion v = u + at 1st Equation s = ut + ½at² 2nd Equation v² − u² = 2as 3rd Equation 🎯 Trick: UTSAV → U (initial vel) T (time) S (distance) A (acceleration) V (final vel) — इन 5 में से 3 पता हों तो बाकी 2 निकाल सकते हो! ⚠️ Free fall या stationary से शुरू हो — तो u = 0 m/s (initial velocity zero) 🍎 Topic 10 Motion Under Gravity जब कोई object सिर्फ gravity की वजह से move करे — उसे Free Fall या Motion Under Gravity कहते हैं। 🌍 g = 9.8 m/s² (approximately 10 m/s²) — यही acceleration है gravity के कारण। ⬇️ Downward (Free Fall) a = +g, u = 0 v = u + gt s = ut + ½gt² v² − u² = 2gh ⬆️ Upward (Against Gravity) a = −g, v = 0 at top v = u − gt s = ut − ½gt² v² − u² = −2gh ⬇️ Free Fall: u = 0, a = g (positive) Highest point पर: v = 0 ⬆️ Upward throw: a = −g Top पर: Final velocity = 0 ⭕ Topic 11 Uniform Circular Motion जब कोई body constant speed से circular path पर move करे — वो Uniform Circular Motion है। 🔄 Speed = constant , लेकिन Velocity ≠ constant क्योंकि direction हर point पर बदलती है! 💡 Direction बदलने से velocity बदलती है → इसलिए acceleration होती है, भले ही speed constant हो। a꜀ = v² / r Centripetal Acceleration F = mv²/r Centripetal Force 🎯 Centripetal Force 🔸 Circular path पर body पर लगने वाली force 🔸 हमेशा centre की तरफ point करती है 🔸 Example: धागे पर घुमाते पत्थर में tension = centripetal force 🔸 Earth orbit में: gravity = centripetal force 🎯 Quick Revision All Key Formulas at a Glance Speed = D/T Scalar Velocity = s/t Vector a = (v−u)/t Acceleration v = u + at 1st Equation s = ut + ½at² 2nd Equation v²−u² = 2as 3rd Equation a꜀ = v²/r Centripetal g ≈ 9.8 m/s² Gravity constant ×5/18 → m/s km/hr convert"}, {"title": "Force & Laws of Motion", "subject": "Physics", "url": "../physics/force_laws_of_motion_notes_RISE_NOTES.html", "text": "Force & Laws of Motion – RISE NOTES 📚 RISE NOTES 💥 FORCE & LAWS OF MOTION Physics Notes · Simple Language · Complete Coverage 🗂️ Topics at a Glance 1 Force – Introduction 2 Balanced & Unbalanced Forces 3 Types of Forces 4 Contact Forces 5 Non-Contact Forces 6 Conservative vs Non-Conservative 7 Galileo & Laws of Motion 8 Newton's 1st Law – Inertia 9 Types of Inertia 10 Newton's 2nd Law – F = ma 11 Newton's 3rd Law 12 Momentum & Impulse 13 Conservation of Momentum 💪 Topic 1 Force – Introduction Force एक external agent है जो किसी body की rest या motion की state बदल सकता है। 📏 S.I. Unit of Force = Newton (N) | 1 Newton = 1 kg·m/s² ⚡ Force के 4 मुख्य प्रभाव 📦➡️ 1. रुकी चीज़ को चलाना Force एक stationary object को motion में ला सकती है। 🛑 2. चलती चीज़ को रोकना/धीमा करना Force moving body को slow या stop कर सकती है। 🚀 3. Speed बढ़ाना Force किसी moving body को accelerate कर सकती है। 🔄 4. Direction/Shape बदलना Force direction, shape और size तीनों बदल सकती है। ⚖️ Topic 2 Balanced & Unbalanced Forces ✅ Balanced Forces Equal strength, opposite direction एक-दूसरे को cancel करती हैं Net Force = 0 (Fnet = 0) Acceleration = 0 Object का state नहीं बदलता Example: आदमी wall को push करे — wall नहीं हिलती ❌ Unbalanced Forces Unequal magnitude या same direction Cancel नहीं होतीं Net Force ≠ 0 (Fnet ≠ 0) Acceleration होती है Object का state बदलता है Example: Seesaw पर एक ज़्यादा भारी बच्चा CASE 1 — Balanced 10N → [Box] ← 10N Net Force = 0 N Acceleration = 0 CASE 2 — Unbalanced 20N → [Box] ← 30N Net Force = 10 N (Left) Object Left में accelerate करेगा 🌐 Topic 3 Types of Forces – Overview 👋 Contact Forces Direct या medium के through act करती हैं Physical contact ज़रूरी है Frictional Force Spring Force (Restoring Force) Normal Force, Tension 🌌 Non-Contact Forces बिना touch के act करती हैं Distance पर भी काम करती हैं Gravitational Force Magnetic Force Electrostatic Force (Coulomb Force) 👋 Topic 4 Contact Forces 🔸 Frictional Force (घर्षण बल) जब दो surfaces एक-दूसरे के साथ contact करें और slide करें — तब जो force generate होती है वो Friction है। 📊 Order of Friction: Static Friction > Sliding Friction > Rolling Friction 🔸 Static Friction — जब object रुका हो (सबसे ज़्यादा friction) 🔸 Sliding/Kinetic Friction — जब object slide कर रहा हो 🔸 Rolling Friction — जब object roll करे (सबसे कम friction) 💡 इसीलिए wheels (गोल) का use होता है — Rolling friction सबसे कम होती है! 🔸 Spring Force (Restoring Force) Spring को stretch या compress करने पर वो opposite direction में force लगाती है — इसे Restoring Force कहते हैं। 🌀 Hooke's Law: Spring को extend/compress करने के लिए जो force चाहिए वो distance के proportional होती है। F ∝ −x Proportional to displacement F = −kx k = Spring Constant ⚠️ Negative sign इसलिए — Force हमेशा displacement के opposite direction में होती है (restoring nature)। 🌌 Topic 5 Non-Contact Forces 🌌 Types of Non-Contact Forces 🌍 Gravitational Force दो masses के बीच attractive force। Example: Ball throw करो → gravity वापस खींचती है। 🧲 Magnetic Force Moving electric charge या magnetic material को magnetic field में experience होती है। Magnets attract/repel करते हैं। ⚡ Electrostatic Force दो electrically charged objects के बीच attractive या repulsive force। इसे Coulomb Force भी कहते हैं। 🔋 Topic 6 Conservative vs Non-Conservative Forces ✅ Conservative Forces Work done path पर depend नहीं करता सिर्फ initial और final point matter Closed path में work done = 0 Energy completely recoverable होती है Examples: Gravitational, Electrostatic, Magnetic, Spring Force ❌ Non-Conservative Forces Work done path पर depend करता है Different paths → different work done Closed path में work done ≠ 0 Energy पूरी recover नहीं होती (heat loss) Examples: Frictional Force, Drag Force 🔭 Topic 7 Galileo & Origin of Laws of Motion 📜 Historical Background 🔸 Galileo Galilei ने सबसे पहले Inertia का concept propose किया। 🔸 Inclined plane पर objects की motion observe करके Galileo ने deduce किया कि constant speed पर moving objects को force की ज़रूरत नहीं । 🔸 Galileo ने \"De Motu\" (meaning: \"On Motion\") नाम से essays publish किए। 🔸 Galileo की पहली book: La Bilancetta (\"The Little Balance\") — 1586 में published। 🔸 Newton ने तीनों Laws of Motion formulate किए। 1️⃣ Topic 8 Newton's 1st Law of Motion 1st Law of Inertia (जड़त्व का नियम) By Sir Isaac Newton 📜 \"An object at rest remains at rest and an object in motion remains in motion at constant velocity — unless acted upon by an external force .\" यानी — कोई भी object अपनी current state (rest या motion) तब तक नहीं बदलेगा जब तक कोई external force न लगाई जाए। 🎯 Simple: रुका हुआ रुका रहेगा, चलता हुआ चलता रहेगा — जब तक कोई force न लगे! 📌 Inertia ∝ Mass — जितना ज़्यादा mass, उतना ज़्यादा inertia (change resist करने की tendency) 🧱 Topic 9 Types of Inertia Type 1 🛑 Inertia of Rest (विरामावस्था का जड़त्व) Object रुका रहना चाहता है जब तक external force न लगे। 📌 Example: पेड़ को हिलाने पर dry leaves और फल गिर जाते हैं — पेड़ हिला लेकिन leaves inertia से वहीं रहना चाहती थीं। Type 2 🏃 Inertia of Motion (गतिज जड़त्व) Object straight line में constant speed से चलता रहना चाहता है। 📌 Example: चलती car अचानक रुके तो passenger आगे की तरफ झुकता है — body motion में रहना चाहती थी। Type 3 ↩️ Inertia of Direction (दिशा का जड़त्व) Object same direction में चलता रहना चाहता है। 📌 Example: Car sharp turn लेती है — body पुरानी direction में ही जाना चाहती है, car के साथ नहीं मुड़ती। 2️⃣ Topic 10 Newton's 2nd Law of Motion 2nd Law of Force & Acceleration (F = ma) Force = Mass × Acceleration किसी object का acceleration उस पर लगाई force के proportional और उसके mass के inversely proportional होता है। F = ma Force = Mass × Accel. F = kg·m/s² SI Unit = Newton F ∝ ΔP/Δt Rate of change of momentum 🏏 Example: Cricketer ball catch करते वक्त hand पीछे खींचता है → time बढ़ता है → Force कम लगती है → चोट कम! 📐 Derivation (F = ma कैसे आया) Change in Momentum = mv − mu Rate of change of momentum = (mv − mu) / t हम जानते हैं: (v − u) / t = a (acceleration) इसलिए: F ∝ m × a → F = ma 🔫 Bullet vs Coconut: Bullet (0.02kg × 400 m/s = 8 kg·m/s) vs Coconut (2kg × 14 m/s = 28 kg·m/s) — Coconut का total momentum ज़्यादा है! लेकिन bullet penetration करती है high speed से। 3️⃣ Topic 11 Newton's 3rd Law of Motion 3rd Law of Action & Reaction For every action there is an equal and opposite reaction 💥 \"हर action के लिए एक equal और opposite reaction होती है।\" जब A, B पर force लगाए → B भी A पर equal और opposite force लगाता है। F_AB = −F_BA Action-Reaction Pair 🔫 Example — Gun & Bullet: Bullet को forward force → Gun को equal और opposite backward force (Recoil)। इसीलिए gun पीछे की तरफ kick करती है! 🚀 Example — Rocket: Rocket नीचे की तरफ gas exhaust करता है (action) → Rocket ऊपर जाता है (reaction)। 🚶 Example — Walking: पैर ज़मीन को पीछे push करता है (action) → ज़मीन पैर को आगे push करती है (reaction)। ⚠️ Action और Reaction same object पर नहीं लगती — हमेशा दो अलग-अलग objects पर लगती हैं! 🌀 Topic 12 Momentum & Impulse 📌 Momentum (संवेग) Momentum = object की \"quantity of motion\" → mass और velocity का product। 🌀 p = m × v | S.I. Unit: kg·m/s | Vector Quantity 📋 Properties of Momentum p = vector quantity (direction होती है) m = scalar (सिर्फ value) v = vector (direction के साथ) Unit = kg·m/s 💡 Impulse (आवेग) Short time में force से momentum का change Impulse = Force × Time J = F × Δt = m × ΔV Unit = N·s = kg·m/s p = m × v Momentum J = FΔt Impulse FΔt = mΔV Impulse-Momentum Theorem ♻️ Topic 13 Conservation of Momentum ♻️ Law: Closed system में total momentum constant रहता है — momentum न create होता है, न destroy होता है, सिर्फ transfer होता है। m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂ Initial Total Momentum = Final Total Momentum 🔸 m₁, m₂ = दोनों bodies के masses 🔸 u₁, u₂ = Initial velocities (before collision) 🔸 v₁, v₂ = Final velocities (after collision) 🔸 Mass नहीं बदलता, सिर्फ velocity बदलती है 🔫 Example — Gun & Bullet: Fire से पहले total momentum = 0 (दोनों rest में)। Fire के बाद: bullet forward + gun backward → Total = 0. Conservation satisfied! ✅ 🚀 Example — Rocket: Rocket + exhaust gas का total momentum conserved रहता है। Gas पीछे जाती है → Rocket आगे बढ़ता है। 🎯 Quick Revision All Key Formulas & Facts F = ma 2nd Law p = mv Momentum FΔt = mΔV Impulse Theorem F = −kx Hooke's Law Fnet = 0 Balanced Forces F_AB = −F_BA 3rd Law 1N = kg·m/s² Unit of Force m₁u₁+m₂u₂ = m₁v₁+m₂v₂ Conservation of Momentum 🧠 Trick — 3 Laws याद करो: 1st = Inertia (जड़त्व) · 2nd = F=ma (बल=द्रव्यमान×त्वरण) · 3rd = Action-Reaction (क्रिया-प्रतिक्रिया)"}, {"title": "Gravitation & Work Done", "subject": "Physics", "url": "../physics/gravitation_work_done_notes.html", "text": "Gravitation & Work Done – Rise Notes 📚 Rise Notes — Lecture 3 🌍 GRAVITATION & WORK DONE Physics Notes · Simple Language · Complete Coverage 🗂️ Topics at a Glance 1 Universal Law of Gravitation 2 Kepler's Planetary Laws 3 Mass vs Weight 4 Variation in Gravity 5 Thrust & Pressure 6 Pascal's Law 7 Archimedes' Principle 8 Relative Density 9 Work & Energy 10 Forms of Energy 11 Law of Conservation of Energy 12 Energy Converters 13 Bernoulli's Principle 14 Laws of Thermodynamics 15 Power & Horsepower 🌌 Topic 1 Universal Law of Gravitation Newton ने 1687 में Universal Law of Gravitation दिया और इससे planets और moons की motion explain की। 📜 \"हर particle, universe के हर दूसरे particle को एक force से attract करता है जो उनके masses के product के proportional और उनके बीच distance के square के inversely proportional है।\" F ∝ m₁·m₂ Mass के proportional F ∝ 1/r² Distance के inversely proportional F = Gm₁m₂/r² Newton's Gravitation Formula 🔸 F = Gravitational force between the bodies 🔸 m₁, m₂ = Masses of the two bodies 🔸 r = Distance between the centres of two bodies 🔸 G = Universal Gravitational Constant = 6.673 × 10⁻¹¹ N m²/kg² 🧪 G की value Henry Cavendish ने 1798 में experimentally discover की। 💡 Gravitational Force = Non-contact force (distance पर act करती है) + Conservative force (closed path में work done = 0) 🪐 Topic 2 Kepler's Planetary Laws (1609) 1st Law — Law of Orbit 🌍 Planets, Sun को एक focus मानकर elliptical orbits में move करते हैं। 2nd Law — Law of Area 📐 Planet और Sun को जोड़ने वाली line equal time में equal areas sweep करती है। 3rd Law — Law of Time Period ⏱️ Planet का T² ∝ r³ (time period का square, distance के cube के proportional) T² ∝ r³ ⚖️ Topic 3 Mass vs Weight 📦 Mass (द्रव्यमान) Body में matter की मात्रा Scalar quantity (सिर्फ magnitude) जगह से नहीं बदलता कभी zero नहीं हो सकता S.I. Unit = Kilogram (kg) 🌍 Weight (भार) Earth जिस force से attract करती है Vector quantity (magnitude + direction) जगह से बदलता है (W = m × g) Earth के center पर zero होता है S.I. Unit = Newton (N) 📉 Topic 4 Variation in Gravity g = GM/R² Acceleration due to gravity g = 9.8 m/s² Earth की surface पर W = m × g Weight formula 🌐 Poles पर gravity, Equator से ज़्यादा होती है। 🏔️ ऊंचाई बढ़ने पर gravity घटती है (distance बढ़ता है → gravity ∝ 1/r²)। 🌕 Moon पर gravity = Earth की gravity का 1/6 — इसीलिए Moon पर हम ज़्यादा ऊंचा कूद सकते हैं। 🕳️ Earth के अंदर जाने पर भी gravity घटती है (सिर्फ नीचे का mass matter करता है)। ⚠️ Gravity surface पर सबसे strong होती है — ऊपर और नीचे दोनों तरफ घटती है! 💨 Topic 5 Thrust & Pressure 🚀 Thrust Thrust = वो force जो किसी surface पर perpendicular (normal) direction में act करती है। Unit = Newton (N)। ✈️ Example: Aircraft के engines propulsion system के through Thrust generate करते हैं। 📊 Pressure (दबाव) Pressure = Force per unit area। S.I. Unit = Pascal (Pa)। P = F/A Pressure = Force/Area 1 Pa = N/m² Pascal = Newton per sq. meter 🔸 1 atm = 1.013 × 10⁵ Pa 🔸 1 atm = 1.01325 bar 🔸 1 N = 10⁵ Dyne 🫧 Topic 6 Pascal's Law 📜 Pascal's Law: \"Confined incompressible fluid में किसी एक point पर pressure change होता है तो वो पूरे fluid में equally transmit होता है।\" 📅 दिया: 1653 में, Published: 1663 में। दिया Blaise Pascal ने। P₁ = P₂ Pressure equal throughout F₁/A₁ = F₂/A₂ Pascal's Principle 🚗 Application: Hydraulic Jack — small force से car lift होती है। छोटे piston पर force → बड़े piston पर ज़्यादा force! 🛟 Topic 7 Archimedes' Principle 💧 Archimedes' Principle: \"किसी fluid में डूबे हुए body पर upward buoyant force लगती है जो उस body द्वारा displace किए गए fluid के weight के equal होती है।\" Fᵦ = ρgV Buoyant Force 🔸 Fᵦ = Buoyant force 🔸 ρ = Fluid density 🔸 g = Acceleration due to gravity 🔸 V = Volume of fluid displaced 🚢 Ship, saltwater में freshwater से ऊंची float करती है — क्योंकि saltwater ज़्यादा dense है → ज़्यादा buoyant force → कम volume displace करना पड़ता है। 🧪 Topic 8 Relative Density Relative Density = किसी substance की density का water की density से ratio। RD = ρ(substance)/ρ(water) Relative Density Density = Mass/Volume S.I. Unit = kg/m³ ⚠️ Relative Density का कोई S.I. unit नहीं होता (यह एक ratio है)। Density का S.I. unit = kg/m³ । Substance Density (g/mL) Hydrogen (gas) 9 Carbon dioxide (gas) 19 Cork 21 Oak wood 71 Ethyl alcohol 79 Water 100 Magnesium 174 Table salt 216 Aluminium 270 Iron 786 Copper 892 Lead 1,134 Mercury 1,359 Gold 193 🔧 Topic 9 Work & Energy 🔧 Work (कार्य) Work = वो energy जो force से transfer होती है जब object उस force की direction में move करता है। 📐 W = F × d | W = FS cosθ | S.I. Unit = Joule (J) = Newton-meter (Nm) | Scalar Quantity 👤 Joule unit का नाम English physicist James Prescott Joule के नाम पर रखा गया। ✅ Positive Work Force और displacement same direction में (θ = 0°)। Object accelerate होता है। ❌ Negative Work Force और displacement opposite direction में (θ = 180°)। Object decelerate होता है। ⭕ Zero Work Force ⊥ displacement (θ = 90°) या displacement = 0 हो। ⚡ Energy Energy = work करने की capacity। S.I. Unit = Joule (J) । सबसे बड़ा source = Sun । 🌞 Energy कई forms में होती है: Kinetic, Potential, Thermal, Electrical, Chemical, Nuclear आदि। ⚡ Topic 10 Forms of Energy 🏃 Kinetic Energy (गतिज ऊर्जा) किसी object की motion की वजह से जो energy होती है वो Kinetic Energy है। KE = ½mv² m=Mass, v=Velocity KE = p²/2m p=Momentum के terms में 💡 Momentum double होने पर: KE = (2p)²/2m = 4p²/2m → KE 4 गुना हो जाती है! 🏔️ Potential Energy (स्थितिज ऊर्जा) Object की position या state की वजह से stored energy — जो बाद में release होकर work करती है। PE = mgh m=Mass, g=Gravity, h=Height 🏗️ Dam का concept PE पर based है — ऊंचाई पर stored water → PE → Turbines में KE → Electricity। ⬆️ Top पर: PE maximum, KE = 0 | Ground से ठीक पहले: KE maximum, PE = 0 🚀 Escape Velocity वो minimum velocity जिससे कोई body gravity को overcome करके Earth से बाहर निकल जाए — बिना किसी और acceleration के। 🚀 Escape Velocity ≈ 11.2 km/s — इतनी speed से throw करो तो ball कभी वापस नहीं आएगी! ♻️ Topic 11 Law of Conservation of Energy ♻️ \"Energy न तो create हो सकती है, न destroy — सिर्फ एक form से दूसरे form में convert हो सकती है।\" 🌡️ 1st Law of Thermodynamics इसी concept पर based है। 🔁 Topic 12 Energy Converters ⚙️ Dynamo / Generator Mechanical Energy → Electrical Energy 🔌 Motor Electrical Energy → Mechanical Energy 🎤 Microphone Sound Energy → Electrical Energy 🔊 Loudspeaker Electrical Energy → Sound Energy 🔋 Battery Chemical Energy → Electrical Energy 💡 Bulb Electrical Energy → Light + Heat Energy Filament: Tungsten (W) 🌿 Photosynthesis Light Energy → Chemical Energy (sugars) — CO₂ + H₂O, releases O₂ 🌊 Topic 13 Bernoulli's Principle 💨 Bernoulli's Principle: \"Incompressible, non-viscous fluid के streamline flow में — Pressure energy + Kinetic energy + Potential energy per unit volume = Constant।\" P + ½ρv² + ρgh = Constant Bernoulli's Equation ✈️ Key insight: Fluid speed बढ़े → Pressure घटे। यही Airplane wings को lift देता है — ऊपर तेज़ flow → कम pressure → नीचे से ज़्यादा pressure → Lift! 🔸 A₂ < A₁ (area कम) → v₂ > v₁ (speed ज़्यादा) → P₂ < P₁ (pressure कम) 🌡️ Topic 14 Laws of Thermodynamics 🟢 Zeroth Law — Thermal Equilibrium \"अगर A, B के साथ thermal equilibrium में है और B, C के साथ है → तो A, C के साथ भी thermal equilibrium में है।\" 📅 दिया: Ralph H. Fowler ने 1931 में। 🔵 First Law — Conservation of Energy \"Energy न create हो सकती है, न destroy — सिर्फ convert होती है।\" यह Heat पर conservation of energy का application है। Q = ΔU + W Q=Heat added, ΔU=Internal energy change, W=Work done 🔴 Second Law — Heat Flow Direction Heat अपने आप ठंडी body से गर्म body में नहीं जाती। 🔸 Entropy (disorder) का concept introduce करता है 🔸 Heat engine 100% efficient नहीं हो सकता 🔸 Refrigerator को heat transfer के लिए external work चाहिए ❄️ Third Law — Absolute Zero जैसे temperature absolute zero (0 K) पर approach करे — perfect crystal की entropy = zero। 📖 Entropy = system की thermal energy per unit temperature जो useful work नहीं कर सकती। ⚡ Topic 15 Power & Horsepower ⚡ Power (शक्ति) Power = वो rate जिस पर work होता है, या energy transfer/transform होती है। S.I. Unit = Watt (W) । P = W/t Power = Work/Time P = F × v Power = Force × Velocity 1 W = 1 J/s 1 Joule per second 🐴 Horsepower (HP) Engines और motors की output describe करने के लिए use होता है। 1 hp = 746 W Horsepower to Watts 1 hp = 0.746 kW Horsepower to Kilowatts 1 kW = 1000 W Kilowatt to Watts 🎯 Quick Revision All Key Formulas at a Glance F = Gm₁m₂/r² Gravitation T² ∝ r³ Kepler's 3rd Law g = GM/R² Acceleration due to gravity W = FS cosθ Work Done KE = ½mv² Kinetic Energy PE = mgh Potential Energy Fᵦ = ρgV Buoyant Force P = F/A Pressure P = W/t Power 1 hp = 746 W Horsepower Q = ΔU + W 1st Law Thermo v_escape = 11.2 km/s Escape Velocity"}, {"title": "Sound", "subject": "Physics", "url": "../physics/sound_notes.html", "text": "Sound – Rise Notes 📚 Rise Notes — Lecture 4 🔊 SOUND Physics Notes · Simple Language · Complete Coverage 🗂️ Topics at a Glance 1 What is Sound? 2 Sound in Different Media 3 Speed of Sound 4 Sound Waves & Types 5 Transverse & Longitudinal Waves 6 Characteristics of Sound Waves 7 Audible Range & Ultrasonic 8 Mach Number 9 Reflection of Sound 10 Echo, Reverberation & Diffraction 11 SONAR 12 Doppler Effect 🔊 Topic 1 What is Sound? Sound = energy का एक form — एक vibration जो medium (air, water, solids) में mechanical wave की तरह travel करती है और हमारे ear से audible sensation की तरह perceive होती है। 🎵 Sound तब produce होती है जब कोई object vibrate करता है — pressure wave बनती है → surrounding medium के particles vibrate करते हैं। 📈 Compression (संपीडन) High pressure का region Particles एक-दूसरे के closest होते हैं Object आगे vibrate करे → Compression 📉 Rarefaction (विरलन) Low pressure का region Particles spread out होते हैं Object पीछे vibrate करे → Rarefaction 🚫 Sound vacuum में travel नहीं कर सकती — medium (air/water/solid) ज़रूरी है। 🌊 Topic 2 Sound in Different Media 💨 Air (Gas) Sound = Longitudinal waves । Vibrations wave propagation के parallel होती हैं। 💧 Water (Liquid) Sound = Longitudinal waves । Water में भी same type की waves। 🪨 Solids Sound = Both Longitudinal AND Transverse waves — दोनों types possible! ⚡ Topic 3 Speed of Sound 🏆 Speed of Sound: Solids > Liquids > Gases — Solids में सबसे तेज़, Gases में सबसे धीमी! 💡 Solids में particles tightly packed होते हैं → energy जल्दी transfer होती है → speed ज़्यादा। 343 m/s Speed of Sound in Air 3 × 10⁸ m/s Speed of Light 🌡️ Temperature बढ़ने पर sound की speed बढ़ती है । Moist air में speed, dry air से ज़्यादा होती है। 📊 Speed of Sound in Various Substances State Substance Speed (m/s) 🪨 Solids Aluminium 6420 Nickel 6040 Steel 5960 Iron 5950 Brass 4700 Glass (flint) 3980 💧 Liquids Water (sea) 1531 Water (distilled) 1498 Ethanol 1207 Methanol 1103 💨 Gases Hydrogen 1284 Helium 965 Air 346 Oxygen 316 Sulphur dioxide 213 〰️ Topic 4 Sound Waves & Types Sound waves = vibrations की वजह से medium में travel करने वाले disturbances। 🔧 Mechanical Waves Propagate के लिए medium ज़रूरी Vacuum में travel नहीं होतीं Example: Sound waves ✨ Non-Mechanical Waves Propagate के लिए medium ज़रूरी नहीं Vacuum में travel कर सकती हैं Example: Light waves (EM waves) 📡 Topic 5 Transverse & Longitudinal Waves ↕️ Transverse Waves (अनुप्रस्थ तरंगें) Particles, wave की propagation direction के perpendicular (90°) vibrate करते हैं। 🔸 Crest (ऊपरी point) और Trough (निचला point) होते हैं 🔸 Example: Light waves , Electromagnetic waves 🔸 Solids में भी transverse waves travel करती हैं ↔️ Longitudinal Waves (अनुदैर्ध्य तरंगें) Particles, wave की propagation direction के parallel vibrate करते हैं। 🔸 Compression और Rarefaction बनते हैं 🔸 Example: Sound waves , Pressure waves 🔸 Air, Water और Solids तीनों में travel होती हैं 📏 Topic 6 Characteristics of Sound Waves 〰️ Wavelength (तरंगदैर्घ्य) दो successive crests या troughs के बीच की physical distance = Wavelength (λ)। 🔸 Longitudinal wave में: दो successive compressions या rarefactions के बीच की distance 🔸 S.I. Unit = Meter (m) 🔸 Symbol = λ (lambda) 🔁 Frequency (आवृत्ति) Sound wave एक second में कितने cycles complete करे = Frequency। यही sound की pitch determine करती है। ν = 1/T Frequency = 1/Time Period f ∝ 1/λ Frequency ∝ 1/Wavelength 🎤 S.I. Unit = s⁻¹ या Hertz (Hz) | Girls की voice high-pitched होती है क्योंकि vocal cords तेज़ vibrate करते हैं। 🔊 High Pitch Sound Faster vibrations Higher frequency Smaller wavelength 🔉 Low Pitch Sound Slower vibrations Lower frequency Larger wavelength 📢 Amplitude (आयाम) Vibrating particles का mean position से maximum displacement = Amplitude। यह sound की loudness represent करती है। 🔊 Greater Amplitude = Louder Sound | S.I. Unit = Metre (m) 🔸 Sound intensity का unit = Decibel (dB) 🔸 Human ear perceive कर सकता है: 0 to 130 dB 🔸 130 dB से ऊपर = Noise (हानिकारक) 🔸 Table को हल्के से hit करें → कम amplitude → soft sound 🎨 Timbre (Tone Quality / Tone Color) Timbre = sound की वो quality जो same pitch और loudness वाली दूसरी sounds से अलग बनाती है। 🎵 Note = एक single frequency नहीं बल्कि कई frequencies का mixture (fundamental + overtones) से बनता है। 👂 Topic 7 Audible Range & Ultrasonic 👻 Infrasonic (< 20 Hz) Humans सुन नहीं सकते। Animals सुन सकते हैं। Example: Earthquakes की sound। 👂 Audible Range (20 Hz – 20,000 Hz) Human ear इस range को सुन सकता है। 20 Hz to 20 kHz Normal human hearing range। 🦇 Ultrasonic (> 20,000 Hz) Humans सुन नहीं सकते। Bats & Dolphins produce करते हैं। Medical में use होती है। 🏥 Applications of Ultrasonic Sounds 🔸 Bats और Dolphins produce करते हैं (echolocation) 🔸 Ultrasound in gender determination — banned in India 🔸 Foetus की growth और development monitor करने के लिए 🔸 Kidney stones identify और break करने के लिए 🔸 Internal organs की conditions identify करने के लिए ✈️ Topic 8 Mach Number Mach Number = किसी object की speed का उसके surrounding medium में sound की speed से ratio। Mach No. = Speed of Body / Speed of Sound in that Medium Dimensionless number 🐢 Subsonic Mach < 1 (sound से धीमा) ≈ Transonic Mach ≈ 1 (sound के बराबर) 🚀 Supersonic Mach 1 to 5 (sound से तेज़) ⚡ Hypersonic Mach > 5 (बहुत तेज़) 🔄 Topic 9 Reflection of Sound Sound waves जब किसी surface से टकराकर वापस bounce करती हैं — उसे Reflection of Sound कहते हैं। 💡 Sound, light की तरह same laws of reflection follow करती है। Medium: solid या liquid हो सकता है। 📌 Reflection से: Echo, Reverberation और Diffraction जैसी phenomena होती हैं। 📣 Topic 10 Echo, Reverberation & Diffraction 🏔️ Echo (प्रतिध्वनि) जब sound किसी surface से reflect होकर listener तक वापस आए — तो वो sound दोबारा सुनाई दे = Echo। 📏 Distinct Echo सुनने के लिए obstacle की minimum distance = 17.2 meters 🔸 Formula: 2D = v × t → D = v×t/2 🔸 v (air में) = 344 m/s, minimum time = 0.1 s 🔸 2D = 344 × 0.1 = 34.4 → D = 17.2 m 🏛️ Reverberation (अनुगूंज) Original sound source बंद होने के बाद भी enclosed space में sound का बने रहना = Reverberation। 🏠 Walls, ceiling, furniture से repeated reflections → sound धीरे-धीरे fade होती है। Example: Concert halls, caves में। 🌀 Diffraction (विवर्तन) Sound waves का obstacles के around या small openings के through bend होना = Diffraction। 🚪 इसीलिए corner के पीछे से भी sound सुनाई देती है — source दिखाई न दे तब भी! 🛸 Topic 11 SONAR 🌊 SONAR = Sound Navigation And Ranging — Underwater objects detect और locate करने की technology। 🔸 Ultrasonic sound waves emit करता है 🔸 Waves objects से reflect होकर echo बनाती हैं 🔸 Echo analyze करके distance calculate होती है 🔸 Uses: Navigation, Communication, Mapping (ocean floor) 🔸 Submarines में use होता है 🦇 Bats का echolocation system भी SONAR जैसा ही principle follow करता है! 🚑 Topic 12 Doppler Effect 📡 Doppler Effect: जब observer, wave source के relative move कर रहा हो — तो wave की perceived frequency या wavelength change हो जाती है। f₀ = [(v + v₀) / (v + vₛ)] × fₛ Doppler Effect Formula 🔸 f₀ = Observer को सुनाई देने वाली frequency 🔸 v = Sound wave की speed 🔸 v₀ = Observer की velocity 🔸 vₛ = Source की velocity 🔸 fₛ = Source frequency (actual frequency) 🔴 Red Shift (Source दूर जाए) Frequency कम हो जाती है Wavelength बढ़ जाती है Sound की pitch कम सुनाई देती है Example: Ambulance दूर जाए 🔵 Blue Shift (Source पास आए) Frequency ज़्यादा हो जाती है Wavelength कम हो जाती है Sound की pitch ज़्यादा सुनाई देती है Example: Ambulance पास आए 🎯 Quick Revision All Key Facts & Formulas ν = 1/T Frequency f ∝ 1/λ Freq. ∝ 1/Wavelength 343 m/s Sound in Air 3×10⁸ m/s Speed of Light 17.2 m Min. Echo Distance 0–130 dB Human Hearing Range <20 Hz Infrasonic 20–20k Hz Audible Range >20,000 Hz Ultrasonic 🧠 Speed याद करो: Solid > Liquid > Gas | Mach याद करो: Sub <1 · Trans ≈1 · Super 1-5 · Hyper >5"}, {"title": "Reflection & Refraction", "subject": "Physics", "url": "../physics/reflection_refraction_notes.html", "text": "Reflection & Refraction – Rise Notes 📚 Rise Notes — Lecture 5 💡 REFLECTION & REFRACTION Physics Notes · Simple Language · Complete Coverage 🗂️ Topics at a Glance 1 Light – Introduction 2 Young's Double-Slit Experiment 3 Photoelectric Effect 4 Reflection of Light 5 Spherical Mirrors 6 Image in Plane Mirror 7 Real vs Virtual Image 8 Image by Concave Mirror 9 Image by Convex Mirror 10 Mirror Formula & Uses 11 Refraction of Light 12 Snell's Law & Refractive Index 13 Refractive Index Table 14 Medium Cases & Glass Slab 15 Spherical Lenses 16 Image by Convex Lens 17 Image by Concave Lens 18 Power of Lens & Diffraction 💡 Topic 1 Light – Introduction 💡 Light = Electromagnetic radiation का वो part जो human eye को visible होता है। Speed in vacuum ≈ 3 × 10⁸ m/s 🔸 Light की Dual Nature होती है — Wave-like AND Particle-like दोनों characteristics 🔸 Light को Photons का stream भी कह सकते हैं — photons energy carry करते हैं 🔸 Light एक Transverse Wave है जो vacuum में travel करती है 🔸 Light को Polarize किया जा सकता है 🔸 Light vacuum में constant speed पर travel करती है 🔬 Topic 2 Young's Double-Slit Experiment 📅 1801 में Thomas Young ने perform किया। यह experiment light की wave-like nature prove करता है। 🌊 Light खुद के साथ interfere करती है → bright और dark fringes का interference pattern बनता है → Proves light is a wave! ⚡ Topic 3 Photoelectric Effect ⚡ Photoelectric Effect: जब sufficient frequency की light metal surface पर पड़े → electrons emit होते हैं। 🔸 यह effect prove करता है कि light packets/quantum of energy (photons) से बनी है 🔸 Heinrich Rudolf Hertz — पहली बार observe किया (1887) 🔸 Albert Einstein — 1905 में photons का existence propose किया → Nobel Prize 1921 🔄 Topic 4 Reflection of Light जब light rays किसी surface से strike करके same medium में वापस bounce करें — वो Reflection है। 📏 Laws of Reflection (2 Laws) 1️⃣ Angle of Incidence (i) = Angle of Reflection (r) — Incident ray और reflected ray normal के साथ equal angle बनाती हैं। 2️⃣ Incident ray, reflected ray और normal — तीनों same plane में होती हैं। 🪞 Topic 5 Spherical Mirrors 🪞 Plane Mirror Flat mirror। Image = Virtual, Erect, Laterally Inverted 🔴 Concave Mirror Reflecting surface curves inward । Image depends on object position। 🟢 Convex Mirror Reflecting surface curves outward । Image = Always Virtual, Erect, Diminished। 💡 Real Image: Light rays actually converge करती हैं — screen पर project हो सकती है। Virtual Image: Light rays diverge appear करती हैं — screen पर project नहीं होती। 🧍 Topic 6 Image Formation in Plane Mirror 🪞 Plane Mirror की image — Virtual · Erect · Same Size · Lateral Inversion · Equal Distances 🔸 Virtual Image — Mirror के पीछे बनती है, screen पर project नहीं होती 🔸 Erect Image — Upright होती है (inverted नहीं) 🔸 Same Size — Image height = Object height 🔸 Lateral Inversion — Left और Right interchange — Object: Left hand raised → Image: Right hand raised 🔸 Equal Distances — Object distance from mirror = Image distance from mirror 👁️ Topic 7 Real vs Virtual Image 📽️ Real Image Screen पर project हो सकती है Light rays actually converge करती हैं हमेशा Inverted (upside down) होती है Concave mirror और Convex lens से बनती है 👻 Virtual Image Screen पर project नहीं हो सकती Light rays diverge appear करती हैं हमेशा Upright (right side up) होती है Convex mirror, concave lens, plane mirror से बनती है 📌 Real objects = जिनसे light diverge होती है | Virtual objects = जिनकी तरफ light converge होती है 🔴 Topic 8 Image Formation by Concave Mirror Concave mirror both real और virtual images form कर सकता है — object की position पर depend करता है। 🔸 C = Centre of Curvature | F = Focus | P = Pole Object Position Image Position Nature Size At ∞ At Focus (F) Real, Inverted Highly Diminished Beyond C Between C & F Real, Inverted Diminished At C At C Real, Inverted Same Size Between C & F Beyond C Real, Inverted Enlarged At F At ∞ Real, Inverted Highly Enlarged Between F & P Behind Mirror Virtual, Erect Enlarged 💡 Trick: Object F और P के बीच हो तभी Concave mirror में Virtual image बनती है — बाकी सब Real! 🟢 Topic 9 Image Formation by Convex Mirror 🟢 Convex Mirror = Diverging Mirror — Image हमेशा Virtual, Erect और Diminished होती है — object position चाहे जो भी हो! Object Position Image Position Nature Size At ∞ At F, behind mirror Virtual, Erect Highly Diminished (point) Between ∞ and P Between P & F, behind mirror Virtual, Erect Diminished 📐 Topic 10 Mirror Formula, Sign Convention & Uses 📐 Mirror Formula & Magnification 1/v + 1/u = 1/f Mirror Formula M = hᵢ/h₀ = −v/u Magnification R = 2f Radius = 2 × Focal length 🔸 M = +2 → Image size = 2× object, Virtual 🔸 M = −2 → Image size = 2× object, Real & Inverted 🔸 M = 0.2 → Image smaller than object 📏 Sign Convention in Spherical Mirrors 🔸 सभी distances Pole of Mirror से measure होती हैं 🔸 Pole के Right = Positive (+) 🔸 Pole के Left = Negative (−) 🔸 Principal axis के ऊपर = Positive (+) 🔸 Principal axis के नीचे = Negative (−) 🔸 Object distance (u) = हमेशा Negative 🔸 Concave mirror: f = Negative | Convex mirror: f = Positive 🔧 Uses of Spherical Mirrors 🔴 Concave Mirror — Uses Shaving mirrors Dentist mirrors Car headlights Telescopes Solar furnace 🟢 Convex Mirror — Uses Rear view mirrors in vehicles Security monitors in ATMs Surveillance mirrors in stores Sunglasses 🌈 Topic 11 Refraction of Light 🌈 Refraction: जब light एक medium से दूसरे medium में जाए → speed और direction बदलती है → यही Refraction है। 🔸 Refraction की वजह = light की speed में change 🔸 Speed और Wavelength बदलती है — लेकिन Frequency constant रहती है 🔸 Refraction से Lenses, Magnifying glasses, Prisms और Rainbows possible हैं 💨 Rarer Medium Light की speed ज़्यादा होती है Denser से Rarer में जाए → Normal से दूर बेंड होती है Example: Air, Vacuum 🪨 Denser Medium Light की speed कम होती है Rarer से Denser में जाए → Normal की तरफ बेंड होती है Example: Glass, Water 📐 Topic 12 Laws of Refraction & Refractive Index 📏 Laws of Refraction (2 Laws) 1️⃣ Incident ray, refracted ray और normal — तीनों same plane में होती हैं। 2️⃣ Snell's Law: sin i / sin r = constant = μ — same medium pair और same wavelength के लिए। sin i / sin r = μ Snell's Law μ = c/v Absolute Refractive Index μ₁₂ = v₂/v₁ Relative Refractive Index 🔸 Absolute RI (μ) = Medium का vacuum के respect में RI → μ = Speed of light in vacuum / Speed of light in medium 🔸 Relative RI (μ₁₂) = एक medium का दूसरे medium के respect में RI 🔸 μ जितना ज़्यादा → medium उतना optically denser → light उतनी ज़्यादा bend होगी 📊 Topic 13 Refractive Index Table Material Medium Refractive Index (μ) Air 1.0003 Ice 1.31 Water 1.33 Alcohol 1.36 Kerosene 1.44 Quartz 1.46 Turpentine oil 1.47 Flint glass 1.60 Carbon disulphide 1.63 Dense Flint Glass 1.65 Ruby 1.71 Sapphire 1.77 Diamond 2.42 Cinnabar 2.65 💎 Diamond (2.42) और Cinnabar (2.65) — सबसे ज़्यादा refractive index वाले materials! 🔬 Topic 14 Medium Cases & Refraction Through Glass Slab 🟰 Case A: Same Medium Light same optical density के दो mediums में travel करे → Straight line में जाती है, bend नहीं होती। Example: Air to Air, Water to Water ⬇️ Case B: Rarer → Denser Light Normal की तरफ bend होती है। i > r। Speed decreases। Example: Air → Glass/Water ⬆️ Case C: Denser → Rarer Light Normal से दूर bend होती है। i < r। Speed increases। Example: Glass → Air 🪟 Refraction Through Glass Slab 🔸 Enter करते वक्त (Air→Glass): Normal की तरफ बेंड होती है 🔸 Exit करते वक्त (Glass→Air): Normal से दूर बेंड होती है 🔸 Emergent ray, incident ray के parallel होती है 🔸 Sideways shift होती है → इसे Lateral Displacement कहते हैं 🔭 Topic 15 Spherical Lenses 🔵 Convex Lens (Converging) Centre bulged, ends narrow। Light को converge करती है। Convex Lens ≈ Concave Mirror जैसा behavior। 🟣 Concave Lens (Diverging) Centre narrow, ends wider। Light को diverge करती है। Concave Lens ≈ Convex Mirror जैसा behavior। 🔵 Topic 16 Image Formation by Convex Lens Convex Lens (Converging Lens) object position के according real या virtual image form कर सकता है। Object Position Image Position Nature Size At ∞ At Focus (F) Real, Inverted Highly Diminished Beyond 2F Between F & 2F Real, Inverted Diminished At 2F At 2F Real, Inverted Same Size Between F & 2F Beyond 2F Real, Inverted Enlarged At Focus (F) At ∞ Real, Inverted Highly Enlarged Between F & O Same side of lens Virtual, Erect Enlarged 💡 Object F और O (optical center) के बीच हो तभी Convex lens में Virtual image बनती है — यही Magnifying Glass का principle है! 🟣 Topic 17 Image Formation by Concave Lens 🟣 Concave Lens = Diverging Lens — Image हमेशा Virtual, Erect और Diminished होती है — object चाहे जहाँ हो! Object Position Image Position Nature Size At ∞ At F Virtual, Erect Highly Diminished Between ∞ & O Between F & O Virtual, Erect Diminished 🔧 Uses of Lenses 🔵 Convex Lens — Uses Hypermetropia (Farsightedness) correct करना Magnifying glasses Microscopes Cameras Telescopes 🟣 Concave Lens — Uses Myopia (Nearsightedness) correct करना Eyeglasses (shortsighted लोगों के) Peepholes in doors ⚡ Topic 18 Power of Lens & Diffraction ⚡ Power of Lens Lens की light को converge/diverge करने की ability = Power। यह focal length का reciprocal है। P = 1/f Power = 1/Focal length 1 D = 1 m⁻¹ Unit = Dioptre (D) 🔸 Convex Lens (Converging) → Positive Power (+) 🔸 Concave Lens (Diverging) → Negative Power (−) M = v/u Magnification of Lens 1/v − 1/u = 1/f Lens Formula 🔸 M = 1 → Image size = Object size 🔸 M > 1 → Image larger than object 🔸 M < 1 → Image smaller than object 🌀 Diffraction (विवर्तन) Light (या कोई भी wave) का obstacle के edges के around या small opening के through bend/spread होना = Diffraction। 🪟 Wide gap → Small diffraction effect | Narrow gap → Large diffraction effect 🎯 Quick Revision All Key Formulas & Facts ∠i = ∠r Law of Reflection 1/v + 1/u = 1/f Mirror Formula M = −v/u Mirror Magnification sin i / sin r = μ Snell's Law μ = c/v Refractive Index 1/v − 1/u = 1/f Lens Formula M = v/u Lens Magnification P = 1/f Power of Lens R = 2f Radius = 2f 🧠 Trick: Convex Lens = Concave Mirror · Concave Lens = Convex Mirror | Convex = Converging = (+) Power · Concave = Diverging = (−) Power"}, {"title": "Human Eye & Vision", "subject": "Physics", "url": "../physics/human_eye_vision_notes.html", "text": "Human Eye & Vision – Rise Notes 📚 Rise Notes — Lecture 6 👁️ HUMAN EYE & VISION Physics Notes · Simple Language · Complete Coverage 🗂️ Topics at a Glance 1 Anatomy of Human Eye 2 Power of Accommodation 3 Defects of Eye 4 Myopia (Nearsightedness) 5 Hypermetropia (Farsightedness) 6 Presbyopia 7 Glaucoma, Trachoma, Cataract 8 Colour Blindness & Astigmatism 9 Refraction Through Prism 10 Dispersion & VIBGYOR 11 Electromagnetic Spectrum 12 Planck's Constant 13 Rainbow Formation 14 Refraction in Atmosphere 15 Scattering of Light 16 Total Internal Reflection (TIR) 👁️ Topic 1 Anatomy of the Human Eye 🔵 Cornea Eye का transparent front part। Light के refraction (bending) का majority हिस्सा यही करता है। Eye donation में सिर्फ cornea use होता है। ⚫ Pupil Iris के center में black circular opening। Eye में enter होने वाली light की मात्रा regulate करता है। 🟣 Iris Eye का coloured part जो pupil को surround करता है। Pupil की size control करता है। 🟢 Lens Transparent और flexible structure। Shape बदलकर (accommodation) light को retina पर focus करता है। 🔴 Retina पीछे की light-sensitive layer — यहीं image बनती है। Optical energy को electrical energy में convert करते हैं photoreceptor cells। Rods = Black & White / Night vision Cones = Color / Daytime vision 💧 Aqueous & Vitreous Humour Aqueous Humour: Cornea और lens के बीच clear fluid — pressure maintain करता है। Vitreous Humour: Eye के अंदर भरा jelly-like substance — eye की shape maintain करता है। 🟡 Blind Spot Retina का वो point जहाँ optic nerve exit करती है। यहाँ कोई light-sensitive cells नहीं होते → light detect नहीं होती। 🟤 Optic Nerve Nerve fibers का bundle जो eye से brain तक visual information transmit करता है। 🔭 Topic 2 Power of Accommodation 👁️ Power of Accommodation = Eye की ability — different distances पर objects को focus करने के लिए अपनी focal length adjust करना। 🔍 Nearby Objects देखना Ciliary muscles contract होती हैं Lens thick हो जाता है Refractive power बढ़ती है Close objects focus होते हैं 🌄 Distant Objects देखना Ciliary muscles relax होती हैं Lens flat हो जाता है Refractive power घटती है Far objects focus होते हैं 📏 Least distance of distinct vision = 25 cm — इससे कम दूरी पर object clearly नहीं दिखता। 😵 Topics 3–8 Defects of Eye 👓 Myopia (Nearsightedness / निकट दृष्टि दोष) नज़दीक की चीज़ें साफ दिखती हैं लेकिन दूर की धुंधली। 🔸 Image retina के सामने (front) बनती है 🔸 Focal length decreases, power increases 🔸 Correction: Concave Lens (−ve power) 👓 Hypermetropia (Farsightedness / दूर दृष्टि दोष) दूर की चीज़ें साफ दिखती हैं लेकिन नज़दीक की धुंधली। 🔸 Image retina के पीछे (behind) बनती है 🔸 Generally 40 साल के बाद होता है 🔸 Correction: Convex Lens (+ve power) 👴 Presbyopia (वृद्धावस्था दृष्टि दोष) Age के साथ eye का lens कठोर हो जाता है (flexibility खो देता है) → नज़दीक focus करने में problem। 🔸 Generally 50 साल के बाद होता है 🔸 Correction: Bifocal Lens — Upper part: Concave (दूर), Lower part: Convex (पास) 🟣 Glaucoma Eye condition जो optic nerve को damage करती है। 🔸 Eye pressure बढ़ता है → permanent vision loss 🔸 Generally hereditary (not curable) 🔸 Tonometry = exam जो intraocular pressure (IOP) measure करता है — Glaucoma screen करने के लिए 🟢 Trachoma Bacterium Chlamydia trachomatis से infection की eye disease। 🔸 Corneal clouding या scarring → irreversible vision loss 🔸 Later stages में curable नहीं होती 🌫️ Cataract (मोतियाबिंद) Eye का clear lens cloudy हो जाता है → blurry vision। 🔸 Proteins in lens break down और clump together → clouding 🔸 Surgery से treat हो सकता है 🌈 Colour Blindness (वर्णांधता) कुछ colors clearly देखने में difficulty = Colour Blindness (Color Vision Deficiency)। 🔸 Hereditary condition है 🔸 Retina में cone cells missing या ठीक से काम नहीं करते (cone cells = color detect करते हैं) 🔶 Astigmatism Cornea या lens का irregular (oval) shape होना → light retina पर single point पर focus नहीं होती → blurred vision। 🔸 Eye strain, headaches और distorted images हो सकते हैं 🔸 Correction: Cylindrical lenses, contact lenses, या LASIK surgery 🔺 Topic 9 Refraction of Light Through a Prism जब light prism में enter करती है → speed change होती है (air से glass में) → light bend होती है। 🔸 More wavelength = Less deviation 🔸 Less wavelength = More deviation 🔸 Refractive Index (n) = Speed of light in air / Speed of light in prism 🔸 Isaac Newton ने 1660s में पहली बार prism experiment perform किया 💡 Second prism को inverted रखने पर — dispersed light recombine होकर फिर white light बन जाती है। 🌈 Topic 10 Dispersion of White Light & VIBGYOR 🌈 Dispersion: White light का prism से गुज़रने पर अपने 7 constituent colors में split होना। V Violet I Indigo B Blue G Green Y Yellow O Orange R Red 🔴 Red Light More speed in glass Less refractive index Maximum wavelength Least deviation (सबसे कम bend) 🟣 Violet Light Less speed in glass More refractive index Minimum wavelength Most deviation (सबसे ज़्यादा bend) 📡 Topic 11 Electromagnetic Spectrum EM Spectrum = सभी electromagnetic waves की complete range — wavelength या frequency के according arranged। सभी 3 × 10⁸ m/s से travel करती हैं। 📊 Left → Right: Wavelength decreases · Frequency increases · Energy increases 📻 Radio λ: 10³ m f: 10⁶ Hz Broadcast 📡 Micro λ: 10⁻² m f: 10⁹ Hz Cooking, Radar 🌡️ Infrared λ: 10⁻⁵ m f: 10¹² Hz Heat, Remote 👁️ Visible λ: 10⁻⁶ m f: 10¹⁴ Hz Sight ☀️ UV λ: 10⁻⁸ m f: 10¹⁷ Hz Fluores. 🩻 X-ray λ: 10⁻¹⁰ m f: 10¹⁹ Hz Medical ☢️ Gamma λ: 10⁻³ m f: 10²⁰ Hz Cancer 🧠 Trick to Remember — EM Spectrum 💡 Rich Man In Victoria Uses Xtra Gold Radio · Micro · Infrared · Visible · UV · X-ray · Gamma Radiation Type Discovered By Radio waves Heinrich Hertz Microwaves Percy Spencer Infrared rays William Herschel Visible light Isaac Newton UV rays Johann Wilhelm Ritter X-rays Wilhelm Roentgen Gamma rays Paul Villard ⚛️ Topic 12 Planck's Constant Planck's constant = quantum physics का fundamental constant — photon की energy और frequency को relate करता है। E = hf Energy = h × Frequency E = hc/λ Energy = hc/Wavelength h = 6.626 × 10⁻³⁴ J·s Planck's Constant 🔸 E = Energy of photon (Joules) 🔸 h = Planck's constant 🔸 f = Frequency (Hz) 🔸 c = Speed of light (3 × 10⁸ m/s) 🔸 λ = Wavelength 💡 Photon की energy, frequency के directly proportional और wavelength के inversely proportional होती है। 🌈 Topic 13 Rainbow Formation 🌈 Rainbow बनती है: Refraction (2 बार) + Dispersion + Reflection — atmosphere में water droplets में sunlight से। 🔸 Sunlight raindrop में enter करती है → refract होती है (water denser than air) 🔸 Raindrop के अंदर 7 colors में split होती है (VIBGYOR) — हर color अलग angle पर bend 🔸 Raindrop की inside surface से reflect होती है 🔸 Exit करते वक्त फिर refract होती है → colors spread out होते हैं 🌈 Primary Rainbow 🔸 1 refraction + 1 internal reflection 🔸 Color order: V → R (VIBGYOR) 🔸 Brighter rainbow 🌈🌈 Secondary Rainbow 🔸 2 internal reflections + refraction 🔸 Color order reversed: R → V (ROYGBIV) 🔸 Fainter rainbow (more light lost) 🌅 Topic 14 Refraction in Atmosphere ⭐ Twinkling of Stars Stars का twinkling (टिमटिमाना) Earth के atmosphere में light की refraction की वजह से होता है। 🌟 Starlight atmosphere की अलग-अलग density और temperature की layers से गुज़रती है → continuously और slightly differently bend होती है → position और brightness बदलती लगती है → Twinkling! 🌅 Advanced Sunrise & Delayed Sunset Atmospheric refraction की वजह से sun actually rise से थोड़ा पहले दिखता है (Advanced Sunrise) और actually set के थोड़ी देर बाद भी दिखता है (Delayed Sunset)। 🌄 Earth's atmosphere sunlight को bend करती है → sun थोड़ा ऊंचा appear करता है जितना actually है। 🏔️ Alpenglow = Natural phenomenon जहाँ mountains rosy या reddish hue से glow करते हैं — sunrise या sunset के around। 🌤️ Topic 15 Scattering of Light 💨 Scattering: Light का atmosphere में dust, water droplets या gas molecules से hit होकर direction बदलना। Rayleigh ने 1871 में describe किया। 🧪 Tyndall Effect Colloid या suspension में particles द्वारा light का scatter होना जो light beam को visible बनाता है। 🔦 Example: Milk और water के mixture में flashlight — beam visible दिखती है। यही Tyndall Effect है! 🔵 Blue Colour of Sky Shorter wavelengths (blue/violet) longer wavelengths (red) से ज़्यादा scatter होती हैं। 🌤️ Blue light सभी directions में scatter होती है → sky blue दिखती है! Atmosphere के बिना sky black होती। 🌅 Red Colour of Sun at Sunrise/Sunset Sunrise/Sunset पर sun horizon पर होता है → light ज़्यादा atmosphere से travel करती है → blue और violet scatter away हो जाती हैं → सिर्फ Red reach करती है आंखों तक। 🚦 Danger signals Red क्यों होते हैं? Red की longest wavelength होती है → सबसे कम scatter होती है → fog/smoke में भी दूर से visible रहती है! 💎 Topic 16 Total Internal Reflection (TIR) 💎 Total Internal Reflection (TIR): जब light denser medium से rarer medium में जाए और refract होने की बजाय completely reflect हो जाए — वो TIR है। ✅ TIR के लिए 2 Conditions ज़रूरी हैं 1️⃣ Light Denser से Rarer medium में travel करे। 2️⃣ Angle of incidence, Critical Angle से ज़्यादा होनी चाहिए। Critical Angle = वो minimum angle जिस पर light denser medium में totally reflect होती है। 🏜️ Mirage (मृग मरीचिका) TIR की वजह से होता है Hot day पर ground के ऊपर की air गर्म होती है Light cold air से hot air में refract होती है Observer को water का optical illusion दिखता है 🔌 Optical Fibres TIR principle पर काम करते हैं Light fibre के अंदर reflect होती रहती है Telecommunications में use Computer networking में use Medical applications में use 🎯 Quick Revision Key Facts at a Glance 25 cm Least distance of distinct vision Concave Lens Myopia correction Convex Lens Hypermetropia correction Bifocal Lens Presbyopia correction h = 6.626×10⁻³⁴ Planck's Constant E = hf Photon Energy VIBGYOR V bends most, R bends least TIR Denser→Rarer + i > Critical angle 🧠 Eye Defects Trick: Myopia (M) = निकट देखे, Mend with Concave · Hypermetropia (H) = दूर देखे, Help with conVex · Presbyopia (P) = Pair (Bifocal)"}, {"title": "Electricity", "subject": "Physics", "url": "../physics/electricity_notes.html", "text": "Electricity – Rise Notes 📚 Rise Notes — Lecture 7 ⚡ ELECTRICITY Physics Notes · Simple Language · Complete Coverage 🗂️ Topics at a Glance 1 Electric Current 2 Conductor 3 Potential Difference 4 Ohm's Law 5 Resistance & Resistivity 6 Factors Affecting Resistance 7 Conductance 8 Conductors, Semiconductors & Insulators 9 Resistivity Table 10 Series & Parallel Combination 11 Heating Effect of Electric Current 12 Applications of Heating Effect 13 Electric Power 14 Commercial Unit of Energy (kWh) 15 Colour Coding in Wiring 16 Wheatstone Bridge 17 Kirchhoff's Laws ⚡ Topic 1 Electric Current Electric Current = conductor में electrons के flow की rate। Symbol = I । ⚡ I = q/t | S.I. Unit = Ampere (A) | Measured by: Ammeter I = q / t Current = Charge/Time q = I × t Charge = Current × Time q = n × e n=electrons, e=1.6×10⁻¹⁹ C 🔸 q = Total charge (Coulombs) 🔸 n = Number of electrons 🔸 e = Charge of 1 electron = 1.6 × 10⁻¹⁹ C 🔸 1 Coulomb = 6.25 × 10¹⁸ electrons ≈ 6 × 10¹⁸ e⁻ 🔌 Topic 2 Conductor 🔌 Conductor = वो material जो electric charge (current) को एक या ज़्यादा directions में flow करने देता है। 🥇 Best conductors: Silver > Copper > Gold > Aluminium — इनकी resistivity सबसे कम होती है। 🔋 Topic 3 Potential Difference (Voltage) Potential Difference = electric field में एक point से दूसरे point तक unit positive charge move करने में किया गया work। 🔋 V = W/Q | S.I. Unit = Volt (V) | Measured by: Voltmeter V = W / Q Voltage = Work/Charge W = qV Work = Charge × Voltage 1 Volt = 1 J/C 1 Joule per Coulomb 💡 1 Volt = वो energy जो एक unit charge को एक point से दूसरे point तक move करने के लिए चाहिए। 📐 Topic 4 Ohm's Law 📜 Ohm's Law: \"Conductor में flow होने वाला current, conductor के across voltage के directly proportional होता है — provided temperature और physical conditions constant रहें।\" 📅 दिया: George Simon Ohm ने 1827 में। V = I × R Voltage = Current × Resistance I = V / R Current = Voltage/Resistance R = V / I Resistance = Voltage/Current 📈 V-I Graph: Slope जितना steep → Resistance उतनी ज़्यादा। V ∝ I — Straight line graph। 🔩 Topic 5 Resistance & Resistivity 🔩 Resistance (R) Resistance = किसी electrical component की property जो electric current के flow को resist करे। Ω S.I. Unit = Ohm (Ω) | Formula: R = ρL/A 🔸 R = Resistance 🔸 ρ = Resistivity of material 🔸 L = Length of conductor 🔸 A = Area of cross-section 📊 Resistivity (ρ) / Specific Resistance Resistivity = material की वो measure जो बताए कि वो electrical current के flow को कितनी strongly oppose करता है। Resistivity constant होती है। ρ = Ω × m S.I. Unit of Resistivity R = ρL/A Resistance Formula 🔧 Topic 6 Factors Affecting Resistance 📏 Length (L) Resistance, length के directly proportional होती है। R ∝ L ⭕ Area of Cross-Section (A) Resistance, area के inversely proportional। Thicker wire = कम resistance। R ∝ 1/A 🌡️ Temperature (T) Metals में: R बढ़ती है। Semiconductors में: R घटती है। R ∝ T (metals) 🧱 Nature of Material (ρ) कम resistivity → better conductor। ज़्यादा resistivity → insulator। R = ρL/A 💡 Metals में temperature बढ़ने पर atoms ज़्यादा vibrate करते हैं → electrons से collisions बढ़ती हैं → resistance बढ़ती है। Semiconductors में उल्टा होता है। 📡 Topic 7 Conductance Conductance = measure of how easily electricity flows through a component। Resistance का inverse होता है। 📡 Symbol: G | G = 1/R | S.I. Unit = Siemens (S) ⚗️ Topic 8 Conductors, Semiconductors & Insulators ✅ Conductors High electrical conductivity, low resistivity। Current easily flow होती है। Examples: Copper, Silver, Gold, Aluminium, Steel 🔵 Semiconductors Conductivity, conductors और insulators के बीच होती है। Controllable conductivity। Examples: Silicon (Si), Germanium (Ge), Arsenide compounds ❌ Insulators High resistivity, low conductivity। Current flow नहीं होती। Examples: Rubber, Glass, Plastic, Air, Pure water 📊 Topic 9 Resistivity Table Category Material Resistivity (Ω·m) ✅ Conductors Silver 1.60 × 10⁻⁸ Copper 1.62 × 10⁻⁸ Aluminium 2.63 × 10⁻⁸ Tungsten 5.20 × 10⁻⁸ Nickel 6.84 × 10⁻⁸ Iron 10.0 × 10⁻⁸ Chromium 12.9 × 10⁻⁸ Mercury 94.0 × 10⁻⁸ Manganese 1.84 × 10⁻⁶ 🔀 Alloys Constantan (Cu + Ni) 49 × 10⁻⁶ Manganin (Cu + Mn + Ni) 44 × 10⁻⁶ Nichrome (Ni + Cr + Mn + Fe) 100 × 10⁻⁶ ❌ Insulators Glass 10¹⁰ – 10¹⁴ Hard Rubber 10¹³ – 10¹⁶ Ebonite 10¹⁵ – 10¹⁷ Diamond 10¹² – 10¹³ Paper (dry) 10¹² 🔗 Topic 10 Resistance Combination — Series & Parallel 🔗 Series Connection Resistors end-to-end connected होते हैं Current (I) = सभी में same Voltage (V) = divide होती है Req = R1 + R2 + R3 + … + Rn Total resistance = sum of all ⚡ Parallel Connection Resistors same 2 points पर connected Voltage (V) = सभी में same Current (I) = divide होता है 1/Req = 1/R1 + 1/R2 + 1/R3 + … + 1/Rn Total resistance = always कम होती है R_series = R1+R2+…+Rn Series Formula 1/R_parallel = 1/R1+1/R2+… Parallel Formula 🏠 घर में circuits Parallel में होते हैं — हर appliance को same voltage मिले और एक बंद हो तो दूसरे चलते रहें। 🔥 Topic 11 Heating Effect of Electric Current जब electric current conductor में flow करे → conductor की resistance की वजह से heat produce होती है — यही Heating Effect है। 🔥 Joule's Law of Heating: H = I²Rt | H = VIt | H = V²t/R H = I²Rt Joule's Law H = VIt Using V = IR H = V²t/R Alternate form 🔸 H = Heat energy (Joules) 🔸 I = Current (Amperes) 🔸 R = Resistance (Ohms) 🔸 t = Time (Seconds) 💡 Topic 12 Applications of Heating Effect Application Details ⚡ Electric Heater Nichrome wire heating element के रूप में use होती है 💡 Electric Bulb Tungsten filament — high melting point की वजह से use होता है 👕 Electric Iron Heating effect से कपड़े iron होते हैं 🔌 Fuse Low melting point wire — excessive current पर melt होकर circuit break करती है 📌 Nichrome क्यों use होती है heating devices में? — High resistance है + High temperatures पर easily oxidize नहीं होती! 🔌 Fuse = जब excessive current flow हो → fuse wire melt होती है → circuit break → appliances protect होते हैं। Short circuit और mismatched loads से protection। 🔁 Open और Closed Circuit 🟢 Closed Circuit Switch ON होती है Complete path बनती है Current flow होती है Lamp जलती है 🔴 Open Circuit Switch OFF होती है Path break होती है Current flow नहीं होती Lamp नहीं जलती ⚡ Topic 13 Electric Power Electric Power = वो rate जिस पर electrical energy consume या produce होती है। ⚡ P = VI | P = I²R | P = V²/R | S.I. Unit = Watt (W) P = VI Power = Voltage × Current P = I²R Using V = IR P = V²/R Alternate form 🏠 Topic 14 Commercial Unit of Energy — kWh 💡 1 unit = 1 kWh — यही electricity bill में count होती है! 🔸 1 kWh = 1 kW × 1 hour 🔸 = 1000 Watts × 3600 seconds 🔸 = 3,600,000 Joules 🔸 = 36 × 10⁵ Joules 🔸 = 3.6 × 10⁶ J 1 kWh = 3.6×10⁶ J Commercial Unit Conversion 🔌 Topic 15 Colour Coding in Household Wiring 🔴 Live Wire (Phase Wire) Color: Red | High Voltage | ⚡ Dangerous ⚫ Neutral Wire Color: Black | Voltage = 0 | Return path 🟢 Earth Wire (Ground Wire) Color: Green/Yellow | Safety wire | Thick बनाई जाती है ताकि higher currents handle हो 📋 Appliance Standard: 220V, 50Hz — India में household current यही है। 🔌 Earth wire को thick बनाया जाता है ताकि वो higher currents को low resistance के साथ manage कर सके। 🌉 Topic 16 Wheatstone Bridge 🌉 Wheatstone Bridge: Unknown resistance accurately measure करने के लिए एक electrical circuit — 4 resistors का bridge circuit बनाकर balance होता है। P/R = Q/S Wheatstone Bridge Formula ⚖️ जब bridge balanced हो (galvanometer में zero current) → P/R = Q/S। इससे unknown resistance S = QR/P calculate होती है। 🔀 Topic 17 Kirchhoff's Laws ⚡ KCL — Law of Current (Junction Rule) किसी circuit में एक node (junction) में enter होने वाला total current = उस node से leave होने वाले total current के equal। ΣI_in = ΣI_out Kirchhoff's Current Law 💡 Based on: Conservation of Charge — charge न create होती है, न destroy। 🔋 KVL — Law of Voltage (Loop Rule) किसी closed loop में सभी voltages (EMFs और voltage drops) का sum = zero। ΣV = 0 Kirchhoff's Voltage Law 💡 Based on: Conservation of Energy — energy न create होती है, न destroy। 🎯 Quick Revision All Key Formulas at a Glance I = q/t Electric Current V = W/Q Potential Difference V = IR Ohm's Law R = ρL/A Resistance R_s = R1+R2+… Series Resistance 1/R_p = 1/R1+… Parallel Resistance H = I²Rt Joule's Heating Law P = VI = I²R Electric Power 1 kWh = 3.6×10⁶ J Commercial Energy Unit P/R = Q/S Wheatstone Bridge ΣI_in = ΣI_out KCL ΣV = 0 KVL 🧠 Wire Colors Trick: 🔴 Red = Live (ख़तरनाक) | ⚫ Black = Neutral (safe) | 🟢 Green = Earth (safety wire) Nichrome = Heating · Tungsten = Bulb · Fuse = Low melting point"}, {"title": "Magnetic Effect of Electric Current", "subject": "Physics", "url": "../physics/magnetic_effect_notes.html", "text": "Magnetic Effect of Electric Current – Rise Notes 📚 Rise Notes — Lecture 8 🧲 MAGNETIC EFFECT OF ELECTRIC CURRENT Physics Notes · Simple Language · Complete Coverage 🗂️ Topics at a Glance 1 Magnetic Effect – Introduction 2 Magnetic Field Lines 3 Field due to Straight Wire 4 Maxwell's Screw Rule 5 Field due to Circular Loop 6 Ampere's Law 7 Solenoid 8 Electromagnet 9 Force on Current-Carrying Conductor 10 Fleming's Left Hand Rule 11 Fleming's Right Hand Rule 12 Electromagnetic Induction 13 Short Circuit 14 AC vs DC Current 15 Lenz's Law 16 Rheostat & Cyclotron 🧲 Topic 1 Magnetic Effect of Electric Current जब किसी conductor में electric current flow होती है → उसके around एक magnetic field produce होती है। यही Magnetic Effect of Electric Current है। 🧭 Example: Current-carrying wire के पास compass needle को रखो → needle deflect हो जाती है। 🔸 Discovered by: Hans Christian Oersted — 1820 में 🔸 Current की direction बदलो → Magnetic field की direction भी बदलती है 🔸 Current ज़्यादा → Magnetic field ज़्यादा strong 🔸 Wire के पास current न हो → compass needle North point करती है (normal) 🧲 Types of Magnets 🔵 Horseshoe Magnet 🔵 U-shaped Magnet 📊 Bar Magnet ⭕ Cylindrical Magnet 📍 Needle Magnet ⭕ Ring Magnet 🔘 Circular Magnet 🔘 Rod Magnet 🥚 Oval-shaped Magnet 🧲 Like poles repel, Unlike poles attract — North-North repel, North-South attract। 〰️ Topic 2 Magnetic Field Lines जब magnet के around iron filings scatter किए जाते हैं → वो temporary magnets बन जाते हैं (magnetic induction से) → field lines के along align होते हैं। 📏 Properties of Magnetic Field Lines 1️⃣ Outside magnet में: North pole से South pole की तरफ जाती हैं। 2️⃣ Inside magnet में: South से North की तरफ जाती हैं → closed loops बनाती हैं। 3️⃣ Lines जितनी करीब होंगी → magnetic field उतनी strong होगी। 4️⃣ Field lines कभी cross नहीं करतीं — अगर cross हों तो एक point पर दो directions होंगे जो impossible है। 5️⃣ Field lines direction और strength दोनों show करती हैं। 6️⃣ Poles के पास lines सबसे dense होती हैं → magnetic field poles पर strongest होती है। 📡 Topic 3 Magnetic Field due to Straight Current-Carrying Conductor Straight current-carrying conductor के around magnetic field concentric circles के form में होती है — wire को center मानकर। 📈 B ∝ Current Current ज़्यादा → Magnetic field stronger Double current → Double field strength 📉 B ∝ 1/Distance Wire से दूर जाने पर field weaker होती है Distance ∝ 1/B (inversely proportional) 👍 Right-Hand Thumb Rule: Right hand का thumb current direction में point करो → बाकी fingers जिस direction में curl करती हैं = magnetic field direction। ⬇️ Current downward हो → field Clockwise ⬆️ Current upward हो → field Anti-clockwise 🔩 Topic 4 Maxwell's Screw Rule 🔩 Maxwell's Screw Rule: Imagine एक right-handed screw को current की direction में turn करो — screw जिस direction में rotate करे = magnetic field lines की direction। 💡 यह Right-Hand Thumb Rule का alternate version है। दोनों same result देते हैं — बस याद करने का तरीका अलग है। ⭕ Topic 5 Magnetic Field due to Circular Current-Carrying Loop Circular loop = बहुत सारे छोटे straight current-carrying segments से बना होता है। हर segment अपने around concentric circles में field produce करता है। 🔸 Wire के पास → field lines circular होती हैं 🔸 Centre पर → field lines nearly straight और parallel होती हैं 🔸 Anti-clockwise current → field out of plane = North pole 🔸 Clockwise current → field into plane = South pole 🔸 Current reverse → magnetic field direction भी reverse 🌀 Number of turns (loops) बढ़ाओ → Magnetic field उतनी ही ज़्यादा। Mf ∝ n (turns double = field double) 📐 Topic 6 Ampere's Law 📐 Ampere's Law: \"किसी closed loop के around magnetic field का line integral, उस loop से pass होने वाले total current के proportional होता है।\" ∮ B·dl = μ₀I Ampere's Law Formula μ₀ = 4π × 10⁻⁷ Permeability of free space 🔧 Ampere's Law straight wires और solenoids में magnetic field calculate करने के लिए use होता है। 🌀 Topic 7 Solenoid Solenoid = एक long coil of wire जिसमें closely wound turns होते हैं। जब इसमें current flow होती है → यह bar magnet जैसा behave करता है। 🌀 Solenoid के अंदर magnetic field uniform और strongest होती है — center पर सबसे ज़्यादा। 🔸 Ideal solenoid के बाहर magnetic field = zero (जब length >> radius हो) 🔸 हर turn अपना magnetic field generate करता है → सब combine → strong uniform field 🔸 Current direction reverse → magnetic field direction भी reverse 🔸 Solenoid, bar magnet जैसा behavior करता है — एक end North, दूसरा South pole 🔌 Topic 8 Electromagnet 🔌 Electromagnet = Temporary Magnet — Current flow होने पर magnetic properties exhibit करता है। Current बंद → magnetism खत्म। 🔸 Coil के अंदर soft iron core रखने पर → coil का magnetic field soft iron में magnetism induce करता है 🔸 Induced magnetism temporary होती है — current चले तो magnetized, बंद हो तो normal 🔸 Soft iron core use होती है (hard steel नहीं) — क्योंकि soft iron easily magnetized और demagnetized होती है 💥 Topic 9 Force on a Current-Carrying Conductor in Magnetic Field जब current-carrying conductor किसी external magnetic field में रखा जाए → conductor पर force experience होती है — conductor के magnetic field और external field के interaction से। F = I(L × B) Force on Conductor F = ILB sinθ When angle = θ 🔸 F = Magnetic force on conductor 🔸 I = Current in conductor 🔸 L = Length of conductor in direction of current 🔸 B = Magnetic field strength 🔸 θ = Angle between L and B 📊 Force Conditions ✅ θ = 90° → Maximum Force sin 90° = 1 F = ILB (maximum) L ⊥ B ❌ θ = 0° → Zero Force sin 0° = 0 F = 0 L ∥ B (parallel) ❌ θ = 180° → Zero Force sin 180° = 0 F = 0 L anti-parallel to B 🖐️ Topic 10 Fleming's Left Hand Rule 🖐️ Fleming's Left Hand Rule: Left hand के thumb, index finger और middle finger को 90° पर extend करो — यह rule current-carrying conductor पर force की direction बताता है। 👆 Three Fingers — क्या बताते हैं? 👍 Thumb (अंगूठा) = Direction of Force (Motion) ☝️ Index Finger (तर्जनी) = Direction of Magnetic Field (B) 🖕 Middle Finger (मध्यमा) = Direction of Current (I) ⚙️ Electric Motor = Electrical energy → Mechanical energy। Fleming's Left Hand Rule यहाँ use होती है। 💡 Electric current की direction = positive charges (+) की motion की direction = electrons की direction के opposite । ✋ Topic 11 Fleming's Right Hand Rule ✋ Fleming's Right Hand Rule: Generator में induced current की direction find करने के लिए। Mechanical energy → Electrical energy। 👆 Right Hand — क्या बताते हैं? 👍 Thumb = Direction of Motion (conductor की) ☝️ Forefinger (Index) = Direction of Magnetic Field (B) 🖕 Middle Finger = Direction of Induced Current 🖐️ Left Hand Rule Electric Motor के लिए Electrical → Mechanical Force की direction find करना ✋ Right Hand Rule Generator के लिए Mechanical → Electrical Induced current की direction find करना ⚡ Topic 12 Electromagnetic Induction ⚡ Electromagnetic Induction: जब changing magnetic field के कारण conductor में EMF (electromotive force) produce हो → current produce हो, यही EM Induction है। 🔸 Discovered by: Michael Faraday — 1831 में 🔸 Conductor को moving magnetic field में रखो (AC power source के साथ) 🔸 या stationary magnetic field में conductor को move करो 🔸 Bar magnet को coil की तरफ push करो → galvanometer deflect होता है (current induced) 💡 यही principle Electric Generator में use होता है — Mechanical energy से electricity generate होती है। ⚠️ Topic 13 Short Circuit ⚠️ Short Circuit: Wire की insulation break होने से Live wire और Neutral wire आपस में contact करती हैं → current suddenly बहुत ज़्यादा बढ़ जाती है। 🔸 Short circuit = very low resistance path → बहुत ज़्यादा current flow होती है 🔸 Fuse short circuit से protect करता है — excessive current पर melt होकर circuit break करता है 🔸 Short circuit से fire और appliance damage का risk होता है 🔄 Topic 14 AC vs DC Current 🟢 DC — Direct Current Current सिर्फ एक direction में flow होती है Frequency = 0 Hz Sources: Cell, Battery Steady और constant current 🔴 AC — Alternating Current Current हर 1/100th second में direction बदलती है Frequency = 50 Hz – 60 Hz Source: Generator India में household: 220V, 50Hz 🔄 Rectifier AC → DC में convert करता है 🔁 Inverter DC → AC में convert करता है 🔌 Wire Colours (Reminder) 🔸 Live Wire = Red colour = 220V (खतरनाक) 🔸 Neutral Wire = Black colour = 0V ↩️ Topic 15 Lenz's Law ↩️ Lenz's Law: \"Induced current की direction हमेशा उस cause को oppose करती है जो उसे produce करता है।\" 🧲 N pole coil की तरफ move करो → coil का वो end भी N pole बन जाता है (repel करने के लिए = oppose करना)। 🧲 N pole coil से दूर move करो → coil का वो end S pole बन जाता है (attract करने के लिए = फिर oppose करना)। ⚖️ Lenz's Law, Conservation of Energy का consequence है — बिना energy input के induced current produce नहीं होती। ⚙️ Topic 16 Rheostat & Cyclotron 🎚️ Rheostat (Current Controller) Type: Variable Resistor Function: Voltage change किए बिना circuit में current को control करना — resistance बढ़ाकर या घटाकर। ⚛️ Cyclotron Type: Particle Accelerator Function: Charged particles (protons, ions) को बहुत high speeds और energy तक accelerate करना। 🎯 Quick Revision All Key Facts & Formulas ∮ B·dl = μ₀I Ampere's Law F = ILB sinθ Force on Conductor F = I(L × B) Vector Form Mf ∝ n Field ∝ Turns B ∝ I Field ∝ Current B ∝ 1/d Field ∝ 1/Distance 🧠 Trick — Hands: LEFT hand = Motor (Electrical → Mechanical) · RIGHT hand = Generator (Mechanical → Electrical) Thumb=Force, Index=B, Middle=Current (Left) · Thumb=Motion, Index=B, Middle=Induced Current (Right) 📅 Discoverers: Oersted (1820) → Magnetic effect · Faraday (1831) → EM Induction · Ampere → Ampere's Law"}, {"title": "Basics of Economy Foundation concepts and core economic ideas.", "subject": "Economics", "url": "../economics/economics_notes.html", "text": "Basics of Economy – Complete Notes 📊 Basics of Economy Complete Notes — Lecture 1 | Parmar SSC SSC Exam Preparation 📖 1. Economics क्या है? (What is Economics?) Definition: Economics वह study है जिसमें हम देखते हैं कि लोग, businesses और governments अपने limited resources को कैसे use करते हैं — goods & services को produce, distribute और consume करने के लिए। Economics इन 4 बड़े सवालों का जवाब देती है: 🔴 What to produce? — क्या बनाएं? (Mobile या Laptop?) 🟡 How to produce? — कैसे बनाएं? (Machine से या हाथ से?) 🟢 For whom to produce? — किसके लिए बनाएं? (Rich या Poor?) 🔵 At what price? — कितने दाम में बेचें? आपकी माँ के पास ₹500 हैं — वो decide करती हैं क्या खरीदें (vegetables, medicines, या school fees)। यही Economics है — limited resources को best तरीके से use करना। 🌿 2. Economics की Branches Economics दो main branches में divide होती है: 🔭 Macroeconomics Top-Down Approach पूरी economy को एक साथ देखते हैं। Topics: GDP, Inflation, Unemployment, Fiscal Policy 🔬 Microeconomics Bottom-Up Approach Individual / एक business को देखते हैं। Topics: Pricing, Supply & Demand, Consumer Behavior Feature Macroeconomics Microeconomics Approach Top-Down Bottom-Up Focus पूरी Economy Individual/Firm Scope Large Scale Small Scale Topics GDP, Inflation, Unemployment Pricing, Consumer Behavior Analogy पूरे जंगल की study एक पेड़ की study (जैसे Cinchona) Spillover Effect: जब एक देश में कुछ होता है तो दूसरे देश पर भी असर पड़ता है। Example: 1929 में USA की Great Depression ने पूरी दुनिया को affect किया। Macro = पूरे India की GDP देखना। Micro = Amul dairy company की pricing strategy देखना। 👨‍🏫 3. Key Historical Figures 🏆 Adam Smith — Father of Modern Economics & Microeconomics Key Book: \"The Wealth of Nations\" — published 1776 Market Economy: अगर लोग अपना self-interest देखें, तो पूरी economy को फायदा होता है। Invisible Hand: Market की unseen forces (Demand & Supply) economy को automatically balance करती हैं — बिना government के। Laissez-Faire: Government को economy में कम से कम दखल देना चाहिए। Reliance का Jio — खुद के profit के लिए launched किया, लेकिन पूरे India में internet सस्ता हो गया — यही Invisible Hand है! Alfred Marshall भी Father of Microeconomics कहलाते हैं, लेकिन अगर दोनों options में हों तो Adam Smith choose करो। 🏆 John Maynard Keynes — Father of Macroeconomics Key Book: \"The General Theory of Employment, Interest and Money\" — published 1936 Context: 1929 की Great Depression (Stock Market Crash → Deflation → Unemployment) के बाद उन्होंने theory दी। Core Idea: Laissez-Faire काफी नहीं है — economic downturn में Government को actively intervene करना चाहिए। Animal Spirits: लोगों का irrational behavior जो economy को affect करता है। COVID-19 के दौरान India सरकार ने ₹20 लाख crore का stimulus package दिया — यही Keynesian Economics है! 🏛️ 4. Economic Systems (अर्थव्यवस्था के प्रकार) Feature Capitalist (Market) Socialist (Non-Market) Mixed Economy Ownership Private Government/State Both Motive Profit Social Welfare Profit + Welfare Govt. Role No role (Laissez-Faire) Complete Control Limited/Regulated Income Very Unequal Equal (theory) Less Unequal Freedom Complete None Limited Example 🇺🇸 USA 🇰🇵 USSR, North Korea 🇮🇳 India 🇮🇳 India का Special Note — License Raj 1991 से पहले India में License Raj (Permit Raj) था — हर business के लिए government permission चाहिए थी। 1991 में Balance of Payments (BoP) Crisis आई — India के पास foreign exchange खत्म हो गया। फिर LPG Reforms लाए गए: L iberalization + P rivatization + G lobalization इसे लाया: PM P.V. Narasimha Rao और Finance Minister Dr. Manmohan Singh ने। Capitalist = Mukesh Ambani अपनी company खुद चलाते हैं। Socialist = USSR में सब factories government की थीं। Mixed = India में Reliance (Private) भी है और ONGC (Govt.) भी। 📦 5. Classification of Goods (वस्तुओं का वर्गीकरण) Goods को 2 criteria पर classify करते हैं: 1️⃣ Excludability — क्या बिना pay किए use हो सकता है? Excludable: पहले pay करो, तभी use करो। (Cinema ticket, Netflix) Non-Excludable: कोई भी free में use कर सकता है। (Air, Streetlight) 2️⃣ Rivalry — एक के use से दूसरे का हिस्सा कम होता है? Rivalrous: मैंने खाया तो तुम नहीं खा सकते। (Apple, Car) Non-Rivalrous: मेरे देखने से तुम्हारा कुछ कम नहीं होता। (Sunset, Air) इन दोनों को मिलाकर 4 types of goods बनती हैं: 🛒 Private Goods Excludable + Rivalrous Pay भी करो, कम भी होता है। Examples: Food, Clothes, Cars, Parking Space 🎬 Club Goods Excludable + Non-Rivalrous Pay करो, लेकिन कम नहीं होता। Examples: Cinema, Netflix, Satellite TV, Private Park 🐟 Common Pool Resources Non-Excludable + Rivalrous Free में use, लेकिन कम होता जाता है। Examples: Ocean fish, Forest timber, Coal 🛡️ Public Goods Non-Excludable + Non-Rivalrous Free for all, कभी कम नहीं होता। Examples: National Defense, Air, Street Lights, Free TV ⚠️ Free Rider Problem Public Goods की problem — लोग बिना pay किए benefit उठाते हैं। Street light सबके लिए जलती है, चाहे आपने tax दिया हो या नहीं — यही Free Rider Problem है। 💰 Opportunity Cost जो best alternative छोड़ा, उसकी value = Opportunity Cost। Natural resources जैसे Sunlight का consumer के लिए opportunity cost = 0 (Zero) होता है। अगर आप job छोड़कर UPSC prepare करते हैं, तो उस salary का cost ही Opportunity Cost है। 🏭 6. Sectors of the Economy (अर्थव्यवस्था के क्षेत्र) 🌾 1. Primary Sector Red Collar Jobs सीधे nature/environment पर depend करने वाली activities। Examples: Agriculture, Fishing, Hunting, Forestry, Mining 📌 India में: \"Backbone of Indian Economy\" — सबसे ज़्यादा employment (54.60% LFPR) ⚠️ लेकिन GDP share सबसे कम: ~14.39% 🏗️ 2. Secondary Sector Blue Collar Jobs Raw materials को valuable products में transform करना। Examples: Manufacturing, Construction, Electricity, Food Processing 📌 Developed nations (जैसे China) की backbone। ⚠️ India में यह sector अभी proper develop नहीं हुआ — India ने Industrialization skip करके directly Service sector में jump किया। 💼 3. Tertiary Sector White Collar Jobs Service Sector — intangible (न छू सकें) services provide करता है। Examples: Teaching, Banking, Transportation, Hospitality, Retail 📌 India में: सबसे ज़्यादा GDP share ~54.15%, लेकिन employment कम (21.10%) Tertiary Sector के Sub-divisions: 💻 A. Quaternary Sector Knowledge-based & intellectual services। Examples: IT Professionals, Research & Development, Consultants 👑 B. Quinary Sector Gold Collar Jobs Highest level की decision-making और policy creation। Examples: CEOs, Top Government Officials, Research Scientists, Policymakers 📊 India Sector Statistics (2011 Census): 54.6% Primary LFPR (Highest Employment) 24.3% Secondary LFPR 21.1% Tertiary LFPR (Lowest Employment) ~14.4% Primary GDP Share (Lowest) ~31.5% Secondary GDP Share ~54.2% Tertiary GDP Share (Highest) 👩‍🌾 Women engaged in Primary Sector: 62.8% Primary Sector = Highest Employment, Lowest GDP. Tertiary Sector = Lowest Employment, Highest GDP। यह paradox exam में बहुत आता है! 🗂️ 7. Other Economic Classifications ✅ Organized Sector vs ❌ Unorganized Sector Feature Organized Unorganized Registration Govt. में registered Not registered Job Security High No security Benefits PF, Pension, Fixed Hours None Examples Govt. Jobs, MNCs Small shop helpers, Domestic workers ⚠️ India में 90% से ज़्यादा workers Unorganized Sector में हैं! 📱 e-Shram Portal — Unorganized workers को register करने के लिए launch किया गया। Infosys employee = Organized. रेहड़ी वाला, घर में काम करने वाली बाई = Unorganized। 🏗️ Real Sector vs 💰 Financial Sector Real Sector: Actual goods & services produce करता है। Raw materials, land, labor use होती है। Examples: Factories, Farms Financial Sector: Financial assets deal करता है। Examples: Mutual Funds, Stocks, Banking Tata Steel में steel बनना = Real Sector। SBI में FD करना = Financial Sector। 🚚 Aids (Auxiliaries) to Trade ये वो services हैं जो goods को production से consumption तक पहुँचाने में help करती हैं। Examples: Transportation, Banking, Insurance, Warehousing, Advertising Amazon delivery = Transportation। Flipkart का ad = Advertising। Godown में रखना = Warehousing। — ये सब Auxiliaries to Trade हैं। 📊 Normative vs Positive Economics Feature Positive Economics Normative Economics Basis Facts & Data Opinions & Judgments Nature \"What IS\" \"What OUGHT to be\" Verifiable? ✅ Yes (Scientific) ❌ No (Idealistic) Example \"Unemployment rate IS 20%\" \"Unemployment SHOULD be 5%\" News में पढ़ा: \"India की GDP 7% बढ़ी\" = Positive Economics। Budget speech में: \"Poverty खत्म होनी चाहिए\" = Normative Economics। 🕵️ Parallel Economy (Shadow/Black Economy) यह unsanctioned (unauthorized) sector है जो Black Money पर चलता है। Black Money = वो income जो tax authorities को नहीं बताई गई, या illegal activities (जैसे trafficking) से आई। इसकी वजह से government policies ineffective हो जाती हैं — क्योंकि यह money tax नहीं देता। Property बेचकर cash में लेना और income tax न देना = Parallel Economy में योगदान। ⚡ Quick Revision — सभी Key Points एक नज़र में Topic Key Fact Economics के Father Adam Smith (Micro/Modern), Keynes (Macro), Alfred Marshall (Micro) Wealth of Nations Adam Smith — 1776 General Theory Keynes — 1936 Great Depression 1929 — Stock Market Crash USA LPG Reforms 1991 — P.V. Narasimha Rao + Manmohan Singh Invisible Hand Adam Smith — Market forces balance economy India's Economy Type Mixed Economy Highest Employment Sector Primary (54.6%) Highest GDP Sector Tertiary (54.15%) Women in Primary Sector 62.8% Unorganized workers India >90% e-Shram Portal Unorganized workers registration Free Rider Problem Public Goods में होता है Gold Collar Jobs Quinary Sector"}, {"title": "Microeconomics Demand, supply and microeconomic fundamentals.", "subject": "Economics", "url": "../economics/microeconomics_notes.html", "text": "Microeconomics – Lecture 2 Notes | Parmar SSC 📉 Microeconomics Complete Detailed Notes — Lecture 2 | Parmar SSC SSC Exam Preparation ⚠️ 1. Central Problem of Economics (Economics की मूल समस्या) Economics की मूल समस्या यह है कि Resources (संसाधन) Limited हैं लेकिन Human Wants (इंसान की ज़रूरतें) Unlimited हैं। 🔴 Scarcity (कमी) Resources — Money, Land, Labor, Time — सब limited (सीमित) हैं। सबकुछ एक साथ नहीं मिल सकता। 🔵 Choice (चुनाव) क्योंकि resources limited हैं, economy को choose करना पड़ता है — क्या produce करें, क
