ergy, Growth और Repair के लिए जरूरी पदार्थ लेता है। Nutrients दो categories में बँटे होते हैं — Macronutrients (large amounts में) और Micronutrients (small amounts में)। 💪 Macronutrients Body को बड़ी मात्रा में चाहिए होते हैं। Carbohydrates Fats Proteins 🔬 Micronutrients Body को थोड़ी मात्रा में चाहिए होते हैं। Vitamins Minerals 1 Carbohydrates — Quick Energy 🍚 Carbohydrates क्या हैं? Carbon, Hydrogen और Oxygen से बने biomolecules Body के लिए Quick Energy source 1 gm Carbohydrate = 4 Calories Potato में Starch भरपूर मात्रा में होता है 🔗 Types of Carbohydrates Type Structure Examples Monosaccharides (Simple) 1 sugar unit — सबसे छोटा form Glucose, Fructose, Galactose Disaccharides (Simple) 2 monosaccharide units जुड़े Sucrose, Lactose (milk sugar), Maltose (grain sugar) Polysaccharides (Complex) कई sugar units जुड़े Glycogen, Starch, Cellulose 2 Fats — Energy Store 🧈 Fats के बारे में 1 gm Fat = 9 Calories — सबसे ज्यादा energy Energy, cell structure building, और body functions के लिए जरूरी Body में fat Adipose tissue में Triglycerides के रूप में store होता है ❌ Saturated Fat Molecules tightly packed → easily digest नहीं होते Higher melting point Found in: Red meat, pork Excess में LDL (Bad Cholesterol) बढ़ाता है — harmful! ✅ Unsaturated Fat Easily digest होते हैं — healthier! Found in: Vegetable oil, nuts, seeds HDL (Good Cholesterol) promote करते हैं ⚠️ Trans Fat = सबसे हानिकारक! यह तब बनता है जब Unsaturated fats को Hydrogenation process से Saturated fats में convert किया जाता है — जैसे Fast Food में। 🐟 Omega-3 Sources: Flax seeds, Chia seeds, Walnuts, Fatty fish, Eggs — Heart के लिए बहुत फायदेमंद! 🍚 Carbs 4 Calories per gram 💪 Protein 4 Calories per gram 🧈 Fat 9 Calories per gram 3 Proteins — Body Builder 🥚 Proteins क्या हैं? Proteins छोटे units Amino Acids से बने होते हैं Requirement: 0.8 gm/kg body weight per day Sources: Egg, yolk, soybeans, pulses, chicken, fish Egg white cook होने पर सफेद हो जाता है — Protein Denaturation के कारण! 🔗 Protein Sources — कहाँ कौनसा Protein? Source Protein Name 🥛 Milk Casein 💇 Hair / Nail Keratin 🍚 Rice Glutelin, Albumin 🌾 Grains Gluten 🥚 Egg White Albumin 🧬 Amino Acids — Proteins की Building Blocks Total 20 Amino Acids होते हैं 9 Essential — Body खुद नहीं बना सकती, diet से लेनी पड़ती हैं 11 Non-Essential — Body खुद बना सकती है ✅ Non-Essential Amino Acids (11) Glycine, Serine, Proline, Glutamic acid, Alanine, Aspartic acid, Cystine, Tyrosine, Asparagine, Glutamine ⭐ Essential Amino Acids (9) Histidine Isoleucine Leucine Lysine Methionine Phenylalanine Threonine Tryptophan Valine 📋 Essential Amino Acids — Functions Amino Acid Function Histidine Growth, tissue repair, histamine production (immune response) Isoleucine Muscle metabolism, energy regulation Leucine Protein synthesis, muscle repair, blood sugar regulate करता है Lysine Calcium absorption, collagen formation, immune function Methionine Metabolism और detoxification Phenylalanine Neurotransmitters (Dopamine, Epinephrine) — mood & alertness Threonine Protein balance, tooth enamel, fat metabolism Tryptophan Serotonin और Melatonin का precursor — mood & sleep Valine Muscle growth, tissue repair, energy 😢 Kwashiorkor Severe protein deficiency से Fluid retention → पेट फूल जाता है Mainly children affected (developing countries) 😢 Marasmus Calories और protein दोनों की कमी Muscle mass और fat loss → body wasting बच्चों में poverty और food scarcity से 🦴 Collagen — हमारे body का सबसे abundant protein है। यह skin, bone joints जैसे extracellular spaces में मिलता है। Triple helical structure discover किया: G.N. Ramachandran ने। Collagen synthesis के लिए Vitamin C जरूरी है। 4 Vitamins — Micronutrients 💊 Vitamins क्या हैं? Essential organic substances जो foods में मिलती हैं Small amounts में लेकिन growth, metabolism, और nervous system के लिए जरूरी 1912: Casimir Funk ने \"Vitamin\" शब्द coin किया 💧 Water Soluble Vitamins पानी में घुलते हैं Body में store नहीं होते रोज लेने पड़ते हैं Vitamins: B (सभी) और C 🧈 Fat Soluble Vitamins Fat में घुलते हैं Body के fatty tissues और liver में store होते हैं Vitamins: A, D, E, K याद करें: \"ADEK\" 📋 Complete Vitamin Chart — Scientific Name + Deficiency + Sources Vitamin Scientific Name Deficiency/Disease Sources Vitamin A Retinol Night Blindness (रात को दिखना बंद) Spinach, Carrots, Sweet potatoes Vitamin B1 Thiamine Beriberi Meat, eggs, legumes Vitamin B2 Riboflavin RBC में कमी Dairy, eggs, green vegetables Vitamin B3 Niacin Pellagra (3D Disease) Meat, seafood, eggs Vitamin B5 Pantothenic Acid Fatigue, numbness, muscle cramps Meat, poultry, legumes Vitamin B6 Pyridoxine Anaemia Poultry, fish, potatoes Vitamin B7 Biotin Hair loss, brittle nails, skin rashes Eggs, nuts, seeds Vitamin B9 Folic Acid Fatigue, Neural tube defects in babies Legumes, leafy vegetables Vitamin B12 Cyanocobalamin Pernicious Anaemia, Memory loss Meat, seafood, dairy Vitamin C Ascorbic Acid Scurvy (मसूड़ों से खून) Lemon, oranges, amla, strawberries Vitamin D Calciferol Osteomalacia, Rickets Cod liver oil, salmon, egg yolk, Sunlight Vitamin E Tocopherol Anti-sterility, vision problems Kale, spinach, lettuce, parsley Vitamin K Phylloquinone Excessive bleeding, poor clotting Soya bean, coriander, peas ☀️ Vitamin D — Sunshine Vitamin \" Sunshine Vitamin \" और Hormone दोनों माना जाता है Sunlight से skin में produce होता है Liver और Kidneys इसे Calcitriol (active form) में convert करते हैं Blood के through bones को calcium absorb करने में help करता है Vitamin D2 (Ergocalciferol): Calcium absorption में help Vitamin D3 (Cholecalciferol): Blood में Vit D levels ज्यादा effectively बढ़ाता है 🦴 Osteoporosis Bone mineral density और bone mass कम हो जाती है → हड्डियाँ कमजोर 🦴 Osteomalacia \"Soft Bones\" — metabolic bone disease, fracture का risk बढ़ता है 👦 Rickets बच्चों में होता है — bones soft और bent हो जाती हैं ⚠️ Pellagra = 3D Disease — Vitamin B3 (Niacin) की कमी से। 3D मतलब: Dementia + Dermatitis + Diarrhoea 5 Minerals — Inorganic Nutrients ⚗️ Minerals क्या हैं? Naturally occurring, inorganic chemical elements Small amounts में लेकिन development और functioning के लिए जरूरी Millets जैसे Jowar, Bajra, Ragi में minerals भरपूर होते हैं 🦴 Magnesium (Mg) Metabolism में involved Bone health support करता है Adult body में ~ 25g magnesium होता है 🔧 Zinc (Zn) Wound healing के लिए जरूरी Protein synthesis में role Cell growth में help करता है 🫀 Iodine (I) Thyroid hormone का essential component Metabolism, growth, development regulate करता है Brain function और cognitive development 💧 पानी में Excess Fluoride होने से Fluorosis बीमारी होती है — दाँत और हड्डियाँ damage होती हैं। 🌱 NUTRITION IN PLANTS 6 Modes of Nutrition 🌿 Autotrophic Nutrition Organism खुद अपना food बनाता है Light, water, CO₂ और other chemicals use करता है Examples: Green plants, Blue-green algae, Phytoplanktons 🐛 Heterotrophic Nutrition Organism दूसरों से nutrition लेता है Plant या animal matter खाता है Examples: Fungi, Amoeba, Man 🔀 Heterotrophic के तीन प्रकार Type क्या करता है Examples Saprophytic Dead organic matter से nutrients लेता है Fungi, Yeast Parasitic दूसरे living plant/animal (host) से nutrition लेता है Cuscula, Plasmodium, Nematodes Holozoic Solid/liquid food खाता है और internally digest करता है Man, Dog, Amoeba 🪴 Carnivorous/Insectivorous Plants: Venus Flytrap, Pitcher Plant, Sundew, Bladderwort — ये insects खाकर nutrients लेते हैं! 7 Photosynthesis — Food Making Process ☀️ Photosynthesis क्या है? Green plants sunlight, CO₂ और water से अपना food बनाते हैं Leaves में, chlorophyll वाले cells में होता है Sunlight पानी को Hydrogen और Oxygen में split करती है CO₂ + Hydrogen → Glucose बनता है Oxygen byproduct के रूप में release होती है Mesophyll cells = Photosynthesis का primary site Guard cells = Stomata के opening/closing को regulate करती हैं 6CO₂ + 6H₂O →(Sunlight + Chlorophyll)→ C₆H₁₂O₆ + 6O₂ Carbon dioxide + Water → Glucose + Oxygen 8 Chloroplast — Photosynthesis की Factory 🍃 Chloroplast क्या है? Plant cells और algae में organelle जो sunlight को chemical energy में convert करता है Chlorophyll plant को Green बनाता है क्योंकि यह Red और Blue light absorb करता है, Green reflect करता है 🏗️ Structure of Chloroplast Part Function Outer Membrane Protective layer — small molecules pass करने देती है Inner Membrane Materials के movement को control करती है Stroma Fluid-filled space जहाँ Calvin Cycle (Dark Reaction) होती है Thylakoids Disc-shaped sacs जिनमें chlorophyll होता है Grana (Granum) Thylakoids के stacks — यहाँ Light Reaction होती है Lamella Grana को connect करने वाले membranous bridges 💡 Light Dependent Reaction Location: Thylakoid membranes Light पानी को H और O में split करती है Output: ATP और NADPH बनते हैं 🌙 Light Independent Reaction (Calvin Cycle) Location: Stroma ATP और NADPH use होते हैं CO₂ → Glucose में convert होता है 🍃 Chlorophyll a vs Chlorophyll b Feature Chlorophyll a Chlorophyll b Role Primary Pigment Accessory Pigment Function Light → Chemical Energy convert करता है Energy Chlorophyll a को transfer करता है Color Blue-green Yellow-green Present in Reaction Center Light-harvesting Complex 🎨 Plant Pigments — Color कहाँ से आता है? 🟡🟠 Carotenoids Yellow & Orange color — Carrot, Papaya, Autumn leaves 🔴🟣 Anthocyanins Red, Purple, Blue — Red cabbage, Berries, Apple 🟢🌿 Chlorophyll Green color — Photosynthesis में most important role 9 Plant के Macronutrients & Micronutrients 💪 Macronutrients (Plants) Soil से मिलते हैं N - Nitrogen P - Phosphorus K - Potassium S - Sulphur Ca - Calcium Mg - Magnesium Air & Water से: C (Carbon), H (Hydrogen), O (Oxygen) 🔬 Micronutrients (Plants) Fe - Iron Mn - Manganese Cu - Copper Zn - Zinc B - Boron Cl - Chlorine Mo - Molybdenum 🌱 Major Macronutrients — Functions in Plants Nutrient Symbol Main Function Nitrogen N Green, leafy growth promote करता है। Chlorophyll का core building block — plant food बनाने के लिए जरूरी Phosphorus P Root development, flowers और seeds के लिए। Roots से Leaves तक energy transfer system Potassium K Overall immunity boost और water balance regulate। Stomata control से disease fight और drought survive Calcium Ca Structural support — \"cement\" की तरह cell walls को hold करता है Magnesium Mg Photosynthesis drive करता है। Chlorophyll molecule का central atom — इसके बिना leaves yellow हो जाती हैं Sulphur S Amino acids बनाने के लिए essential — proteins, enzymes और vitamins के लिए जरूरी 🌿 Nitrogen Fixation: Legumes (lentils etc.) को fertilisers की जरूरत नहीं — इनकी roots में Rhizobium और Azotobacter bacteria होते हैं जो atmospheric Nitrogen को fixed Nitrogen में convert करते हैं। 🧪 Urea (CH₄N₂O): Nitrogen-containing fertilizer — 1828 में Friedrich Wöhler ने synthesise किया। 10 Important Plant Terms 🏜️ Xerophytes Dry या arid environments में survive करने वाले plants। Limited water में adapt। E.g. Cactus ☀️ Heliophytes \"Sun-loving plants\" — full sun exposure में best grow करते हैं। 🌍 Neophytes Non-native plant species जो किसी geographical region में recently introduce हुई हों। 🔬 Protophytes Primitive, simple, microscopic plants — plant life का earliest form। E.g. Algae ✓ Quick Revision — Exam Ready! Topic Key Fact Carbohydrates energy 4 Cal/gm | Fat = 9 Cal/gm | Protein = 4 Cal/gm Fat storage Adipose tissue में Triglycerides के रूप में Bad Cholesterol LDL (Saturated fat से) | Good = HDL (Unsaturated fat से) Trans Fat सबसे harmful — Hydrogenation process से बनता है Protein requirement 0.8 gm/kg body weight per day Amino Acids Total 20 | 9 Essential | 11 Non-Essential Tryptophan Serotonin & Melatonin का precursor Vitamin term coined Casimir Funk — 1912 Water Soluble Vitamins B and C | Fat Soluble = A, D, E, K (ADEK) Vitamin A deficiency Night Blindness | Scientific name: Retinol Vitamin B1 deficiency Beriberi | Thiamine Vitamin B3 deficiency Pellagra (3D Disease) | Niacin Vitamin B12 deficiency Pernicious Anaemia | Cyanocobalamin Vitamin C deficiency Scurvy (bleeding gums) | Ascorbic Acid Vitamin D Sunshine Vitamin + "}, {"title": "Genetics & Skeletal System", "subject": "Biology", "url": "../biology/genetics_skeletal_notes.html", "text": "Genetics & Skeletal System – RISE NOTES RISE NOTES · Biology Notes Genetics & Skeletal System Complete Notes · Heredity से Joints तक 📋 Topics at a Glance 1 Heredity & Variations 2 Types of Traits & Alleles 3 Gregor Mendel — Father of Genetics 4 Mendel's 3 Laws of Inheritance 5 Monohybrid Cross (3:1 Ratio) 6 Dihybrid Cross (9:3:3:1 Ratio) 7 Sex Determination 8 Skeletal System — Overview 9 Axial Skeleton 10 Skull & Ear Bones 11 Appendicular Skeleton 12 Bone Counts — Arm, Hand, Leg, Foot 13 Joints — Synovial, Fibrous, Cartilaginous 14 Teeth & Dental Formula 15 Homologous & Analogous Organs 16 Quick Revision Table 🧬 PART 1 — GENETICS 1 Heredity & Variations 🧬 Heredity क्या है? Parents से offspring को genes के through traits pass होने की biological process Eye colour, blood group, genetic disorders — सब इसी से transmit होते हैं Heredity की basic unit = Gene (made of DNA) Physical, behavioural और physiological traits सब heredity से आते हैं 🔀 Variations क्या हैं? एक species के individuals में traits में differences Genetic variations या environmental factors से Variation survivability के लिए जरूरी है Sexual organisms में ज्यादा variation होता है (asexual में कम — सिर्फ 1 parent) 2 Types of Traits & Alleles 📌 Types of Traits Acquired Traits: जीवनभर में environment से develop हों। E.g. Bike चलाना, Teaching Inherited Traits: Parents से DNA के through मिलें। E.g. Eye colour, Blood group Qualitative Traits: जैसे Eye color Quantitative Traits: जैसे Height, Blood pressure 🔗 Alleles Genes के alternate forms — chromosome पर same location पर Same trait को control करते हैं लेकिन different effects produce करते हैं Dominant Traits: जब एक या दोनों alleles dominant हों तब express होता है Recessive Traits: जब दोनों alleles recessive हों तभी express होता है 🌿 Pea Plant — Dominant vs Recessive Traits Trait Dominant ✅ Recessive ❌ Seed Shape Round (गोल) Wrinkled (सिकुड़ा) Seed Colour Yellow (पीला) Green (हरा) Flower Colour Purple (बैंगनी) White (सफेद) Flower Position Axial Terminal Plant Height Tall (लंबा) Short (छोटा) Pod Shape Inflated (फूला) Constricted (सिकुड़ा) Pod Colour Green (हरा) Yellow (पीला) 3 Gregor Mendel — Father of Genetics 👨‍🔬 Mendel के बारे में Gregor Johan Mendel = \"Father of Genetics\" Experiments: Pea Plant (Pisum sativum) पर inheritance traits के Pea Plant क्यों चुना? 4 कारण: उगाना आसान था छोटा life cycle Self-pollinate या hand से cross-pollinate हो सकता था Traits easily observable थे | Self-pollination से pure offspring आसानी से मिलते थे 4 Mendel के 3 Laws of Inheritance ⚖️ Law 1 — Law of Dominance जब contrasting traits वाले parents cross किए जाते हैं, तो offsprings में सिर्फ dominant trait दिखता है। Recessive trait छुप जाती है। 🔀 Law 2 — Law of Segregation Gametes बनते समय gene variants (alleles) के pairs एक-दूसरे से अलग (separate) हो जाते हैं। हर gamete को सिर्फ एक allele मिलती है। 🎲 Law 3 — Law of Independent Assortment Gamete formation के दौरान दो या ज्यादा different genes के alleles independently (एक-दूसरे से independent होकर) sort होते हैं। यानी एक gene की allele दूसरे gene की allele को affect नहीं करती। 5 Monohybrid Cross (3:1 Ratio) 🌿 Monohybrid Cross क्या है? एक single trait को study करने वाला genetic experiment दो organisms को cross करते हैं जो एक trait में differ करते हैं E.g.: Tall pea plant × Short (dwarf) pea plant Phenotype = Physical traits (जो दिखता है) Genotype = Genetic makeup (अंदर क्या है) 🧪 F1 Generation Tall (TT) × Short (tt) cross किया सभी offspring: Tt (Tall) Genotype: Tt | Phenotype: All Tall Recessive trait छुप गई 🧪 F2 Generation (Self-fertilization) F1 (Tt × Tt) → F2 Genotype ratio: TT : Tt : tt = 1:2:1 Phenotype ratio: Tall : Dwarf = 3:1 Recessive trait वापस आई! 3 Dominant (Tall) Plants : 1 Recessive (Short) Plants = Monohybrid Cross F2 Phenotype Ratio 6 Dihybrid Cross (9:3:3:1 Ratio) 🌿 Dihybrid Cross क्या है? दो different traits involve होती हैं, हर trait में दो contrasting alleles दोनों parents दोनों traits के लिए heterozygous होते हैं E.g.: Yellow Round seeds (YYRR) × Green Wrinkled seeds (yyrr) 🧪 F1 Generation सभी offspring: YyRr Phenotype: सभी Yellow Round दोनों dominant traits दिखीं कोई recessive trait नहीं दिखी 🧪 F2 Generation 4 types के offspring मिले Ratio: 9:3:3:1 9 Yellow Round (Both Dominant) : 3 Yellow Wrinkled (1 Dom, 1 Rec) : 3 Green Round (1 Dom, 1 Rec) : 1 Green Wrinkled (Both Recessive) 7 Sex Determination 🧬 Sex Determination क्या है? वह biological system जो decide करता है कि कोई organism Male होगा या Female। Genetic, chromosomal, environmental factors पर based। 🧬 Human Chromosomes Total: 23 pairs of chromosomes 22 pairs = Autosomes 1 pair = Sex chromosomes Female: XX Male: XY 👶 Baby का sex कौन decide करता है? Father's sperm decide करता है (Mother नहीं!) Mother's ovum → हमेशा X chromosome carry करता है Sperm में X होगा → X+X = Female (XX) Sperm में Y होगा → X+Y = Male (XY) XO → Turner's Syndrome (Only in Females — एक X chromosome missing) XXY → Klinefelter's Syndrome (Only in Males — extra X chromosome) 🦴 PART 2 — SKELETAL SYSTEM 8 Skeletal System — Overview 🦴 Skeletal System क्या है? Body का framework — support, protection और movement provide करता है Bones, Cartilage और Ligaments से मिलकर बना दो भागों में divide: Axial Skeleton + Appendicular Skeleton 206 Adult Human में कुल Bones 300 बच्चों में Bones (fuse होकर 206 बनती हैं) 80 Axial Skeleton की bones 126 Appendicular Skeleton की bones 9 Axial Skeleton 🦴 Axial Skeleton — क्या है? Brain, spinal cord, heart और lungs को protect करता है Head, neck और body को support करता है Muscles attachment के लिए rigid framework provide करता है Atlas = वह bone जो scalp को spine से connect करती है और head को support करती है 🦴 Spinal Cord की Bones — Adults में सिर्फ 26! Region Vertebrae याद रखें Cervical (गर्दन) 7 C1-C7 Thoracic (ऊपरी पीठ) 12 T1-T12 Lumbar (निचली पीठ) 5 L1-L5 Sacral 5 → fuse → 1 Sacrum S1-S5 Coccygeal (Tailbone) 4 → fuse → 1 Coccyx Tailbone 🦴 Rib Cage — Total: 24 + 1 (Sternum) = 25 Sternum = Chest का central part — ribs से cartilage के through connected True Ribs 1st to 7th pair Vertebrosternal Ribs False Ribs 8th to 10th pair Vertebrochondral Ribs Floating Ribs 11th & 12th pair Vertebral Ribs 10 Skull & Ear Bones 💀 Skull की Bones Total: 22 bones Cranial bones: 8 (Brain को protect करती हैं) Facial bones: 14 Mandible = Skull की एकमात्र movable bone! Frontal ×1 Parietal ×2 Temporal ×2 Occipital ×1 Sphenoid ×1 Ethmoid ×1 👂 Ear की Bones Total: 3 × 2 = 6 bones हर कान में 3 bones Malleus (Hammer) Incus (Anvil) Stapes (Stirrup) 11 Appendicular Skeleton 🦾 Appendicular Skeleton — क्या है? Limb movement के लिए support और leverage provide करता है Locomotion facilitate करता है Primarily movement में involved bones — shoulder, pelvis, limbs Clavicle: 2 | Scapula: 2 | Pelvis: 2 12 Bone Counts — Arm, Hand, Leg, Foot 💪 Arm की Bones (1 arm में) Total: 3 bones Humerus (ऊपरी भुजा) Radius (lower arm — thumb side) Ulna (lower arm — pinky side) 3 × 2 = 6 bones (दोनों arms) ✋ Hand की Bones (1 hand में) Total: 27 bones Phalanges: 14 (fingers) Metacarpals: 5 (palm) Carpals: 8 (wrist) 27 + 3 (arm) = 30 per arm → 60 bones (दोनों arms) 🦵 Leg की Bones (1 leg में) Total: 4 bones Femur (thigh bone — सबसे लंबी bone) Patella (kneecap) Tibia (shinbone) Fibula (calf bone) 4 × 2 = 8 bones (दोनों legs) 🦶 Foot की Bones (1 foot में) Total: 26 bones Tarsals: 7 (ankle) Metatarsals: 5 (arch) Phalanges: 14 (toes) 26 × 2 = 52 bones (दोनों feet) 13 Joints — 3 Types 💧 Synovial Joints Fluid-filled cavity (synovial fluid) Wide range of motion E.g.: Knee, Elbow, Shoulder 🔒 Fibrous Joints Dense connective tissue से जुड़े Little to NO movement E.g.: Skull की sutures, Teeth और jawbone 🦷 Cartilaginous Joints Cartilage से जुड़े — slight movement E.g.: Vertebrae के बीच joints, Ribs + Sternum ⚙️ Types of Synovial Joints 🔵 Ball & Socket 360° rotation (सभी directions में) E.g. Shoulder, Hip 🚪 Hinge 180° motion (door की तरह open/close) E.g. Elbow, Knee 🔄 Pivot Left/right twisting on single axis E.g. Neck (Atlas-Axis) ↔️ Gliding Short flat sliding movements E.g. Wrist, Ankle 🎠 Saddle 2-way movement (up/down + side/side) No full rotation 🥚 Condyloid 2-way movement (Oval joints के लिए) 14 Teeth & Dental Formula 🦷 Enamel Enamel = Body का सबसे कठोर (Hardest) हिस्सा — Calcium phosphate से बनी 🦷 Adult Teeth — Total 32 Permanent Teeth 16 upper jaw + 16 lower jaw (wisdom teeth including) Type Count (1 jaw) Function 🔪 Incisors 4 (per jaw) = 8 total Biting और Cutting food 🐺 Canine 2 (per jaw) = 4 total Tearing food 🔧 Premolars 4 (per jaw) = 8 total Grinding food 🦷 Molars 6 (per jaw) = 12 total Chewing और Crushing food 🥛 Milk Teeth (Baby Teeth) Total: 20 teeth Formula: I=2, C=1, M=2 per half jaw 212/212 × 2 = 20 🦷 Permanent Teeth Total: 32 teeth Formula: I=2, C=1, PM=2, M=3 per half jaw 2123/2123 × 2 = 32 15 Homologous & Analogous Organs 🔵 Homologous Organs Same structure , different function Common ancestor से inherited होते हैं E.g.: Human arm, Bat's wing, Whale's flipper, Horse's forelimb — सब same bone structure! यह Divergent Evolution का evidence है 🟡 Analogous Organs Different structure , same function Different species में, common ancestor नहीं E.g.: Butterfly का wing + Bird का wing — दोनों उड़ने के काम आते हैं लेकिन structure अलग यह Convergent Evolution का evidence है 16 Quick Revision — Exam Ready! Topic Key Fact Father of Genetics Gregor Johan Mendel | Pea plant (Pisum sativum) पर experiment Law 1 — Dominance Contrasting parents cross → सिर्फ dominant trait दिखता है F1 में Law 2 — Segregation Gamete बनते time alleles separate होती हैं | हर gamete = 1 allele Law 3 — Indep. Assortment Different genes की alleles independently sort होती हैं Monohybrid F2 ratio Phenotype = 3:1 | Genotype = 1:2:1 Dihybrid F2 ratio 9:3:3:1 (4 types of offspring) Phenotype vs Genotype Phenotype = दिखने वाले traits | Genotype = Genetic makeup Sex determination Father's sperm decide करता है | Mother = always X | Father = X या Y Female chromosomes XX (23 pairs total — 22 autosomal + 1 sex) Male chromosomes XY Turner's Syndrome XO — Female में 1 X missing Klinefelter's Syndrome XXY — Male में extra X Adult bones 206 | Children = 300 Axial bones 80 | Appendicular = 126 Spinal cord bones 26 (Cervical 7, Thoracic 12, Lumbar 5, Sacral 1, Coccyx 1) Atlas bone Scalp को spine से connect करती है — head support Rib cage 24 ribs + 1 sternum = 25 | True(1-7), False(8-10), Floating(11-12) Skull bones 22 total (Cranial=8, Facial=14) | Mandible = only movable bone Ear bones 6 total (3 per ear) — Malleus, Incus, Stapes Arm bones 3 per arm (Humerus, Radius, Ulna) | Both arms = 6 Hand bones 27 per hand (Phalanges 14, Metacarpals 5, Carpals 8) Leg bones 4 per leg (Femur, Patella, Tibia, Fibula) | Both = 8 Foot bones 26 per foot (Tarsals 7, Metatarsals 5, Phalanges 14) | Both = 52 Femur Thigh bone = Body की सबसे लंबी और मजबूत bone Ball & Socket joint 360° rotation — Shoulder, Hip Hinge joint 180° — Knee, Elbow Pivot joint Left/right twist — Neck (Atlas-Axis) Fibrous joint No movement — Skull sutures Cartilaginous joint Slight movement — Vertebrae, Ribs+Sternum Enamel Body का hardest part — Calcium phosphate से बना Adult teeth 32 | Milk teeth = 20 Incisors Biting & Cutting | Canine = Tearing | Premolar = Grinding | Molar = Chewing Dental formula (Adult) 2123/2123 × 2 = 32 | Milk = 212/212 × 2 = 20 Homologous organs Same structure, different function — Common ancestor Analogous organs Different structure, same function — No common ancestor Heredity unit Gene (made of DNA) Dominant trait 1 या 2 dominant alleles से express होती है Recessive trait दोनों alleles recessive हों तभी express होती है"}, {"title": "Making of Indian Constitution", "subject": "Polity", "url": "../polity/01-making-of-indian-constitution.html", "text": "Making of Constitution | SSC Study Notes SUNNY RISE • Polity • Constitution • Exam Notes Making of Constitution 🌙 Dark Mode / ☀️ Light Mode Bharatiya Samvidhan ke nirman ko timeline, Constituent Assembly, committees, drafting process aur exam-oriented facts ke saath padhein. (Study the making of the Indian Constitution through timelines, the Constituent Assembly, committees, drafting process and exam-oriented facts.) 📌 Topics at a Glance 1. Constitution Basics 2. Constituent Assembly: Origin 3. Offers from Britain 4. Cabinet Mission & Composition 5. Seats, Elections & Interim Government 6. Objective Resolution 7. Constituent Assembly Committees 8. Drafting Committee & Draft 9. Important Sessions & Adoption 10. Functions & Working 11. Significant Facts & Female Members 12. Quick Revision 1. Constitution Basics What Kya How Kaise Why Kyon Example Udaharan Exam Point Pariksha bindu Paribhasha (Definition): Constitution kuch ideals aur basic rules ko set karta hai jo batate hain ki desh kis prakaar ka nation banna chahta hai. (A Constitution lays out ideals and basic rules forming the basis of the kind of country a nation aspires to be.) Constitution ki tradition USA me 1787 se mani gayi hai. (The tradition of a Constitution began in the USA in 1787.) Sabhi democratic countries me Constitution hone ki sambhavana hoti hai, lekin Constitution wale sabhi countries democratic hona zaruri nahi. (Democratic countries are likely to have a Constitution, but every country with a Constitution need not be democratic.) USA ki independence: 4 July 1776 . (Independence of the USA: 4 July 1776.) India ka Constitution partly rigid aur partly flexible hai. (India's Constitution is partly rigid and partly flexible.) Other Forms of Government Form Simple meaning / Source description Examples in material Communist Production ke source/means government control karti hai. (Sources or means of production are controlled by government.) China, Laos, North Korea, Cuba, Vietnam Monarchic Ek single person, specifically king/monarch, government chalata hai. (Government by a single person, specifically a king or monarch.) North Korea — as stated in the source material Totalitarian Ruler citizens ke lives par total control rakhta hai. (Whoever rules exercises total control over citizens' lives.) — Oligarchic Kuch hi logon ki government. (Government of a few.) Iran, Russia — as stated in the source material Pariksha bindu (Exam Point): “Partly rigid, partly flexible” ko Indian Constitution ke nature se map karein. (Map “partly rigid, partly flexible” to the nature of India's Constitution.) ↑ Back to Topics 2. Constituent Assembly: Idea ka Vikas (Development of the Idea) 1928 — Nehru Report: Indian Constitution ka early draft All Parties Conference, Lucknow me submit hua; conference Motilal Nehru ne chair kiya. (An early draft was submitted to the All Parties Conference at Lucknow, chaired by Motilal Nehru.) 1934 — M. N. Roy: India ke liye Constituent Assembly ka idea sabse pehle propose kiya. (First proposed the idea of a Constituent Assembly for India.) 1935 — Indian National Congress: Constituent Assembly ki official demand ki. (Officially demanded a Constituent Assembly.) Yaad rakhein (Remember): Sequence = 1928 Nehru Report → 1934 M. N. Roy → 1935 INC demand . ↑ Back to Topics 3. Offers from Britain August Offer — 1940 British Viceroy Lord Linlithgow ne 8 August 1940 ko World War II ke dauran Indian support gain karne ke liye propose kiya. War ke baad India ko Dominion Status ka promise tha. (Proposed by Lord Linlithgow to gain Indian support during WWII; promised Dominion Status after the war.) Cripps Proposal — 1942 War ke baad Dominion Status aur naya Constitution draft karne ke liye Constituent Assembly create karne ka offer. (Offered Dominion Status after the war along with creation of a Constituent Assembly to draft a new Constitution.) Wavell Plan — 1945 Shimla Conference ke naam se bhi jana gaya. Viceroy Lord Wavell ka proposal political deadlock solve karne ke liye new interim Executive Council banana tha jisme Hindus aur Muslims ko equal representation diya jaye. (Also known as the Shimla Conference; proposed a new interim Executive Council with equal representation for Hindus and Muslims.) Mukhya tathya (Key Fact): Dominion Status — Aisa status jisme country self-governing hota hai lekin British Empire ka part rehta hai. Source me Nehru ka comment diya hai: Dominion status is “dead as a door nail.” (A self-governing status while remaining part of the British Empire.) Pariksha bindu: Source ke anusaar tino plans reject hue kyunki Congress Purna Swaraj demand karti thi, jabki British Dominion Status offer kar rahe the. (According to the material, all three were rejected because Congress demanded Purna Swaraj while the British offered Dominion Status.) Cabinet Mission Plan — 1946 Teen British Cabinet members: Pethick-Lawrence (Chairman), Stafford Cripps, A. V. Alexander . Source ke anusaar yahi plan Congress aur Muslim League dono ne accept kiya; isi ke according Constituent Assembly formed hui. (This was accepted by both Congress and the Muslim League, leading to formation of the Constituent Assembly.) ↑ Back to Topics 4. Cabinet Mission Plan & Constituent Assembly Composition 389 Total Members (Kul sadasya) 296 Elected members representing British India 93 Nominated members representing Princely States; rulers nominated them, they were not elected 292 + 4 292 from 11 Governor Provinces + 4 from Chief Commissioners' Provinces: Ajmer-Marwar, Coorg, Delhi, Baluchistan “Tryst with Destiny” Source ke mutabik Nehru ne apne famous “Tryst with Destiny” speech me, jo 14 August 1947 ko Constituent Assembly ke samne deliver hua, Gandhiji ko refer karte hue kaha ki hamari generation ke greatest man ki ambition har aankh se har aansu ponchna rahi hai. (The material notes Nehru's 14 August 1947 speech before the Constituent Assembly and his reference to Gandhiji's ambition to wipe every tear from every eye.) Number trap: 389 = 296 elected British India + 93 nominated Princely States. 296 = 292 Governor Provinces + 4 Chief Commissioners' Provinces. ↑ Back to Topics 5. Seats Allocation, Elections & Interim Government Seats Allocation British provinces ki seats ko three principal communities me divide kiya gaya: Muslim, Sikh, General . (Seats were divided among Muslim, Sikh and General communities.) Har 1 million population par 1 seat . (One seat per one million population.) Assembly partly elected aur partly nominated thi. (It was partly elected and partly nominated.) Indirect election method: Proportional Representation + Single Transferable Vote . Elections: July–August 1946 . Results: Congress 208, Muslim League 73, Independents 15. Muslim League boycott ke baad partition ke baad remaining seats 299 . (After the Muslim League boycott, remaining seats after partition were 299.) Interim Government — 2 September 1946 Interim Government of India 2 September 1946 ko formed hui aur India ki independence, 15 August 1947 , tak rahi; is period me India-Pakistan partition hua. (It lasted until independence and the partition into India and Pakistan.) Viceroy / Governor-General: Viscount Wavell till Feb 1947; Lord Mountbatten from Feb 1947. Position held by Members of Interim Government Position / Portfolio Member Commander-in-Chief Sir Claude Auchinleck Vice President; External Affairs & Commonwealth Relations Jawaharlal Nehru (INC) Home Affairs, Information & Broadcasting Sardar Vallabhbhai Patel (INC) Agriculture & Food Rajendra Prasad (INC) Commerce Ibrahim Ismail Chundrigar (ML) Defence Baldev Singh (INC) Finance Liaquat Ali Khan (ML) Health Ghazanfar Ali Khan (ML) Labour Jagjivan Ram (INC) Law Jogendra Nath Mandal (ML) Education & Arts C. Rajagopalachari (INC) Railways & Communication, Post & Air Abdur Rab Nishtar (ML) Industries & Supplies John Mathai (INC) ↑ Back to Topics 6. Objective Resolution 13 December 1946: Jawaharlal Nehru ne Constituent Assembly ke samne Objective Resolution present kiya. (Presented by Jawaharlal Nehru.) 22 January 1947: Constituent Assembly ne Objective Resolution accept kiya. (Accepted by the Constituent Assembly.) Pariksha bindu: Presented = 13 Dec 1946; Accepted = 22 Jan 1947. Dono dates ko confuse na karein. (Do not confuse the presentation and acceptance dates.) ↑ Back to Topics 7. Committees of the Constituent Assembly Source ke anusaar Constituent Assembly ne 8 Major aur 13 Minor Committees form ki. (The Constituent Assembly formed 8 Major and 13 Minor Committees.) Major Committees Leader Committee(s) Jawaharlal Nehru Union Power Committee; Union Constitution Committee; State Committee Sardar Patel Provincial Constitution Committee; Advisory Committee on Fundamental Rights, Minorities, and Tribal and Excluded Area Rajendra Prasad Rules of Procedure Committee; Steering Committee B. R. Ambedkar Drafting Committee Minor Committees listed in the material Finance and Staff Committee — Dr. Rajendra Prasad Ad-hoc Committee on the National Flag — Dr. Rajendra Prasad Credential Committee — Alladi Krishnaswami Ayyar House Committee — B. Pattabhi Sitaramayya Committee on Chief Commissioners Provinces — B. Pattabhi Sitaramayya Order of Business Committee — Dr. K. M. Munshi Committee on the Functions of the Constituent Assembly — G. V. Mavalankar Ad-hoc Committee on the Supreme Court — S. Varadachariar Ad-hoc Committee on Citizenship — S. Varadachariar Expert Committee on the Financial Provisions of the Union Constitution — Nalini Ranjan Sarkar Linguistic Provinces Commission — S. K. Dhar Special Committee to Examine the Draft Constitution — J. L. Nehru Press Gallery Committee — Usha Nath Sen Yaad rakhein: Major committee mapping: Nehru = Union; Patel = Provincial + Advisory; Rajendra Prasad = Procedure + Steering; Ambedkar = Drafting. ↑ Back to Topics 8. Drafting Committee & Draft of Constitution Drafting Committee set up: 29 August 1947 . Total members: 7 . Chairman: Dr. B. R. Ambedkar ; source unhe “Modern Manu” / “Modern Man” bhi kehta hai. Other Members of Drafting Committee Alladi Krishnaswami Ayyar N. Gopalaswami Ayyangar Muhammad Sadullah B. L. Mitter — replaced by N. Madhav Rau D. P. Khaitan — replaced by T. T. Krishnamachari K. M. Munshi Draft Timeline 21 Feb 1948: First draft published; India ke logon ko discussion ke liye 8 months mile. (First draft was published and eight months were allowed for public discussion.) 4 Nov 1948: B. R. Ambedkar ne final draft Constituent Assembly ke samne introduce kiya. (Introduced the final draft before the Constituent Assembly.) 1st Reading: 5 days — 4 Nov 1948 to 9 Nov 1948. 2nd Reading: 10 months 3 days — 15 Nov 1948 to 17 Oct 1949. 3rd Reading: Completed on 26 Nov 1949. Source me diya hai ki B. R. Ambedkar July 1946 me Bengal se Constituent Assembly ke liye elected hue the; partition ke baad Bombay Presidency se elected hue. (The material states that Ambedkar was elected from Bengal in July 1946 and after partition from Bombay Presidency.) Mukhya tathya: Constituent Assembly ke first day par 211 members present the. (211 members were present on the first day.) ↑ Back to Topics 9. Important Sessions, Adoption & Enforcement Total sessions: 11 sessions for 165 days . Constitution drafting time: 2 years 11 months 18 days . Budget: 64 lakhs to frame the Constitution. 1st Session: 9–23 December 1946 . 10th Session: 6–17 October 1949 . 11th / last Session: 14–26 November 1949 . Final Draft: Dr. B. R. Ambedkar ne public ke samne 4 November 1948 ko present kiya. (Presented before the public on 4 November 1948, as stated in the source.) 26 November 1949: Constitution adopted; is date ko Constitution Day bhi celebrate kiya jata hai. (Constitution adopted; celebrated as Constitution Day.) 26 January 1950: Constitution enforced/commenced; Republic Day. (The Constitution came into force; Republic Day.) Why 26 January? Source ke anusaar isi date ko 1930 me Lahore Session (1929) ke baad Purna Swaraj Day celebrate kiya gaya tha. (The date was chosen because Purna Swaraj Day had been celebrated on the same day in 1930 following the Lahore Session of 1929.) Original Constitution: 395 Articles, 8 Schedules, 22 Parts aur Preamble. (Originally consisted of 395 Articles, 8 Schedules, 22 Parts and a Preamble.) Provisions imposed on 26 November 1949 Citizenship — Articles 5–9 Elections — Articles 324–329 Provincial Parliament — wording preserved from source ↑ Back to Topics 10. Functions & Working of Constituent Assembly Dual Role Law-making body Assembly legislation ke liye law-making body ke roop me act karti thi. G. V. Mavalankar ko Lok Sabha ka first Speaker bataya gaya hai. (It acted as a law-making body; the source notes G. V. Mavalankar as the first Speaker of Lok Sabha.) Constitution-making body Assembly Constitution banane wali body thi aur “First Parliament of India” ke roop me function karti thi. (It acted as a Constitution-making body and functioned as the “First Parliament of India”.) National Flag adopted: 22 July 1947 . National Anthem “Jana Gana Mana” by Rabindranath Tagore aur National Song “Vande Matram” by Bankim Chandra Chatterjee adopted: 24 January 1950 . India ki Commonwealth membership ratified: May 1949 . Dr. Rajendra Prasad ko India ka first President elect kiya: 26 Jan 1950 , as stated in the material. Working of Constituent Assembly 9 Dec 1946: First meeting — 211 members. Temporary President: Dr. Sachchidanand Sinha . Permanent President: Dr. Rajendra Prasad . Vice President: H. C. Mukherjee . ↑ Back to Topics 11. Significant Facts & Important Female Members Fact Answer in source Legal / Constitutional Advisor B. N. Rau Chief Draftsman S. N. Mukherjee Members who signed Constitution 284, including 15 female members Secretary of Constituent Assembly H. V. Iyengar Constitution Largest written constitution; symbol stated as an Elephant Language of Constitution English Constitution Calligraphers English: Prem Behari Narain Raizada; Hindi: Vasant Krishna Vaidya Important Female Members Rajkumari Amrit Kaur: 1st Health Minister. Sucheta Kriplani: 1st female Chief Minister of Uttar Pradesh. Sarojini Naidu: 1st Governor of Uttar Pradesh — wording preserved from source. Pariksha bindu: B. N. Rau = Constitutional Advisor; S. N. Mukherjee = Chief Draftsman; 284 signatories; 15 female signatories. ↑ Back to Topics 12. 🧠 Quick Revision — High Retention 1787: USA me Constitution tradition. | 4 July 1776: USA independence. 1928: Nehru Report → 1934: M. N. Roy idea → 1935: INC official demand. 1940: August Offer → 1942: Cripps → 1945: Wavell → 1946: Cabinet Mission. Cabinet Mission members: Pethick-Lawrence, Stafford Cripps, A. V. Alexander. Assembly strength: 389 = 296 elected + 93 nominated; after partition = 299. Election: July–Aug 1946; Congress 208, Muslim League 73, Independents 15. Interim Government: 2 Sep 1946; Nehru = Vice President. Objective Resolution: Presented 13 Dec 1946; accepted 22 Jan 1947. Committees: 8 Major + 13 Minor. Drafting Committee: 29 Aug 1947; 7 members; Chairman B. R. Ambedkar. First draft: 21 Feb 1948; final draft introduced: 4 Nov 1948. Readings: 1st = 5 days; 2nd = 10 months 3 days; 3rd completed 26 Nov 1949. Total work: 11 sessions, 165 days; 2 years 11 months 18 days; budget 64 lakhs. Adopted: 26 Nov 1949. | Enforced: 26 Jan 1950. Original: 395 Articles + 8 Schedules + 22 Parts + Preamble. First meeting: 9 Dec 1946; 211 present; Temporary President Sachchidanand Sinha; Permanent President Rajendra Prasad; Vice President H. C. Mukherjee. Flag: 22 July 1947. | Anthem + Song: 24 Jan 1950. Advisor: B. N. Rau. | Chief Draftsman: S. N. Mukherjee. | Signed: 284 including 15 women. Yaad rakhne ka shortcut: Idea → British Offers → Cabinet Mission → Assembly → Objective Resolution → Committees → Drafting → Adoption → Enforcement. (Use this sequence as the master mental map.) ↑ Back to Topics Making of Constitution • Roman Hindi + English • Revision-first study layout ↑"}, {"title": "Salient Features of Indian Constitution", "subject": "Polity", "url": "../polity/02-salient-features-indian-constitution.html", "text": "SUNNY RISE | Salient Features of Indian Constitution SUNNY RISE Polity • Salient Features of Indian Constitution • Competitive Exam Notes ☀️ Light Mode Salient Features of Indian Constitution Roman Hindi: Ye notes source PDF ke sabhi 6 pages ko cover karte hain. Focus Constitution ki major features, federal-unitary nature aur 12 Schedules par hai. English: These notes cover the complete source PDF, focusing on major constitutional features, federal-unitary characteristics, and all 12 Schedules. 📌 Topics at a Glance 1. Lengthiest Written Constitution 2. Parliamentary Government 3. Federation with Strong Centre 4. Separation of Powers 5. Schedules 1–12 6. Seventh Schedule & Legislative Lists 7. Eighth Schedule & Languages 8. Quick Revision 1. Indian Constitution — Lengthiest Written Constitution Roman Hindi: Indian Constitution duniya ka sabse lamba written Constitution hai. Written Constitution systematic aur formally constituted form me compiled hota hai. English: The Indian Constitution is the lengthiest written constitution in the world. A written constitution is compiled and structured systematically and is formally constituted. 🔑 Mukhya tathya (Key Fact) Original Constitution: 395 Articles, 22 Parts, 8 Schedules . Present source count: 448 Articles, 25 Parts, 12 Schedules . 🔢 Date/Number Trap Part VII delete kiya gaya; naye Parts IV-A, IX-A, IX-B aur XIV-A add hue. (Part VII was deleted; Parts IV-A, IX-A, IX-B and XIV-A were added.) Written vs Unwritten Constitution Written Constitution Unwritten Constitution Systematic form me compiled & structured. Formally constituted. Amend karna easy nahi. Example: India Structured nahi. Formally constituted nahi. Amend karna easy. Example: United Kingdom 📖 Paribhasha (Definition) — Amendment Roman Hindi: Law, contract, constitution ya kisi legal document me formal change ko Amendment kehte hain. English: An amendment is a formal change to a law, contract, constitution, or other legal document. ↑ Back to Topics 2. Parliamentary Form of Government Roman Hindi: Parliamentary Government democracy ka aisa form hai jahan national election me sabse adhik seats jeetne wali political party ruling government form karti hai. English: A parliamentary form of government is a form of democracy in which the political party winning the most seats in a national election forms the ruling government. 🎯 Pariksha bindu (Exam Point) Ye feature UK se borrowed hai. (This feature is borrowed from the UK.) ↑ Back to Topics 3. Federation with Strong Centre 📖 Federalism Roman Hindi: Desh me ek se adhik level of government ka existence Federalism hai. English: Federalism refers to the existence of more than one level of government in a country. Three-tier Government in India Union/Centre States Local Bodies Concept: Federal system me States sirf Centre ke agents nahi hote; unki authority Constitution se directly derive hoti hai. (States derive their authority from the Constitution itself.) Federal Features Written Constitution Supremacy of the Constitution Rigidity of Constitution Independence of Judiciary Bicameralism Dual Government Unitary Features Single Constitution Single Citizenship Integrated Judiciary All India Services Emergency Provinces Source wording Appointment of Governors by Centre Comments on Indian Federalism Scholar Description K. C. Wheare “Quasi Federal” Granville Seward Austin “Cooperative Federalism” Ivor Jennings “Federalism with centralising tendency” Morris Jones “Bargaining Federalism” ↑ Back to Topics 4. Separation of Powers Legislative Kaam: Laws banana. Function: Make Laws. Executive Kaam: Laws ko carry out/implement karna. Function: Carries Out Laws. Judiciary Kaam: Laws ko evaluate karna. Function: Evaluate Laws. ↑ Back to Topics 5. Schedules of Indian Constitution — 1 to 12 Schedule Source-based Provision 1 States aur UTs ke names aur unki territorial jurisdiction. 2 Emoluments and allowances of President, Vice President, Governor, Speaker, Deputy Speaker, Chairman, Deputy Chairman, Judges, CAG. 3 Oaths and Affirmations (Union + State) of Ministers, MPs, MLAs, Judges, CAG. 4 Allocation of seats in Rajya Sabha. 5 Administration of scheduled areas and scheduled tribes of Andhra Pradesh, Chhattisgarh, Maharashtra, Jharkhand, Madhya Pradesh, Gujarat, Himachal Pradesh, Odisha, Rajasthan and Telangana. 6 Administration of tribal areas of Assam, Tripura, Meghalaya and Mizoram. 7 Union aur States ke law-making subjects ki three lists — Union, State, Concurrent. 8 Languages; originally 14, source ke anusaar presently 22. 9 Land reforms and Zamindari System; added through 1st CA, 1951 . 10 Disqualification of MPs and MLAs on grounds of defection; added by 52nd CA, 1985 . 11 Panchayat; 73rd CA, 1992 ; 29 Functional Matters. 12 Municipalities; 74th CA, 1992 ; 18 Functional matters. ⭐ Sixth Schedule — Source current-affairs note Source ke anusaar Sixth Schedule Ladakh protests ke context me news me tha, jahan region ke tribal culture aur autonomy ko protect karne ke liye extension ki demand batayi gayi hai. Sixth Schedule entails: Autonomous District Councils (ADCs), Powers of ADCs, Cultural preservation. 🧠 Trick to Learn Schedules: TEARS OF OLD PM T Territory • E Emoluments • A Affirmation and Oath • R Rajya Sabha • S Scheduled Area • O Other Scheduled Area • F Federal Provision • O Official Language • L Land Provision • D Defection • P Panchayat • M Municipality ↑ Back to Topics 6. Seventh Schedule — Union, State & Concurrent Lists Roman Hindi: Seventh Schedule me teen lists hain jinme Union aur States ke law-making subjects distribute kiye gaye hain. Source ise Federal Provision batata hai. List Number of Subjects Examples in Source Union List Initially 97; currently 100 Inter-state trade & commerce, Banking, Foreign Affairs, Labour & Mines, Census, Defence, Arms & Ammunition, Atomic Energy, Citizenship, Airways. State List Initially 66; currently 61 Public Order, Local Government, Health, Pilgrimage, Liquor, Agriculture, Fisheries, Betting and Gambling. Concurrent List Initially 47; currently 52 Marriage and Divorce, Insolvency and Bankruptcy, Trade and Labour Dispute, Electricity, Education, Weights and Measure. Residuary List Ye subjects Union, State ya Concurrent List me included nahi hote. Parliament has the power to legislate on residuary subjects. Source ke anusaar ye provision Canadian Constitution se borrowed hai. 🔑 42nd Amendment Act, 1976 Source ke anusaar State List se Concurrent List me transfer subjects: Education, Forest, Weight & Measures, Protection of Wild animals and Birds, Administration of Justice. 5 Scenarios: Parliament/Union can legislate on State List subjects National Emergency President Rule If two or more states ask the Centre To enforce International Treaty If Rajya Sabha gives Parliament this power with Special Majority ↑ Back to Topics 7. Eighth Schedule — Languages Language Count Originally: 14 languages Presently in source: 22 languages Amendment Timeline 21st CAA, 1967: Sindhi added. 71st CAA, 1992: Konkani, Manipuri and Nepali. 92nd CAA, 2003: Bodo, Dogri, Santhali, Maithili (BDSM). 96th CAA, 2011: Name changed from “Oriya” to “Odia”. Classical Languages of India — Source List Tamil Sanskrit Telugu Kannada Malayalam Odia Newly Added Languages in 2024 — Source ke anusaar Marathi Pali Prakrit Assamese Bengali 🧠 Source Memory Trick — Classical Languages Tu Shuru To Kar Mai Aariya (Oriya) ↑ Back to Topics 🧠 QUICK REVISION — HIGH RETENTION India: Lengthiest written Constitution. Original: 395 Articles • 22 Parts • 8 Schedules. Present source count: 448 Articles • 25 Parts • 12 Schedules. Parliamentary system: borrowed from UK. 3 tiers: Union/Centre → States → Local Bodies. K.C. Wheare: Quasi Federal; Granville Seward Austin: Cooperative Federalism; Ivor Jennings: Federalism with centralising tendency; Morris Jones: Bargaining Federalism. Separation: Legislature makes laws • Executive carries out laws • Judiciary evaluates laws. Schedule 4: Rajya Sabha seats; Schedule 7: Legislative lists; Schedule 8: Languages; Schedule 10: Defection; 11: Panchayat; 12: Municipality. 7th Schedule counts: Union 97→100; State 66→61; Concurrent 47→52. 42nd Amendment, 1976: Education, Forest, Weight & Measures, Protection of Wild animals and Birds, Administration of Justice transferred as listed in source. 8th Schedule: 14 originally → 22 presently (source). Language amendments: 21st-1967 Sindhi • 71st-1992 Konkani/Manipuri/Nepali • 92nd-2003 Bodo/Dogri/Santhali/Maithili • 96th-2011 Oriya→Odia. Schedule mnemonic: TEARS OF OLD PM. ⚠️ Exam Trap Numbers, amendment years, scholar-description mappings aur Schedule-Provision mapping ko mix mat karein. Source wording jahan unusual hai, notes ne use source ke anusaar preserve kiya hai. ↑ Back to Topics ↑ SUNNY RISE • Offline Interactive Exam Notes • Source-based Study File"}];let active='All';
