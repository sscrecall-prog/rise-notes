Money held by public in Deposits Seasonal Trend: Festive seasons (Diwali, etc.) में CDR बढ़ता है — लोग ज़्यादा cash withdraw करते हैं spending के लिए। Diwali आई → लोगों ने savings account से cash निकाला → CDR बढ़ा। January के बाद → पैसे वापस bank में → CDR कम हुआ। 📊 6. Measures of Money Supply (M0, M1, M2, M3, M4) 📌 Overview RBI Monetary Aggregates (M0 to M4) use करती है economy में total money measure करने के लिए — ताकि monetary policy formulate हो सके। M0 High-Powered Money / Reserve Money / Monetary Base = Currency in Circulation + Banker's Deposits with RBI + Other Deposits with RBI M1 Narrow Money (Most Liquid) = Currency with Public + Demand Deposits with Banks + Other Deposits with RBI M2 Broader than M1 = M1 + Saving Deposits with Post Office Savings Bank M3 Broad Money (Most Used) = M1 + Net Time Deposits (Term Deposits) with Commercial Banks M4 Most Comprehensive (Least Liquid) = M3 + Total Deposits with Post Office (excluding National Savings Certificates) 📌 M0 — \"High-Powered Money\" क्यों? M0 को High-Powered इसलिए कहते हैं क्योंकि यह credit creation का base है। लेकिन vault cash और CRR components directly public transactions के लिए use नहीं होते। M0 = Total liability of the monetary authority (RBI + Govt)। 📋 Summary Table: Aggregate Name Formula Liquidity M0 High-Powered Money Currency in Circulation + Banker's Deposits with RBI + Others Base Money M1 Narrow Money Currency with Public + Demand Deposits + Other Deposits with RBI ⭐⭐⭐⭐ Highest M2 — M1 + Post Office Savings Deposits ⭐⭐⭐ M3 Broad Money M1 + Time Deposits (FD/RD) with Banks ⭐⭐ M4 — M3 + Total Post Office Deposits ⭐ Lowest M3 = Broad Money = Most widely used for monetary policy analysis। RBI mainly M3 देखती है। M1 > M2 > M3 > M4 in terms of Liquidity। M4 में ज़्यादा locked-in components हैं। M1 = Narrow Money = Most Liquid। M3 = Broad Money = RBI policy analysis के लिए। M4 = Least Liquid। M3 में FD/RD भी हैं। 🌐 7. Interbank Offer Rates — LIBOR & MIBOR 📌 Context Banks short-term needs (CRR maintain करना) के लिए एक-दूसरे से borrow करती हैं। इन transactions की interest rate market forces decide करती हैं — Offer Rates के against benchmark। 🌍 LIBOR (London Interbank Offer Rate) Role: Global benchmark rate — loans, mortgages, और financial products worldwide के लिए। Status: Discontinued after 31 December 2021 — manipulation scandals की वजह से। Replaced by: SOFR (Secured Overnight Financing Rate) — US Dollar transactions के लिए। 🇮🇳 MIBOR (Mumbai Interbank Offer Rate) Role: India का version of LIBOR — domestic interbank lending के लिए। Current Status: 2015 में replaced by FBIL-Overnight MIBOR (Financial Benchmark India Private Ltd)। LIBOR = Discontinued Dec 2021 → Replaced by SOFR। MIBOR (India) = 2015 में replaced by FBIL-Overnight MIBOR। 📈 8. Money Market vs Capital Market + T-Bills Feature Money Market Capital Market Duration Short-term (Less than 1 year) Long-term (More than 1 year) Purpose Short-term fund requirements meet करना Long-term capital for investment raise करना Instruments Call Money, Notice Money, T-Bills Stocks, Bonds, Debentures 📋 Money Market Instruments 1. Call Money: Duration: 1 day (Less than 24 hours) — Overnight। Use: Overnight requirements। 2. Notice Money: Duration: 2 to 14 days । Use: Slightly longer short-term needs। 📄 Treasury Bills (T-Bills) Definition: Government of India द्वारा issued, RBI द्वारा managed short-term debt instruments। Tenors: 91 Days, 182 Days, 364 Days Category: Money Market instruments (1 year से कम maturity)। Zero-Coupon Securities: Regular interest नहीं मिलता। How they work: Discount पर issue, face value पर redeem। Difference = investor का profit। ₹100 का T-Bill ₹95 पर issue किया। Maturity पर ₹100 मिलेगा। ₹5 = profit (interest)। RBI ने यह ₹5 का discount implicit interest बना दिया। T-Bills: 91/182/364 days। Zero-coupon। Issued at discount, redeemed at face value। Issued by Govt, managed by RBI। ⚠️ 9. Banking Assets & Non-Performing Assets (NPAs) Key Perspective: Bank के लिए Loan = Asset (income generate करता है)। Borrower के लिए same Loan = Liability (repay करनी है)। Classification of Assets (Timeline): ✅ Regular Assets — सब ठीक है Borrower time पर Interest + Principal दोनों pay कर रहा है। ⚠️ Stressed Assets — Warning Stage (0-90 days overdue) Payment overdue है लेकिन 90 days का threshold cross नहीं हुआ। ❌ NPA → Substandard Assets (90 days to 12 months overdue) 90 days से ज़्यादा overdue = NPA बन गया। 12 months तक इसी category में। ❓ Doubtful Assets (12 months से ज़्यादा overdue) Substandard में 12 months से ज़्यादा रहा → Doubtful"}, {"title": "Balance of Payments External-sector and BOP concepts.", "subject": "Economics", "url": "../economics/balance_of_payments_notes.html", "text": "Balance of Payments – Complete Notes | Parmar SSC 📘 RISE NOTES · Balance of Payments (BoP) Saare points cover • Real life examples ke saath • Easy Hindi-English mixed language 🎯 SSC Exam Ready 💡 Real Examples 📊 All Concepts 📋 Contents – Kya Kya Padhoge? 1. BoP kya hota hai? 2. Current Account 3. Capital Account 4. Deficits & 1991 Crisis 5. LPG Reforms 6. Forex Reserves 7. IMF & World Bank 8. Nostro & Vostro 9. Types of Currencies 10. Currency Valuation 11. Exchange Rate Systems 12. FERA & FEMA 1 Balance of Payments (BoP) – Introduction BoP Kya Hota Hai? Definition: Balance of Payments ek systematic record hai jisme ek country ke saare financial transactions — imports, exports, investments — baaki duniya ke saath ek specific period (usually 1 year) me record hote hain. 🏠 Real Life Example Ghar ka hisaab kitaab sochlo: Tumhare ghar me jo paise aate hain (salary, rent income) aur jo bahar jaate hain (groceries, bills, EMI) — sab ka record ek register me hota hai. Bilkul waise hi, ek country ka BoP us country ka \"international hisaab kitaab\" hai. Nature: BoP ek desh ki balance sheet ki tarah kaam karta hai for external trade. Structure: BoP mainly 2 parts me divide hota hai — 1. Current Account & 2. Capital Account 2 Current Account Current Account me goods aur services ki incoming aur outgoing track hoti hai countries ke beech. Yeh actual trade reflect karta hai. 💡 Yaad Rakhne ka Trick Current = Abhi jo chal raha hai, daily ka trade. Jaise tumhara \"current\" bank account daily transactions ke liye hota hai! Current Account ke 3 Parts: ① Visible Items (Trade in Goods) Tangible cheezein — jo deikh sako, chhoo sako — unka import/export. 📦 Examples Tea, Coffee, Machinery, Mobile phones, Cars — ye sab visible items hain. Jab India basmati rice America bhejta hai, wo visible export hai. Jab India petrol Saudi Arabia se khareedata hai, wo visible import hai. ② Invisible Items (Trade in Services) Intangible cheezein — jo deikh nahi sakte — unka import/export. Services hoti hain ye. 💻 Examples IT Services, Shipping, Banking, Tele-calling: Jab Infosys ya TCS American company ke liye software banata hai, to India invisible exports kar raha hai. Jab Indian students America jaate hain padhne, to India education services import kar raha hai. ③ Transfer Payments (Unilateral Transfers) One-way transfers — koi cheez receive nahi hoti return me. Components: Remittances, Foreign Aid, Grants. 💸 Real Life Example Remittances: Raju Dubai me kaam karta hai aur har mahine ghar ₹50,000 bhejta hai. Yahi hai remittance! India is currently World's #1 recipient of remittances. Mexico is #2. 3 Capital Account Capital Account me assets ki buying & selling track hoti hai — jaise land, property, stocks, bonds — between countries. 🏦 Yaad Rakhne ka Trick Capital = Badi cheezein, assets. Jaise tumhara \"capital\" (principal amount) long-term kaam aata hai. Capital account = long-term investments ka hisaab. ① FDI – Foreign Direct Investment Long-term investment in physical assets of a foreign country. Involves ownership ya management control lena. Stable investment maana jaata hai — factory nahi bech sakte jaldi se. 🛒 Classic Example Walmart ne Flipkart acquire kiya — yeh FDI ka perfect example hai! Walmart (American company) ne India ki Flipkart me $16 billion invest kiya aur ownership le li. Foreign company, Indian business me direct investment. ② FPI / FII – Foreign Portfolio Investment Short-term investment in financial assets (shares, bonds). No management control — sirf paisa lagao, profit lo. Examples: Stocks, Bonds, Mutual Funds, NRI Deposits 🔥 \"Hot Money\" kya hota hai? FPI ko \"Hot Money\" kehte hain kyunki ye bahut volatile hai. Jab market unstable hoti hai, foreign investors apne stocks/bonds turant bech ke country chhod dete hain. Real example: 2008 financial crisis ke time, FIIs ne Indian stock market se record speed me paisa nikala — Sensex crash ho gaya! ③ FDI Routes & Sectoral Limits Automatic Route: Government approval ki zaroorat nahi. Seedha invest karo. Government Route: Pehle government se permission leni padti hai. Defence Sector: 74% tak = Automatic Route. 74%–100% = Government Route. Insurance Sector: 100% FDI allowed via Automatic Route. 🏭 Simple Example Agar koi foreign company India me cement factory lagana chahti hai → Automatic Route (direct aa sakte hain). Agar koi defence equipment factory lagani hai 80% ownership ke saath → Government Route (permission leni padegi). 🏗️ FDI (Foreign Direct Investment) Long-term investment Physical assets (factories, land) Management control hota hai Stable, \"Cool Money\" Good for economy 📈 FPI (Foreign Portfolio Inv.) Short-term investment Financial assets (stocks) No management control Volatile, \"Hot Money\" Can destabilize market 4 Deficits & 1991 Crisis Current Account Deficit (CAD) Definition: Jab ek country import zyada kare aur export kam, tab CAD hota hai. Matlab: Imports > Exports 🏠 Ghar ka Example Maan lo Rahul ki salary ₹30,000 hai lekin woh ₹40,000 kharcha karta hai. Matlab wo ₹10,000 deficit me hai . Bilkul waise hi, agar India ₹5 lakh crore export kare par ₹7 lakh crore import kare, toh ₹2 lakh crore ka CAD hai. Key Insight: CAD = country net borrower hai duniya se. India's Current CAD: ~1.2% of GDP (RBI comfortable level = 2–2.5%). Surplus Era (2000–2003): IT/BPO boom aur kam imports ki wajah se India surplus me tha. Twin Deficit 👫 Jab dono deficits ek saath ho jaate hain: Fiscal Deficit Government ka kharcha > Government ki income Formula: Total Expenditure – Total Receipts (excl. borrowings) Current Account Deficit Import Bill > Export Earnings Country zyada bahar se khareed rahi hai ⚠️ Real Life Twin Deficit Imagine karo Ramesh ka business loss me hai (fiscal deficit) AUR woh ghar ke liye bahar se zyada khareedne lag gaya (CAD). Dono problem ek saath = Twin Deficit = Bahut buri situation! 🚨 1991 Balance of Payments Crisis Also called: Currency Crisis 1990-91 tak India ka foreign exchange reserve almost khatam ho gaya tha. India ke paas sirf 2 hafton (fortnight) ka import cover tha. Country na imports pay kar sakti thi, na foreign debts service kar sakti thi. 😰 Imagine Karo Imagine karo ghar me sirf 14 din ka rashan bacha hai aur pocket khali hai. Na credit card, na loan. Iss haalat me tum kya karoge? Kisi se madad maangoge. Bilkul yahi India ne bhi kiya! The Problem Forex reserves depleted Only 2 weeks import cover Couldn't pay foreign debt The Solution IMF se bailout loan maanga Sone ko mortgage kiya (UK me) Structural reforms ki shuruaat 🏛️ Key Architects of 1991 Reform: PM: P.V. Narasimha Rao | Finance Minister: Dr. Manmohan Singh 5 LPG Reforms (1991) – New Economic Policy LPG = Liberalisation + Privatisation + Globalisation 1991 crisis se bahar nikalne ke liye \"New Economic Policy\" launch ki gayi jisme ye 3 reforms the. L – Liberalisation (Udarikaran) 🔓 Definition: Government ki unnecessary restrictions hatana economy se. Abolition of License Raj: Zyaadatar industries ko license ki zaroorat khatam. Tariff Reduction: Import duties kam ki — foreign goods aane lage. Markets deregulate kiye — competition badhaya. 🏭 Real Life Example 1991 se pehle: Agar Tata Motors car factory lagana chahti, to Delhi me government offices ke 20 chakkar laganke lagta tha, mahine ka wait. After liberalisation: Directly shuru karo. License Raj khatam! Maruti se competition badhao, quality improve karo! P – Privatisation (Nijikaran) 🏢 Definition: Government enterprises ka ownership/management private sector ko transfer karna. Objective: Efficiency badhana aur government ka financial burden kam karna. ✈️ Real Life Example Air India government ki thi, losses me thi. Tata Group ne 2022 me khareed li. Ab better service, better management. Yahi hai privatisation! Similarly, PSU disinvestment bhi privatisation ka hi part hai. G – Globalisation (Vaishvikaran) 🌍 Definition: National economy ko global economy se integrate karna — goods, services, capital, technology, labor ka free flow badhana. 📱 Real Life Example Globalisation ki wajah se aaj Apple, Samsung, McDonald's, Amazon — sab India me hain. Aur Infosys, TCS, Wipro America aur Europe me kaam kar rahi hain. Dunia ek badi market ban gayi! 6 Forex Reserves (Videshi Mudra Bhandar) Definition: Forex reserves wo assets hain jo RBI (India ki central bank) rakhti hai. Purpose: Import cover provide karna aur external shocks (recessions, wars, currency volatility) se economy ko protect karna. 🏦 Real Life Comparison Ghar me emergency fund: Usi tarah jaise tum apne ghar me 6 mahine ka emergency fund rakhte ho — RBI bhi India ke liye foreign currencies reserve me rakhti hai. 1991 me sirf 2 hafte ka tha, aaj almost 1 saal ka hai! 4 Components of Forex Reserves: # Component Kya Hota Hai? Key Point 1 Foreign Currency Assets (FCA) 💵 Dusre deshon ki currencies jo RBI ke paas hain — Sabse bada component Exports aur foreign investments se accumulated 2 Gold Reserves 🥇 RBI ke paas physical gold Universal acceptability. Recently India ne UK se apna gold wapas India laaya! 3 Special Drawing Rights (SDR) 📄 IMF ka banaya \"Paper Gold\" — real currency nahi, IMF members ki currencies pe claim SDR basket ke 5 currencies se milta hai value 4 Reserve Tranche Position (RTP) 🏦 IMF me har member ka quota — bina conditions ke withdraw kar sakte ho Zyada quota = Zyada voting power in IMF SDR Basket – 5 Global Currencies 🇺🇸 $ USD US Dollar 🇪🇺 € Euro Eurozone 🇯🇵 ¥ Yen Japan 🇬🇧 £ Pound UK 🇨🇳 ¥ Yuan China (Renminbi) 7 IMF & World Bank History – Bretton Woods Conference 1944 Year: 1944 (officially called: United Nations Monetary & Financial Conference) Participants: 44 nations, 730 delegates Result: IMF + World Bank (IBRD) — \"Twin Organisations\" bane Why: 1929-30 Great Depression ke baad world ne socha — ek global financial system chahiye HQ: Washington D.C. (dono ka) 🌍 Kya Karta Hai IMF? IMF ek \"global doctor\" ki tarah hai financially sick countries ke liye. 1991 me India beemar tha (broke tha), IMF ne loan diya — lekin conditions ke saath (reforms karo). Argentina, Pakistan, Sri Lanka — sab IMF ke paas jaate hain jab broke hote hain. IMF Voting Power Rankings 1 🇺🇸 USA 2 🇯🇵 Japan 3 🇨🇳 China 8 🇮🇳 India (8th position) 📊 Important: Zyada quota IMF me = Zyada voting power. India 8th rank pe hai. IMF Major Reports (Twice a Year) 1. World Economic Outlook (WEO) Global economy ka overall analysis — GDP growth forecasts, etc. 2. Global Financial Stability Report (GFSR) Financial markets ki stability ka analysis. 3. Fiscal Monitor (FM) Deshon ke government budgets, deficits ka analysis. Top IMF Borrowers 1 🇦🇷 Argentina 2 🇺🇦 Ukraine 3 🇪🇬 Egypt 4 🇵🇰 Pakistan 5 🇪🇨 Ecuador 8 Nostro & Vostro Accounts NOSTRO (Our) \"Our account in YOUR bank\" Domestic bank ka account foreign bank me, foreign currency me. 💡 Example SBI ka account Citibank (USA) me — dollars me. Jab India ko USA se payment receive karni ho, SBI us Nostro account use karta hai. VOSTRO (Your) \"YOUR account in OUR bank\" Foreign bank ka account domestic bank me, domestic currency me. 💡 Example Citibank (USA) ka account HDFC Bank me — rupees me. Jab US bank India me transactions karna chahti, wo HDFC ke paas apna Vostro account use karti hai. 🧠 Memory Trick: NOSTRO = \"hamara account unke yahan\" (No-Stro = No Stranger = apna account). VOSTRO = \"unka account hamare yahan\" (Vo = Woh = wo log). 9 Different Types of Currencies 1. Hard Currency 💪 High liquidity + universal acceptability. Internationally widely trusted. Example: US Dollar (USD) 🌍 Why \"Hard\"? Kisi bhi country me jao, dollar accept hoga. Dubai, Singapore, Paris — har jagah. Isliye ye \"hard\" hai — reliable, stable, widely accepted. India me bhi dollar se bahut cheezein hoti hain (oil, gold ka hisaab dollar me). 2. Soft Currency 😔 Easily available, lower liquidity, lower acceptability. Developing nations ki currencies. Example: Indian Rupee (INR) 💔 Why \"Soft\"? Agar tum Singapore jao aur rupee nikalo, to wo log nahi lenge. Dollars/Euros chahiye. INR sirf India me chal ta hai essentially. Isliye rupee \"soft currency\" hai. 3. Hot Currency 🔥 Wo currency"}, {"title": "Poverty Poverty concepts and measures.", "subject": "Economics", "url": "../economics/poverty_notes.html", "text": "Poverty – Complete Notes | Parmar SSC Lecture 10 📘 Parmar SSC · Lecture 10 Poverty – Complete Notes Har ek concept, real life examples ke saath • Committees, Indexes, SEZ sab kuch cover 🎯 SSC Exam Ready 💡 Real Examples 📊 All Committees 📈 Indexes Covered 📋 Contents – Kya Kya Padhoge? 1. Poverty kya hai? 2. Types of Poverty 3. Poverty Estimation 4. Pre-Independence 5. Post-Independence 6. Trends & State-wise 7. MPI & HDI 8. HCR, EPI, MVI 9. SDGs 10. MPC & Multiplier 11. SEZ 12. Lorenz & Gini 1 Poverty – Fundamentals Poverty Kya Hota Hai? Definition: Poverty ek aisi condition hai jisme koi individual ke paas basic standard of living ke liye zaruri financial resources aur essentials nahi hote. Ye sirf paison ki baat nahi — environmental, legal, social, economic, aur political causes bhi hote hain. 🏠 Real Life Example Ramesh ek kisan hai Bihar me: Uske paas na khana hai din mein ek baar, na saaf paani, na doctor ke paas jaane ke paise, na bachon ki school fees. Ye hai poverty — sirf \"paisa nahi hai\" nahi, balkia ek complete deprivation ki state hai. 2 Types of Poverty ① Absolute Poverty (Nirpeksh Garibi) 🍚 Jab log basic necessities se bilkul mahroom hote hain — khana, saaf paani, ghar, kapde, healthcare, education. 💡 Example Sub-Saharan Africa ke bahut se log jo din me ek waqt ka khana bhi nahi khaa paate — ye hai Absolute Poverty . India mein bhi 1990s tak kaafi log iss category mein the. Ye internationally fixed threshold hai ($2.15/day World Bank ke hisaab se). ② Relative Poverty (Sapekhsh Garibi) ⚖️ Jab kisi ka income ya resources uski society ke average se significantly kam ho. Ye comparative hai. 💡 Example Delhi mein ek autowala ₹20,000 mahine kamaata hai — khana, ghar sab hai. Lekin uske neighbourhood ke logon ki average income ₹80,000 hai. Compare karke wo relatively garib hai. USA mein bhi relative poverty exist karta hai even though absolute poverty rare hai. ③ Subjective Poverty (Vyaktigat Garibi) 🧠 Personal perception pe based — log feel karte hain ki poor hain, chahe unki actual income thik ho. Society comparison, expectations, psychology sab matter karta hai. 💡 Example Priya ek software engineer hai ₹70,000/month income ke saath. Lekin uske friends IIT grads hain jo ₹3L kamaate hain. Social media pe unka lifestyle dekhke Priya subjectively poor feel karti hai — even though wo actually poor nahi hai. Ye psychological poverty hai! 😔 Usually Poor Hamesha poverty line ke neeche. Chronic poverty. Example: Daily wage laborers jo kaam na mile toh bhookhe rehte hain. 🔄 Churning Poor Poverty line ke upar-neeche aate jaate hain. Example: Seasonal workers — fasal ke time paise hain, baaki time nahi. 🤞 Occasionally Poor Mostly line ke upar, kabhi kabhi neeche gir jaate hain. Example: Small shopkeeper jiska ek saal mein business fail ho jaata hai. 3 Poverty Estimation in India Method: India me poverty measure karte hain kisi ke income ya consumption level dekhke. Agar ye set minimum se kam hai → wo Below Poverty Line (BPL) hai. Who does it: NITI Aayog ka task force → data NSSO (National Sample Survey Office) se liya jaata hai → MoSPI ke under. 🛒 BPL Ka Matlab Kya? Agar government ne decide kiya ki ek insaan ko minimum ₹1,000/month chahiye survive karne ke liye — aur Suresh ₹800 mein guzaara karta hai — toh Suresh BPL (Below Poverty Line) hai. Usse government schemes ka fayda milega (ration card, PM Awas Yojana, etc.) 4 Pre-Independence Estimation 📚 Dadabhai Naoroji – \"Poverty and Un-British Rule in India\" India mein poverty line ki sabse pehli estimation Dadabhai Naoroji ne ki. Estimated: ₹16 to ₹35 per capita per year India ke National Income ka bhi pehla estimation inhi ne diya. Used concept of \"Prisoner's Menu\" — jail me jo basic khana milta hai (flour, rice, dal) — usi ki cost se subsistence calculate kiya. 🧠 Prisoner's Menu Trick Sochte the: \"Ek insaan ko survive karne ke liye at least jail jaisa khana chahiye. Jail mein jo khana milta hai uski cost = minimum poverty line.\" Kitna brilliant aur practical approach tha! 🏛️ National Planning Committee (1938) Set up by Subhash Chandra Bose under chairmanship of JL Nehru . Poverty line estimated: ₹15 to ₹20 per capita per month Based on minimum standard of living with nutritional requirements included. 🏙️ The Bombay Plan (1944) Set of proposals by influential business leaders of Bombay for India's development. Suggested poverty line: ₹75 per capita per year 5 Post-Independence – Poverty Committees 1971 VM Dandekar & N Rath Pehla systematic assessment of poverty in India (NSSO data based). Expenditure-based poverty line. 2250 calories per day — rural aur urban dono ke liye. 🍽️ Example Unhone socha: \"Ek insaan ko din mein minimum 2250 calories chahiye survive karne ke liye. Kitne mein wo calories milti hain — wohi poverty line.\" Simple aur direct approach! 1979 Alagh Committee (Chairman: YK Alagh) Rural aur urban ke liye alag alag calorie requirements define kiye. Rural: 2400 calories → ₹49.09/month Urban: 2100 calories → ₹56.64/month 🌾 Why Rural = More Calories? Gaon me log physically zyada kaam karte hain — khet me jotna, bhoj uthana. Isliye rural workers ko zyada calories chahiye (2400 vs 2100 urban). Bahut logical! 1993 Lakdawala Committee Poverty line defined on basis of household per capita consumption expenditure. Used CPI-IW (Consumer Price Index – Industrial Workers) and CPI-AL (for Agricultural Labourers). Suggested: State specific poverty lines banayein (ek size fit all nahi). Calorie-based calculation continue kiya. 💡 State-Specific Lines Kyun? Mumbai me ₹1,000 mein sirf ek week ka ration aata hai. Lekin Chhattisgarh ke ek gaon mein ₹1,000 se poora mahina nikal sakta hai. Isliye ek hi poverty line sab jagah apply nahi hoti! 2005 (report 2009) Tendulkar Committee ⭐ (Most Important) Set up to address shortcomings of previous methods. Poverty line based on Purchasing Power Parity = ₹33 per day Shifted away from calorie-only model — broader approach. Added private expenditure on health & education . Replaced URP (Uniform Reference Period) with MRP (Mixed Reference Period) : 30 Days Recall Food aur frequent items ke liye (doodh, sabzi, etc.) 365 Days Recall Infrequent non-food items ke liye (kapde, footwear, durables) Poverty Line (2011-12): 🌾 Rural: ₹816 per capita per month 🏙️ Urban: ₹1,000 per capita per month 📊 Overall poverty: 21.9% | Rural: 25.7% | Urban: 13.7% ⚠️ ₹33/Day Controversy Tendulkar Committee ne ₹33/day urban poverty line set ki. Log bolne lage: \"Delhi mein ₹33 mein kya hoga? Ek chai bhi ₹20 ki hai!\" Bahut criticism aayi ki ye line bahut neechi hai. Isliye Rangarajan Committee bani. 2012 (report 2014) Rangarajan Committee Poverty basket mein 3 components: food items + essential non-food + behaviorally determined non-food items. Calories ke saath protein aur fat bhi include kiya. Introduced MMRP (Modified Mixed Reference Period) — weekly, monthly, yearly basis pe compute kiya. Poverty Line (Recommended): 🌾 Rural: ₹972 per capita per month 🏙️ Urban: ₹1,407 per capita per month 📦 \"Behaviorally Determined\" Kya Hota Hai? Kuch cheezein technically zaruri nahi hain par society mein rehne ke liye practically important hain — jaise mobile recharge, school uniform, bus fare. Rangarajan ne kaha: inhe bhi poverty basket mein shamil karo! Committee / Person Year Key Feature Rural Line Urban Line Dadabhai Naoroji Pre-1947 Earliest estimate; Prisoner's Menu ₹16–35/year NPC (Nehru) 1938 Nutrition-based minimum living ₹15–20/month Bombay Plan 1944 Business leaders' proposal ₹75/year Dandekar & Rath 1971 First systematic, NSSO-based, 2250 cal — Alagh Committee 1979 Rural 2400 cal, Urban 2100 cal ₹49.09/mo ₹56.64/mo Lakdawala Committee 1993 CPI-IW & CPI-AL; state-specific lines — Tendulkar Committee ⭐ 2005/2009 PPP basis; health & education added; MRP ₹816/mo ₹1,000/mo Rangarajan Committee 2012/2014 Protein+fat+behavioural; MMRP ₹972/mo ₹1,407/mo 6 Trends in Poverty Reduction & State-wise Data 407M Poor in 2004-05 (37.2% BPL) 270M Poor in 2011-12 0.74% Yearly decline 1993–2005 2.4% Yearly decline 2005–2012 📈 Poverty Reduction Accelerated! 2004-2012 me poverty decline ki speed 3x ho gayi (0.74% → 2.4% per year). Is period me MNREGA (2005), Right to Food, PM Gram Sadak Yojana jaise programs launch hue the — inhi ka asar tha! 🔴 Highest Poverty States (2011-12) 1 Chhattisgarh – 39.9% 2 Jharkhand – 37% 3 Bihar – 33.7% 🟢 Lowest Poverty States (2011-12) 1 Goa – 5.09% 2 Kerala – 7.1% 🤔 Kerala Itna Accha Kyun? Kerala mein literacy, healthcare, women empowerment — sab indicators top pe hain. High remittances (Gulf countries se). Strong social safety net. Isliye despite low industrial growth, poverty bhi low hai. \"Kerala Model of Development\" globally famous hai! 7 MPI – Multidimensional Poverty Index & HDI Global MPI – Kya Hai? Introduced 2010 by UNDP + OPHI (Oxford Poverty & Human Development Initiative). Uses 10 indicators across 3 dimensions : Health, Education, Standard of Living. 🏥 Health (2 indicators) Nutrition Child Mortality 📚 Education (2 indicators) Years in schooling School attendance 🏠 Standard of Living (6) Cooking fuel, Sanitation Drinking water, Electricity Housing, Assets 💡 MPI vs Income Poverty Ek gaon mein sab log ₹2,000/month kamate hain (above income poverty line). Lekin unke ghar mein na bijli hai, na toilet, na clean water. Income ke hisaab se poor nahi — lekin MPI ke hisaab se definitely multidimensionally poor hain! MPI zyada comprehensive hai. National MPI (India) – NITI Aayog Launched November 2021 by NITI Aayog. Uses 12 indicators (vs 10 in global MPI). Data source: NFHS (National Family Health Survey) Multidimensional poverty declined since 2005-06. 24.82 crore people escaped multidimensional poverty in last 9 years. Uttar Pradesh: Largest number lifted out of poverty (absolute numbers). Highest MPI (Most Poor) 🔴 Bihar Lowest MPI (Least Poor) 🟢 Kerala Human Development Index (HDI) Created in 1990 by Mahbub ul Haq (Pakistani Economist) + Amartya Sen (Indian Economist). Amartya Sen: First Indian economist to win Nobel Prize in Economics (1998). 💊 Health Indicator: Life expectancy at birth 📖 Knowledge Indicators: Expected years + Mean years of schooling 💰 Standard of Living Indicator: GNI per capita (PPP $) 🌟 HDI Why Important? Pehle countries ki progress sirf GDP se napta tha . Mahbub ul Haq aur Amartya Sen ne kaha: \"GDP se sirf income pata chalti hai — logon ki life quality nahi!\" Isliye HDI banaya — ek holistic measure jo health + education + income sab dekhta hai. Ab UNDP har saal Human Development Report publish karta hai. 8 HCR, EPI & MVI 📊 Head Count Ratio (HCR) Also known as: Poverty Headcount Index Population ka wo percentage jo BPL mein jeeta hai. Formula HCR = (No. of Multidimensionally Poor People) ÷ (Total Population) Example: Agar 100 mein se 22 log BPL hain → HCR = 22% 🧮 Simple Example Ek village mein 500 log hain. 110 BPL hain. HCR = 110/500 = 22% . Matlab us village mein har 5 mein se 1 se zyada garib hai. 🚢 Export Preparedness Index (EPI) Publisher: NITI Aayog Structure: 4 Pillars — Policy (20%), Business Ecosystem (40%), Export Ecosystem (20%), Export Performance (20%) Measures states' readiness to export goods. 🌍 Multidimensional Vulnerability Index (MVI) Publisher: UNGA (United Nations General Assembly) Measures structural vulnerability and lack of resilience across 3 dimensions: Economic Environmental Social Focus: Specially for Small Island Developing States (SIDS) aur vulnerable nations. 🌏 MVI ka Use Bangladesh floods se vulnerable hai. Maldives sea level rise se. Aise deshon ki vulnerability naapne ke liye MVI banaya gaya. India jaisa bada desh kam vulnerable — chota island nation zyada. 9 Sustainable Development Goals (SDGs) SDGs se pehle: MDGs (Millennium Development Goals) — target 2015. 2015 mein United Nations ne New York mein SDGs adopt kiye. Effective from: 1 January 2016 | Target Year: 2030 | 17 Goals, 169 Targets 🚫 No Poverty 🌾 Zero Hunger 💊 Good Health 📖 Quality Education ♀️ Gender Equality 💧 Clean Water ⚡ Clean Energy 💼 Decent Work 🏗️ Industry & Innovation ⚖️ Reduced Ine"}, {"title": "India's Five Year Plans Five Year Plans and revision coverage.", "subject": "Economics", "url": "../economics/five_year_plans_notes.html", "text": "India's Five Year Plans – Complete Notes ↑ 🇮🇳 India's Five Year Plans Complete Study Notes — Every Point, Every Plan, Real-Life Examples PARMAR SSC · Lecture 11 · SSC Exam Ready 📋 Table of Contents Pre-Independence Plans Planning Commission & NDC Goals of Five Year Plans 1st FYP (1951–56) 2nd FYP (1956–61) 3rd FYP (1961–66) Plan Holiday (1966–69) 4th FYP (1969–74) 5th FYP (1974–78) Rolling Plan (1978–80) 6th FYP (1980–85) 7th FYP (1985–90) Annual Plans (1990–92) 8th FYP (1992–97) 9th FYP (1997–02) 10th FYP (2002–07) 11th FYP (2007–12) 12th FYP (2012–17) NITI Aayog Industrial Policy Resolutions 📜 Pre-Independence Planning 🏛️ Evolution of Planning in India (Before 1947) Planning in India began before independence — different thinkers proposed their own economic blueprints. Year Plan / Committee Proposer / Chairman Key Idea 1934 Visvesvaraya Plan M. Visvesvaraya First ever blueprint for Indian planning. Book: \"Planned Economy for India\" 1938 National Planning Committee (NPC) J.L. Nehru (Chairman) Formed by Subhash Chandra Bose (INC President). First national plan attempt. 1944 Bombay Plan J.R.D. Tata & Leading Capitalists \"A Plan of Economic Development for India\" – Two parts (1944 & 1945) 1944 Gandhian Plan S.N. Agarwal Decentralised economy, self-contained villages, cottage industries, minimal state control 1945 People's Plan M.N. Roy Based on Marxist Socialism. Agriculture + land nationalisation. Roy also founded CPI in Tashkent (1920), formalised in Kanpur (1925) 1950 Sarvodaya Plan J.P. Narayan By Jayaprakash Narayan (founder of Congress Socialist Party, 1934). First blueprint for Independent India's planned development. 🏢 Post-Independence Planning Bodies 🏛️ Planning Commission (1950) Established: March 1950 Nature: Extra-Constitutional + Non-Statutory body (not in Constitution, not made by Parliament) Function: Design and formulate the Five-Year Plans Chairman: Prime Minister (Ex-officio) Deputy Chairman: Appointed by PM Members: Cabinet Ministers + Planning Minister Dissolved: 2014 → replaced by NITI Aayog on 1st Jan 2015 🏛️ National Development Council (NDC) Established: August 1952 Function: Approve and implement the Five-Year Plans (designed by Planning Commission) Chairman: Prime Minister Easy trick: Planning Commission = बनाने वाला | NDC = approve करने वाला 🌍 Inspiration: USSR The concept of Five-Year Plans was borrowed from the USSR (Soviet Union) . Joseph Stalin first introduced it there in 1928 to industrialise Soviet Union. 💡 Real-Life Example Just like a family makes a 5-year plan — \"pehle ghar banao, phir bache ki padhai, phir business shuru karo\" — India also made step-by-step plans. USSR was already doing this successfully, so India copied the idea! 🎯 Goals of Five Year Plans Four main objectives (remember: G-M-S-E ) 📈 Growth GDP mein increase ⚙️ Modernisation New technology adopt karo 🏭 Self-reliance Import kam, domestic production zyada ⚖️ Equity Sabka development Perspective Plan: Five-Year Plans also had a long-term (20-year) vision called the Perspective Plan . 🔄 Development Strategies: Inward vs Outward Looking 🔒 Inward-Looking Strategy Part of the broader trend of de-globalisation Supports local industries through protective measures Protects domestic jobs from foreign competition Uses tariffs and subsidies to shield domestic producers Limits foreign competition Emphasises self-sufficiency Focuses on import substitution industrialisation (ISI) Aims to reduce trade deficits 🌐 Outward-Looking Strategy Integral to globalisation Encourages free trade and removal of trade barriers Welcomes foreign investment Promotes global integration Prioritises economic efficiency through competition Facilitates technological innovation Embraces export-oriented industrialisation Seeks comparative advantage in global markets 💡 Real-Life Example Inward: Jaise pehle India mein foreign cars allowed nahi thi — Maruti banti thi, Maruti chalti thi! Ye inward strategy thi. | Outward: Aaj India mein Toyota, Honda, BMW sab aate hain — ye outward/globalisation hai. 🌾 First Five-Year Plan 1st Five-Year Plan 1951–1956 Duration 1951 – 1956 Model Harrod-Domar Model Prime Minister Jawaharlal Nehru Primary Focus Agriculture & Irrigation 📊 Performance Target Growth 2.1% Achieved Growth 3.6% ✔ 🏆 Highly Successful ⚡ Context — Why Agriculture First? India just got independence — there was a food shortage crisis Huge influx of refugees from Pakistan partition — needed to feed them Primary Sector (farming) needed immediate attention 🏗️ Key Developments & Projects Bhakra Nangal Dam: On Sutlej River — Highest gravity dam of India Hirakud Dam: On Mahanadi River, Odisha — Longest dam of India Nagarjuna Sagar Dam: On Krishna River IIT Kharagpur (1951): First IIT established. Others followed: IIT Bombay (1958), IIT Kanpur (1959), IIT Madras (1959), IIT Delhi (1961) Land to the Tiller: Ownership rights given to actual cultivators → abolished Zamindari system Community Development Programme (CDP): Launched 1952 for rural development Land Ceiling Act: Land reforms started in 1st Plan, but specific Land Ceiling Act was enacted in 1976 💡 Real-Life Example Socho ek naya ghar khareeda — pehle kitchen aur bathroom banate hain (basic needs first). Usi tarah India ne independence ke baad pehle food production par dhyan diya. Bhakra Nangal Dam = aaj bhi Punjab, Haryana aur Rajasthan ko paani deta hai! 🏭 Second Five-Year Plan 2nd Five-Year Plan 1956–1961 Duration 1956 – 1961 Model P.C. Mahalanobis (Nehru-Mahalanobis) Prime Minister Jawaharlal Nehru Primary Focus Rapid Industrialisation (Heavy Industries) 📊 Performance Target Growth 4.5% Achieved Growth 4.3% ≈ ⚠️ Moderately Successful (narrowly missed) 🏗️ Key Developments 3 Steel Plants set up: ① Rourkela Steel Plant (RSP) — 1959, Odisha — German collaboration ② Durgapur Steel Plant (DSP) — 1959, West Bengal — British collaboration ③ Bhilai Steel Plant (BSP) — 1955, Chhattisgarh — USSR collaboration Industrial Policy Resolution of 1956 (2nd IPR) was the foundational policy for this plan Karve Committee (1955): Also known as Village & Small-Scale Industries Committee. Chairman: D.G. Karve. Goal: Promote rural development through small-scale industries alongside heavy industrialisation 👨‍🔬 About P.C. Mahalanobis — Chief Architect of Indian Planning Birth Anniversary: 29 June → celebrated as Statistics Day Founded: Indian Statistical Institute, Kolkata Started journal: Sankhya 💡 Real-Life Example Ghar ban gaya (1st plan), ab factory lagao — kapde, steel, machines bano. Jaise Rourkela Steel Plant aaj bhi India ka important steel producer hai. Bhilai — RSS-wala nahi, Bhilai Steel Plant wala! 😄 USSR ne help ki aur aaj bhi Bhilai ek major industrial town hai. ⚠️ Third Five-Year Plan 3rd Five-Year Plan 1961–1966 Duration 1961 – 1966 Model Gadgil Formula / Gadgil Yojana (also John Sandy & Sukhamoy Chakravarty) Prime Minister Jawaharlal Nehru Primary Focus Self-reliant & self-generating economy 📊 Performance Target Growth 5.6% Achieved Growth 2.8% ✗ 💥 Disastrous Failure — Most Failed Plan 💥 Reasons for Failure — Triple Shock Indo-China War (1962): Diverted funds from development to defence Indo-Pak War (1965): Further drained resources Severe Drought (1965–66): Massive food crisis 🏗️ Key Developments Food Corporation of India (FCI): Established 14 January 1965 Agricultural Prices Commission (APC): Set up 1 January 1965 — recommends Minimum Support Prices (MSP). Later renamed CACP (Commission for Agricultural Costs and Prices) Industrial Development Bank of India (IDBI): 1 July 1964 Unit Trust of India (UTI): 1963 (by Act of Parliament) → Established 1 February 1964 PL 480 Scheme: India imported wheat from USA to alleviate hunger and poverty ⚠️ Most asked in SSC: 3rd FYP = सबसे ज़्यादा fail हुई। Triple shock = China war + Pakistan war + Drought 💡 Real-Life Example Socho tum apne business ka plan bana rahe the, lekin achanak 2 baar road accident ho gaya + badi bimari bhi aa gayi — sab paisa chala gaya. Usi tarah India ka 3rd plan tha — do wars + ek bada drought = complete failure. PL 480 = America se udhaar ka anaj maangna pada! ⏸️ Plan Holiday (1966–1969) ⏸️ Plan Holiday — No Five-Year Plan for 3 Years! Period: 1966–1969 (3 Annual Plans instead of a Five-Year Plan) Reason: Economic strain from wars + severe drought Focus: \"New Agriculture Strategy\" = Green Revolution Green Revolution: Widespread distribution and adoption of HYV (High Yielding Variety) seeds Phase 1: Mid 1960s–1970s Phase 2: Mid 1970s 💡 Real-Life Example Jab exams mein bahut zyada fail ho jao toh gap year lete hain — self-study, coaching, preparation. Usi tarah India ne 3 saal ka \"gap\" liya aur agriculture ko sudhara. Green Revolution ki wajah se Punjab aaj bhi \"India ka anaj ka bhandaar\" hai! 🌱 Fourth Five-Year Plan 4th Five-Year Plan 1969–1974 Duration 1969 – 1974 Model Gadgil Formula / Rudra-Allen Model (Rudra Manne Model) Prime Minister Indira Gandhi President V.V. Giri Primary Focus \"Growth with Stability\" + Progressive Self-Reliance 📊 Performance Target Growth 5.6% Achieved Growth 3.3% ✗ ✗ Failed ⚡ Key Initiatives & Reforms Family Planning Programme was introduced 14 major banks nationalised — 1969 (famous step by Indira Gandhi) First Underground Nuclear Test: \"Smiling Buddha\" — 1974 in Pokhran Drought Prone Area Programme — 1973–74 💡 Real-Life Example \"Garibi Hatao\" ki nींव यहीं से। Indira Gandhi ne 14 banks nationalise kiye — matlab sarkar ne private banks ko apne haath mein le liya taaki common people ko loan mil sake. \"Smiling Buddha\" = India ka first nuclear test — code name bahut cute tha but kaam khatarnak tha! 😄 💼 Fifth Five-Year Plan 5th Five-Year Plan 1974–1978 Duration 1974–1978 (Only 4 years!) Model D.P. Dhar Model Prime Minister Indira Gandhi Primary Focus Employment + Poverty Alleviation (Garibi Hatao) ⭐ IMPORTANT: Only Five-Year Plan that lasted just 4 years — terminated 1 year early by Janata Party government (1977) 📊 Performance Target Growth 4.4% Achieved Growth 4.8% ✓ ✓ Moderately Successful ⚡ Key Initiatives & Schemes Garibi Hatao slogan: Given by Indira Gandhi — poverty alleviation main focus Regional Rural Banks (RRBs): Set up 1975 — to bring banking to villages 20 Points Programme (1975): Aimed to reduce poverty and improve quality of life Minimum Needs Programme (1974): Basic needs (food, shelter, education) for poor Hill Area Development Programme: Development of hilly regions Attainment of self-reliance was a key goal 💡 Real-Life Example Regional Rural Banks = Aaj bhi Grameen Bank jaisi soch. Gaon ke kisan ko bank se loan milna chahiye — yahi socha gaya. RRBs aaj India ke har district mein hain. \"Garibi Hatao\" = Indira Gandhi ka best political slogan, jo aaj bhi yaad hai! 🔄 Rolling Plan (1978–1980) 🔄 Rolling Plan Introduced by: Janata Party / Morarji Desai Government Duration: 1978–1980 Key Focus: Increase in GDP, employment, and agricultural production Target Growth 5.2% Achieved Growth 5.7% ✔ ✔ Successful ⚡ Key Schemes TRYSEM — Training Rural Youth for Self-Employment IRDP — Integrated Rural Development Programme (assets transfer) NREP — National Rural Employment Program (slack season employment) RLEGP — Rural Landless Labour Employment Guarantee Programme — Launched 15 August 1983 NABARD (National Bank for Agriculture and Rural Development) — Established 12 July 1982, on the recommendation of B. Sivaraman Committee 📡 Sixth Five-Year Plan 6th Five-Year Plan 1980–1985 Duration 1980 – 1985 Prime Minister Indira Gandhi Note Rolling Plan abandoned; FYP reinstated 📊 Performance Target Growth 5.2% Achieved Growth 5.7% ✔ ✔ Successful 🎯 Primary Focus Increase in National Income Modernisation of technology Decrease poverty and unemployment (skill transfer schemes) 💡 Real-Life Example Indira Gandhi phir waapas aayi power mein (1980) aur Rolling Plan band karke proper Five-Year Plan shuru kiya. NABARD ki sthapna isi daur mein — aaj bhi NABARD rural India ka financial backbone hai! 💻 Seventh Five-Year Plan 7th Five-Year Plan 1985–1990 Duration 1985 – 1990 Prime Minister Rajiv Ga"}, {"title": "Cell", "subject": "Biology", "url": "../biology/cell_notes.html", "text": "Cell Biology Notes – RISE NOTES RISE NOTES 🔬 Cell Biology Fundamentals of Cytology – Complete Study Notes 📋 Topics at a Glance 1 Fundamentals of Cytology 2 Discovery of Cell 3 Cell Theory 4 Key Cellular Facts 5 Cell Membrane 6 Movement Across Membrane 7 Cell Wall 8 Cytoplasm 9 Nucleus & Nucleoplasm 10 Chromosomes & DNA 11 Types of Cells 12 Cell Organelles 13 Plastids 14 Cell Division 15 Cell Cycle 16 DNA Replication 17 Endocytosis vs Exocytosis 18 Cytoskeleton & Centrosome 19 Animal vs Plant Cell ↑ Back to Topics 🔭 1. Fundamentals of Cytology Cytology = Study of Cells | Cyto = Cell | Logy = Study Cell kya hai? Cell life ki structural aur functional unit hai — matlab ye zindagi ki sabse chhoti building block hai. Cell → Tissue → Organ → Organ System → Organism (yahi order hai!) ↑ Back to Topics 🏺 2. Discovery of Cell 🪨 Dead Cell Robert Hooke ne 1665 mein cork mein dead cell dekhi. Inhe Father of Cytology kehte hain. 💧 Living Cell Antonie van Leeuwenhoek ne 1674 mein pond water mein living cell dekhi. ↑ Back to Topics 📖 3. Cell Theory 1 Schleiden & Schwann (1838) Sabhi living organisms cells se bane hain, aur cell life ki basic unit hai. 2 Rudolf Virchow (1855) — \"Omnis cellula e cellula\" Matlab: naye cells hamesha purane cells se bante hain. Naye cells suddenly nahi aate! ⚠️ Exception: Viruses Viruses Cell Theory ko follow nahi karte. Inke paas protoplasm ya organelles nahi hote — sirf DNA/RNA + Protein Coat (Capsid). Ye semi-living hote hain — reproduce karne ke liye host cell chahiye. ↑ Back to Topics ⭐ 4. Key Cellular Facts Largest Cell (Human) 🥚 Ovum (female sex cell) Smallest Cell (Human) 🔬 Sperm (male sex cell) Largest Cell in Male 🧠 Neuron (also longest!) Smallest Cell in Women 🩸 RBC (Red Blood Cell) Largest Cell (Overall) 🐦 Ostrich's Egg Smallest Cell (Overall) 🦠 Mycoplasma (bacteria) ↑ Back to Topics 🛡️ 5. Cell Membrane Kya hoti hai? Ise Plasma Membrane bhi kehte hain. Thin, elastic aur flexible structure hoti hai. Animal cells mein outermost covering , plant cells mein cell wall ke andar hoti hai. Composition (Kya bani hoti hai?) Proteins 50% Lipids 50% Lipids ke 2 types: Phospholipids Cholesterol Lipids = organic molecules jo water mein dissolve nahi hote par non-polar solvents mein hote hain (fats & waxes). Functions (Kya kaam karti hai?) 🛡️ Protective barrier — bodyguard ki tarah 📐 Cell ko shape deti hai 📦 Internal contents ko protect karti hai 🚪 Substances ki movement control karti hai — Selectively Permeable Membrane ↑ Back to Topics 🚢 6. Movement Across Cell Membrane 💨 Diffusion No Energy Needed High → Low concentration movement Rate: Gases > Liquids > Solids Example: Agarbatti ki khushbu 💧 Osmosis Water Movement Water ka movement semi-permeable membrane se High → Low concentration No energy, equilibrium tak chalta hai ⚡ Active Transport Energy Required Low → High concentration Reverse Osmosis bhi kehte hain Cellular energy (ATP) chahiye Solution Type Description Effect on Cell Solute vs Solvent Isotonic Normal solution No change in size Solute = Solvent Hypotonic Dilute solution Cell swells (Turgidity) Solute < Solvent Hypertonic Concentrated solution Cell shrinks (Plasmolysis) Solute > Solvent Turgor Pressure: Hypotonic solution mein cell mein pani ghusta hai → cell phool jata hai → Turgor pressure badhta hai → Cells ka growth aur enlargement hota hai. ↑ Back to Topics 🧱 7. Cell Wall Key Points Sirf Plant, Bacteria, Fungus, Algae mein hoti hai — Animal cells mein NAHI. Cell wall living structure nahi hai. Cell membrane ke bahar hoti hai. Freely permeable hai (unlike selectively permeable cell membrane). Rigidity, shape, structural support aur protection deti hai. 🌿 Plant Cellulose 🦠 Bacteria Peptin / Peptidoglycan 🍄 Fungi Chitin 🌊 Algae Cellulose / Pectin ↑ Back to Topics 🌊 8. Cytoplasm Kya hota hai? Plasma membrane aur nuclear envelope ke beech ka fluid. Saare cell organelles cytoplasm mein hi hote hain. Cytosol: Water-based fluid portion (aqueous part). Cytoplasmic Inclusions: Non-living components — pigments, nutrients etc. ↑ Back to Topics 🧠 9. Nucleus & Nucleoplasm Nucleus — \"Brain of the Cell\" Discovery: Robert Brown, 1831 Cell ke center mein hota hai. Eukaryotic cell ka sabse bada organelle hai (double-membraned). Double-layered nuclear membrane nucleus ko cytoplasm se alag karti hai. Saare cell organelles ki activities control karta hai. Protoplasm = Cell membrane + Cytoplasm + Nucleus — ye cell ka living material hai. Isme nucleic acids, proteins, lipids aur carbohydrates hote hain. Nucleoplasm Purkinje ne 1839 mein term diya. Thick fluid se bana hota hai — chromatin fibers (DNA + proteins) hote hain. Nucleolus: Non-membrane-bound structure — ribosome biogenesis (banane) ke liye. Chromatin material: DNA + Proteins (mainly Histones) ka complex. Euchromatin Loosely packed — active (transcription hoti hai) Heterochromatin Tightly packed — inactive (transcription nahi hoti) ↑ Back to Topics 🧬 10. Chromosomes & DNA Chromosomes Thread-like structures jo nucleus mein hote hain — DNA aur genes carry karte hain. Genetic information ek cell se doosre mein le jaate hain. Components: DNA + Proteins (Histones) Human mein total: 46 chromosomes = 23 pairs 22 pairs = Autosomal | 1 pair = Sex (XX female, XY male) DNA Genetic information carry karta hai. Genes: DNA ke functional segments — next generation ko info transfer karte hain. Discovery: Friedrich Miescher (1869) Double-Helical Structure: Watson and Crick (1953) Nucleotide = Phosphate + Deoxyribose + Nitrogenous Base Base Pairs: Guanine ↔ Cytosine | Adenine ↔ Thymine (DNA) RNA mein: Adenine ↔ Uracil (Thymine ki jagah) ↑ Back to Topics 🔀 11. Types of Cells Feature Prokaryotic Cell Eukaryotic Cell Size 1–10 µm 10–100 µm Nucleus Absent Present Nucleolus Absent Present Cell Organelles Absent Present Chromosome Single More than one Examples Bacteria, Cyanobacteria, Mycoplasma Plant & Animal cells Common to both: Cell membrane, Cytoplasm, Ribosomes Nucleoid: Bacterial cell mein nucleus jaisi region jo membrane se bound nahi hoti. Bacterial Flagellum Microscopic hair-like structures — cell ki locomotion (movement) ke liye. Helical structure — flagellin protein se bana. 3 parts: Basal Body Hook Filament ↑ Back to Topics ⚙️ 12. Cell Organelles ⚡ Mitochondria Powerhouse of the Cell Discovery: Kolliker (1857) Size: 1–2 µm, Sausage shape ATP (Adenosine Triphosphate) synthesis karta hai — Energy currency Apoptosis (programmed cell death) mein role Apna DNA aur ribosomes hote hain 2 membranes: Outer (porous) + Inner (ATP synthesis) 🏭 Ribosomes Protein Factory Discovery: George E. Palade (1955) No membrane hoti in mein Protein synthesis ke liye essential Both prokaryotes & eukaryotes mein hote hain 🚇 Endoplasmic Reticulum Transport System Sac-like network of structures Plasma membrane ↔ Nuclear membrane se connected RER: Ribosomes present → Protein synthesis SER: No ribosomes → Lipid/fat synthesis + Detoxification (liver mein cytochrome P450) 📬 Golgi Bodies Post Office of Cell Discovery: Camillo Golgi (1898) Vesicles, cisternae, vacuoles se bana Cis face: Convex, nucleus ki taraf (receiving) Trans face: Concave, plasma membrane ki taraf (shipping) Proteins & lipids packaging + dispatch Simple sugars → Complex sugars banata hai Lysosomes banata hai 💣 Lysosomes Suicide Bag of Cell Digestive enzymes (made in RER) se filled Cell ka waste disposal system Cell damage hone par burst hote hain → apni hi cell digest karte hain 🫙 Vacuoles Storage Bags Membrane-bound, solid/liquid filled sac Plants: Large (50–90% cell volume), permanent, cell sap store karte hain, turgidity dete hain Animals: Small, numerous, temporary, glucose/glycogen/protein store karte hain Waste products temporarily stored in vacuoles 🔋 Peroxisomes Detox Center Very long chain fatty acids ko break karta hai (beta oxidation) Catalase enzyme hoti hai → Harmful H₂O₂ → Water + O₂ Free radical scavengers — cell ko detoxify karte hain ↑ Back to Topics 🌿 13. Plastids Plastids sirf plant cells mein hote hain, animal cells mein nahi. Inke paas apna DNA aur ribosomes hote hain. 🌱 Chloroplasts Photosynthesis Green plastids — chlorophyll pigment hota hai Yellow/orange pigments: Xanthophyll, Carotenes Chlorophyll mein Magnesium (Mg²⁺) hota hai — solar energy capture ke liye 🍅 Chromoplasts Color Provider Different pigments → color provide karte hain Tomato red → Lycopene Chilli red → Capsanthin Anthocyanin → fruits/veges ka color Yellow color → Xanthophyll ⬜ Leucoplasts Storage (Colorless) Amyloplast → Carbohydrates store Aleuroplast → Proteins store Elaioplast → Fats store ↑ Back to Topics ✂️ 14. Cell Division Cell division = ek parent cell 2 ya zyada daughter cells mein divide hoti hai. Division ki Zaroorat Kyun? 1️⃣ Organism ka growth 2️⃣ Old, dead, injured cells ko replace karna 3️⃣ Gamete formation (Meiosis se) Feature Mitosis Meiosis Cells Somatic (body) cells Germ (reproductive) cells Nucleus divides Once Twice Daughter cells 2 4 Chromosome number Diploid (2n) — same as parent Haploid (n) — half of parent Genetic identity Identical to parent Different from parent Purpose Growth, repair, asexual reproduction Gamete formation (egg & sperm) Genetic variation No Yes (crossing over) Malfunction leads to Cancer (uncontrolled division) Down's, Klinefelter's, Turner's syndrome Mitosis ke Phases (PMAT) Prophase: Chromosomes condense aur visible ho jaate hain Metaphase: Chromosomes cell ke equator pe align ho jaate hain Anaphase: Sister chromatids separate ho jaate hain, opposite poles pe jaate hain Telophase: 2 new nuclei form hote hain ↑ Back to Topics 🔄 15. Cell Cycle Interphase (I phase) 3 sub-phases hoti hain: G1 Phase (Gap 1): Cell grow karta hai, normal functions karta hai, DNA replication ki preparation S Phase (Synthesis): DNA replicate hota hai — har chromosome ki 2 identical copies ban jaati hain G2 Phase (Gap 2): Cell aur grow karta hai, ensure karta hai ki DNA replication complete ho gayi, mitosis ke liye ready hota hai M Phase (Mitotic Phase) Cell ka nucleus aur cytoplasm divide hote hain. Karyokinesis: Nucleus ka division (Prophase → Metaphase → Anaphase → Telophase) Cytokinesis: Cytoplasm ka division ↑ Back to Topics 🔁 16. DNA Replication DNA Replication = Cell apna exact DNA copy banata hai cell division se pehle — taaki har naye cell ko same genetic information mile. Semi-Conservative Replication 2 new double-stranded DNA molecules bante hain — har ek mein ek original strand aur ek naya strand hota hai. Enzymes (DNA Replication ke liye) Helicase DNA ko unwind/unzip karta hai (🔓) Topoisomerase DNA ko tangle hone se rokta hai DNA Primase Replication initiate karta hai (new strands produce) DNA Polymerase DNA ki amount double karta hai (Builder 🏗️) DNA Ligase DNA strands ko join karta hai (Gluer 🔗) ↑ Back to Topics 🔃 17. Endocytosis vs Exocytosis 🍽️ Endocytosis — Cell Eating/Drinking Active transport ka ek type Cell external materials ko engulf karta hai → vesicle banata hai andar laane ke liye Phagocytosis: Cell eating Pinocytosis: Cell drinking Example: Amoeba food particles trap karta hai 🤮 Exocytosis — Cell Vomiting Cell molecules ko bahar transport karta hai Vesicles cell membrane se fuse hote hain → contents extracellular space mein release hote hain Vomited particles = undigested residues from endocytosis → enzymes & hormones Amoeba Digestion Steps 1. Ingestion 2. Digestion 3. Absorption 4. Assimilation 5. Egestion ↑ Back to Topics 🦴 18. Cytoskeleton & Centrosome Cytoskeleton Cell ko structural support deta hai. Cell movement mein help karta hai. Centrosome — MTOC Microtubule Organizing Center — cell division aur structure regulate karta hai. Microtubules organize karta hai — cell structure, movement aur division ke liye essential. Har centriole ek cylindrical structure hai jो microtubules se bana hai — 9+0 arrangement . Microtubules Hollow, cylindrical structures — tubulin proteins se bane hain. Cell ka cytoskeleton form karte hain, structural support, movement aur cell division mein role. ↑ Back to Topics 🆚 19. Animal Cell vs Plant Cell Feature Animal "}, {"title": "Plant Tissue and Animal Tissue", "subject": "Biology", "url": "../biology/plant_animal_tissue.html", "text": "Plant Tissue and Animal Tissue ← Biology Plant Tissue and Animal Tissue Plant Tissue › Animal Tissue ›"}, {"title": "Plant and Animal Kingdom", "subject": "Biology", "url": "../biology/plant_animal_kingdom.html", "text": "Plant and Animal Kingdom ← Biology Plant and Animal Kingdom Plant Kingdom › Animal Kingdom ›"}, {"title": "Nervous System", "subject": "Biology", "url": "../biology/nervous_system_notes.html", "text": "Nervous System Notes – RISE NOTES RISE NOTES · Biology Notes Nervous System Complete Notes · SVG Diagrams के साथ Nervous System क्या है? Nervous System हमारे शरीर का Control Room है। यह cells और nerves का एक जटिल network है जो पूरे शरीर को control और coordinate करता है। इसमें Brain, Spinal Cord और वो सारी nerves शामिल हैं जो इन organs को बाकी शरीर से जोड़ती हैं। 1 Nervous System का पूरा Map 🗺️ Nervous System — Complete Tree Diagram Nervous System Central Nervous System Peripheral Nervous System Brain Spinal Cord Forebrain Midbrain Hindbrain Cerebrum Thalamus Hypothalamus Pons Cerebellum Medulla Oblongata Somatic NS Autonomic NS Sensory (Afferent) Motor (Efferent) Sympathetic Parasympathetic 2 CNS के कार्य ⚡ CNS क्या-क्या करता है? Sense organs (आँख, कान, skin) से signals collect करता है। Voluntary movements जैसे चलना, लिखना, बोलना control करता है। Involuntary movements जैसे heartbeat, digestion control करता है। Muscles और glands को signals भेजता है। Thermoregulation — body temperature stable रखता है। Hypothalamus भूख और प्यास दोनों control करता है। 🔄 Signal Flow Diagram Sense Organs 👁️👂 Afferent CNS (Brain + Spinal Cord) Efferent Muscles & Glands 💪 Response / Action 3 The Human Brain 🧠 Brain — Key Facts CNS का main organ है। Skull + CSF (Cerebrospinal Fluid) में protected। Weight: 1300–1400g (Males), 1200–1300g (Females) CSF buoyancy से effective weight = सिर्फ 50g ! Body weight का 2% लेकिन खाता है 20% O₂ + 20-25% Glucose Pain receptors = Meninges में होते हैं। 🧠 Brain — Side View (Labeled) Forebrain (Cerebrum) Mid Cerebellum Brain Stem Corpus Callosum Thal. Hypo. Medulla Oblongata Skull Pons 🔒 Meninges — Brain की 3 Protective Layers बाहर से अंदर ↓ SKULL (खोपड़ी) 1. DURA MATER — Outermost (सबसे बाहरी) 2. ARACHNOID MATER — Middle (बीच की पतली layer) ~ CSF — Cerebrospinal Fluid (brain यहाँ तैरता है) ~ 3. PIA MATER — Innermost (brain tissue को touch करती है) 🧠 BRAIN TISSUE ⚠️ Pain receptors Meninges में 4 Brain के तीन मुख्य भाग 🔵 1. Forebrain (अग्रमस्तिष्क) — Brain का सबसे बड़ा हिस्सा सबसे आगे का और सबसे बड़ा भाग। Voluntary movements और higher cognitive functions (सोचना, याददाश्त, consciousness) control करता है। 🔵 Forebrain के तीन भाग Forebrain Cerebrum • Brain का सबसे बड़ा हिस्सा • Memory & Learning • Corpus Callosum Thalamus • Relay Station • Sensory & Motor • Touch/Taste → Cortex Hypothalamus • Temp / Hunger / Thirst • ANS control करता है • Hypothalamic Hormones 🟡 2. Midbrain (मध्यमस्तिष्क) Hypothalamus (forebrain) और Pons (hindbrain) के बीच में स्थित। Eye movements (Motor control) में मदद करता है। Vision और Hearing processing करता है। 🔴 Hindbrain के तीन भाग Hindbrain Pons 🌉 • Face/Eye movements • Facial sensations • Hearing coordinate Cerebellum ⚖️ • Body posture & balance • \"Little Brain\" • Coordination of movement Medulla Oblongata 💓 • Spinal cord से connected • Heartbeat, Respiration • Gastric secretion 5 Brain के 4 Lobes 🗺️ Brain Lobes — Top View FRONTAL LOBE Planning, Reasoning, Emotions PARIETAL Touch, Pain, Spatial OCCIPITAL Vision, Visual Processing TEMPORAL TEMPORAL ← Front (आगे) Lobe कार्य 🟡 Frontal Reasoning, Planning, Emotions, Motor 🟢 Parietal Touch, Pain, Temperature, Spatial 🔵 Temporal Hearing, Language, Memory 🔴 Occipital Vision, Visual Processing 6 Spinal Cord (मेरुदंड) 🦴 Spinal Cord — Nerve Pairs Cervical 8 pairs Neck Thoracic 12 pairs Upper Back Lumbar 5 pairs Lower Back Sacral 5 pairs Cauda Equina Total: 31 pairs Spinal Cord — Key Points Brain से body तक और body से Brain तक signals transmit करता है। Reflexes coordinate करता है। Total 31 pairs of spinal nerves। Section Region Pairs Cervical Neck (गर्दन) 8 Thoracic Upper back 12 Lumbar Lower back 5 Sacral — 5 Cauda Equina Spine base Lower body sensation 7 Peripheral Nervous System (PNS) ⚙️ PNS — Complete Breakdown with Functions PNS Somatic NS Voluntary Movements Autonomic NS Involuntary Processes Sensory (Afferent) Body → CNS Motor (Efferent) CNS → Body Sympathetic Fight-or-Flight 🥊 Parasympathetic Rest & Digest 😴 8 Neuron — Nervous System की Unit 🔬 Neuron Structure — Labeled Diagram Dendrites (सूचना receive) Nucleus Cell Body (Soma) Axon (signal transmit करता है) Myelin Sheath (insulation) Node of Ranvier Axon Terminal (Neurotransmitters) Signal Direction → → (Dendrite → Cell Body → Axon → Next Neuron) 9 Enteric Nervous System (ENS) — Second Brain 🍽
