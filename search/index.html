ितना करें, किसके लिए करें। आपके पास ₹6000 हैं। आप Shoes भी चाहते हैं और Jeans भी — लेकिन दोनों एक साथ नहीं खरीद सकते। यही Central Problem है — Scarcity forces you to make a Choice! 📈 2. Production Possibility Curve (PPC) / Frontier (PPF) 📌 Definition PPC एक ऐसी curve है जो दो goods के उन सभी maximum possible combinations को दिखाती है जो एक economy अपने available resources और technology से produce कर सकती है — assuming full and efficient utilization of resources। इसे Production Possibility Frontier (PPF) भी कहते हैं। 📊 Graph Characteristics (PPC की विशेषताएं) Trade-off: दो goods के बीच trade-off दिखाता है। जैसे — Shoes vs Jeans। Slope: Downward Sloping (Negative Slope) — एक good ज़्यादा produce करो तो दूसरी कम करनी पड़ेगी। Shape: Concave to the Origin — MRT बढ़ता जाता है (Increasing Marginal Rate of Transformation)। MRT: PPC की slope को Marginal Rate of Transformation कहते हैं — एक extra unit के लिए कितनी दूसरी good sacrifice करनी पड़ेगी। PPC पर तीन Positions का मतलब: ✅ ON the Curve Full & Efficient Utilization (₹6000 पूरे खर्च) ⚠️ BELOW the Curve Under-Utilization of Resources (₹4000 ही खर्च, ₹2000 बचे) ❌ ABOVE the Curve Unattainable / Impossible (₹7000 खर्चना है पर हैं ₹6000) PPF Shifts Outward (बाहर की तरफ): जब नई technology आती है या नए resources मिलते हैं तो PPF outward shift होती है — economy ज़्यादा produce कर सकती है। ₹6000 हैं। Option A: 6 pairs shoes + 0 jeans। Option B: 0 shoes + 6 jeans। या कोई भी बीच का combination। Curve के ऊपर का point (₹7000 खर्च) — अभी impossible। Lockdown जैसे time में below the curve — under-utilization। PPC की shape = Concave to Origin (Inward)। Indifference Curve की shape = Convex to Origin। दोनों को confuse मत करना! 💰 3. Opportunity Cost (अवसर लागत) 📌 Definition जब आप कोई एक choice करते हैं, तो जो next best alternative छोड़ते हैं उसकी value = Opportunity Cost । Example 1 Jeans buy करने का Opportunity Cost = वो Shoes जो आप नहीं खरीद पाए। Example 2 SSC prepare करने का Opportunity Cost = वो Banking Job जो आप join नहीं कर सके। 🌬️ Free Goods — Zero Opportunity Cost Air, Sunlight जैसी चीज़ें nature में abundant हैं — इन्हें पाने के लिए कुछ sacrifice नहीं करना पड़ता। इसलिए इनका Opportunity Cost = 0 (Zero) होता है। अगर आप एक दिन की छुट्टी लेकर घूमने जाते हैं, तो उस दिन की salary जो नहीं मिली — वही आपका Opportunity Cost है। 😊 4. Utility Analysis (उपयोगिता विश्लेषण) 📌 Utility क्या है? Utility = किसी good या service को consume करने से जो satisfaction या benefit मिलती है। यह एक subjective (मनोवैज्ञानिक) concept है — हर इंसान के लिए अलग। Types of Utility Measurement: 1. Cardinal Utility Satisfaction को numbers में measure करते हैं। (Quantitative — मात्रात्मक) Less Realistic — क्योंकि satisfaction को exactly number में measure करना मुश्किल है। 2. Ordinal Utility Satisfaction को rank करते हैं — 1st, 2nd, 3rd। (Qualitative / Psychological) More Realistic — हम easily कह सकते हैं \"Pizza > Burger\" मुझे। 📌 Marginal Utility (MU) क्या है? एक extra unit consume करने से जो additional satisfaction मिलती है = Marginal Utility । 📉 Law of Diminishing Marginal Utility जैसे-जैसे हम किसी good की ज़्यादा units consume करते जाते हैं, हर अगली unit से मिलने वाली satisfaction (MU) घटती जाती है। 🥟 Golgappa (Panipuri) Example: 1st Golgappa — बहुत मज़ा! 😋 5th Golgappa — ठीक है। 10th Golgappa — बस हो गया, और नहीं चाहिए। 😑 हर अगले Golgappa से satisfaction कम होती गई — यही Diminishing MU है! MU तब Zero होती है जब आप किसी good से completely satisfied हो जाते हैं। और Negative हो सकती है अगर और ज़्यादा consume किया जाए। 🍵 5. Indifference Curve (IC) — उदासीनता वक्र 📌 Definition एक ऐसी graph जो दो goods के उन combinations को दिखाती है जिनसे consumer को same level of satisfaction मिलती है। Consumer इन सभी points पर \"Indifferent\" (equally happy) होता है — उसे कोई preference नहीं। 📊 Properties of Indifference Curve Shape: Convex to the Origin (Rectangular Hyperbola) — यह curve अंदर की तरफ झुकी होती है। Slope: MRS (Marginal Rate of Substitution) से determine होती है — consumer कितना एक good छोड़ने को ready है दूसरी पाने के लिए। No Intersection: दो Indifference Curves कभी एक-दूसरे को cross नहीं करती। Higher IC = More Satisfaction — जो curve ऊपर/दाईं तरफ होगी वो ज़्यादा satisfaction देती है। 🍵 Chai & Samosa Example — MRS को समझो Combination Chai Samosas Samosas Sacrificed A (Starting) 1 12 — B 2 6 6 samosas छोड़े C 3 4 2 samosas छोड़े D 4 3 1 samosa छोड़ा Conclusion: जैसे-जैसे Chai बढ़ती है, Samosa sacrifice कम होती जाती है — यही Diminishing MRS है, और इसीलिए curve Convex होती है। आप दोनों Chai और Samosa को equally पसंद करते हैं। पहले आपके पास बहुत Samosas थे तो 1 Chai के लिए 6 Samosa देने को तैयार थे। लेकिन जब Samosas कम हो गए, तो अब 1 Chai के लिए बस 1 Samosa देंगे — क्योंकि अब Samosa precious हो गया। 🏭 6. Isoquant Curve (समोत्पाद वक्र) 📌 Definition एक ऐसी curve जो inputs (Labor & Capital) के उन combinations को दिखाती है जो same quantity of output produce करते हैं। Indifference Curve vs Isoquant IC: Consumer की satisfaction same रहती है। Isoquant: Producer का output same रहता है। IC का slope = MRS Isoquant का slope = MRTS (Marginal Rate of Technical Substitution) MRTS क्या है? Marginal Rate of Technical Substitution — Capital की कितनी units को Labor की एक extra unit से replace किया जा सकता है, बिना output बदले। एक factory में 100 units produce करनी हैं। Option 1: 10 workers + 5 machines। Option 2: 5 workers + 10 machines। दोनों से 100 units बनती हैं — यह Isoquant पर दो points हैं। 🛒 7. Demand (मांग) 📌 Definition किसी good या service की वह quantity जो consumers एक particular price पर , एक specific time period में , खरीदने के लिए willing AND able हों। ⚠️ सिर्फ willingness नहीं — Ability (purchasing power) भी ज़रूरी है! 📉 Law of Demand (मांग का नियम) Price और Quantity Demanded के बीच Inverse Relationship होती है — बाकी सब factors constant रहें ( Ceteris Paribus )। Price ↑ → Demand ↓ Price ↓ → Demand ↑ Demand Curve: Downward Sloping (Negative Slope) Ceteris Paribus = बाकी सब factors जैसे Income, Price of other goods, Consumer Preferences same रहें। 🔄 Movement vs Shift — बहुत important! 1. Movement (Along the Curve) Cause: Price बदलना Curve same रहती है — सिर्फ उस पर आगे-पीछे move होते हैं। → Expansion (price↓, demand↑) → Contraction (price↑, demand↓) 2. Shift (Of the Curve) Cause: Price के अलावा कोई factor बदलना (Income, Preferences, Substitute price, etc.) → Rightward Shift = Demand बढ़ी → Leftward Shift = Demand घटी Petrol की price बढ़ी → Movement along curve (demand घटी)। लोगों की income बढ़ी → Rightward Shift (same price पर ज़्यादा demand)। Movement = Price change। Shift = Non-price factor change। यह distinction exam में बहुत आता है! ⚡ Exceptions to Law of Demand (नियम के अपवाद) 🥣 Giffen Goods Low-income, non-luxury, essential goods। Price बढ़े → Demand भी बढ़े! Why? गरीब लोग Roti/Bread के अलावा afford नहीं कर सकते। Price बढ़ी तो और बचाने के लिए और ज़्यादा Roti खरीदी। Examples: Rice, Bread (poor households में) 💎 Veblen Goods Luxury / Status Symbol goods। Price बढ़े → Demand और बढ़े! (Snob Effect) Why? महंगा है इसलिए और exclusive और desirable लगता है। Examples: iPhone, Mercedes, Gold Jewellery 🏗️ 8. Supply (आपूर्ति) 📌 Definition किसी product या service की वह amount जो producers एक given price पर , एक specific time period में , provide करने के लिए willing AND able हों। 📈 Law of Supply (आपूर्ति का नियम) Price और Quantity Supplied के बीच Direct (Positive) Relationship होती है। Price ↑ → Supply ↑ Supply Curve: Upward Sloping (Positive Slope) Why Upward? Producers profit maximize करना चाहते हैं — ज़्यादा price मिलेगी तो ज़्यादा produce करेंगे। Tomato की price ₹20/kg से बढ़कर ₹80/kg हो गई → Farmers ने ज़्यादा tomatoes उगाए और बेचे — यही Law of Supply है। ⚖️ 9. Equilibrium (संतुलन) 📌 Definition वह point जहाँ Demand Curve और Supply Curve आपस में मिलती हैं। इस point पर: Quantity Demanded = Quantity Supplied इसी point पर जो price बनती है उसे \"Equilibrium Price\" या \"Market Clearing Price\" कहते हैं। 🔄 Equilibrium Static नहीं है अगर Demand या Supply में कोई change आए तो Equilibrium point shift हो जाता है। जैसे: Demand बढ़ी → Curve Right shift → नया Equilibrium = higher price & quantity 📊 Market Clearing Price इस price पर न कोई surplus (ज़्यादा supply) होती है, न कोई shortage (ज़्यादा demand)। Market perfectly clear हो जाता है। Onion की demand wedding season में बढ़ गई (Right Shift) → Price बढ़ी → Farmers ने supply बढ़ाई → एक नया Equilibrium बना। 📏 10. Price Elasticity of Demand (मूल्य लोच) 📌 Definition Price Elasticity of Demand बताती है कि price change होने पर quantity demanded कितना change होती है। Ed = % Change in Quantity Demanded ÷ % Change in Price 1. Perfectly Elastic Demand Price ज़रा सी बढ़े → Demand Zero हो जाए। Price ज़रा सी घटे → Demand Infinite हो जाए। Curve: Horizontal (Flat line) Examples: Luxury goods — Gold, Cars Ed = ∞ 2. Perfectly Inelastic Demand Price कुछ भी हो → Demand same रहती है। Quantity fixed रहती है, change नहीं होती। Curve: Vertical (खड़ी line) Examples: Necessary goods — Water, Wheat, Rice, Life-saving medicines Ed = 0 3. Relatively Elastic Demand Price में थोड़ा change → Demand में बहुत ज़्यादा change। Consumers price के लिए sensitive हैं। Examples: Luxury items, Entertainment Ed > 1 4. Relatively Inelastic Demand Price में बहुत change → Demand में थोड़ा change। Price ज़्यादा बदलती है demand से। Examples: Petrol, Cigarettes, Essential medicines Ed < 1 💼 Income Elasticity of Demand Income बदलने से demand कितना बदलती है। Normal Goods: Income ↑ → Demand ↑ (Positive relationship) Curve Right shift होती है। Example: AC, Car, Eating out Inferior Goods: Income ↑ → Demand ↓ (Negative relationship) लोग richer होने पर ये goods छोड़ देते हैं। Example: Cheap local bus → Car prefer करते हैं Petrol की price 20% बढ़ी → Car owners की demand 5% घटी (Inelastic — लोग avoid नहीं कर सकते)। लेकिन Cold drink की price 20% बढ़ी → demand बहुत घट गई (Elastic — alternative है)। 🔀 11. Cross-Price Elasticity (क्रॉस कीमत लोच) 📌 Definition एक good की price बदलने से दूसरी good की demand कितना change होती है। Example: Pepsi की price 10% बढ़ी → Coke की demand 5% बढ़ी। Substitute vs Complementary Goods Feature Substitute Goods Complementary Goods Meaning एक-दूसरे की जगह use हो सकते हैं साथ-साथ use होते हैं Demand Type Competitive Demand Joint Demand Price Relation Positive (एक बढ़े, दूसरे की demand बढ़े) Negative (एक बढ़े, दूसरे की demand घटे) Examples Tea & Coffee, Coke & Pepsi Tea & Sugar, Car & Petrol, Printer & Ink ☕ Substitute: Starbucks की coffee महंगी हुई → लोग Cafe Coffee Day गए — यही Substitute good है। 🚗 Complementary: Petrol महंगा हुआ → Car की demand भी घटी — क्योंकि दोनों साथ use होते हैं। Cross Price Elasticity Positive = Substitute Goods। Cross Price Elasticity Negative = Complementary Goods। 🏪 12. Types of Market (बाज़ार के प्रकार) 1. 👑 Monopoly (एकाधिकार) Sellers: केवल 1 seller — पूरा market control करता है। Product: Unique — कोई close substitute नहीं। Entry: बहुत मुश्किल — High barriers। Price Control: Seller की पूरी मर्ज़ी। Examples: 🚂 Indian Railways, Water supply, Electricity distribution Indian Railways — पूरे India में rail travel का single provider। आपके पास कोई alternative नहीं — Monopoly! 2. 🤝 Oligopoly (अल्पाधिकार) Sellers: कुछ (Few) large firms market dominate करती हैं। Product: Similar या differentiated हो सकते हैं। Entry: Easy नहीं — Barriers हैं। Buyers: बहुत सारे। Examples: 📱 Telecom (Jio, Airtel, Vi, BSNL), Laptop market, Aviation Telecom Industry — Jio, Airtel, Vi — बस कुछ ही players। इनकी pricing एक-दूसरे से affect होती है। Jio ने price घटाई → Airtel को भी घटानी पड़ी। 3. 🪥 Monopolistic Competition (एकाधिकारी प्रतिस्पर्धा) Sellers: बहुत सारे sellers। Product"}, {"title": "Inflation & Unemployment Inflation, prices and unemployment.", "subject": "Economics", "url": "../economics/inflation_unemployment_notes.html", "text": "Inflation & Unemployment – Lecture 3 | Parmar SSC 📈 Inflation & Unemployment Complete Detailed Notes — Lecture 3 | Parmar SSC SSC Exam Preparation 🔥 1. Inflation क्या है? (Fundamentals) 📌 Definition Inflation = किसी economy में goods और services के general price level में sustained (लगातार) increase । Purchasing Power: Prices बढ़ने से पैसे की purchasing power घटती है — यानी same पैसे से पहले से कम चीज़ें मिलती हैं। Value of Money: Inflation पैसे की real value को erode (कमज़ोर) करती है। 😢 Creditors (Lenders) — नुकसान जो पैसा उन्होंने दिया था, वही पैसा वापस मिलता है — लेकिन अब उस पैसे से कम चीज़ें खरीद सकते हैं। Remedy: Lenders को Real Interest Rate charge करनी चाहिए। 😊 Debtors (Borrowers) — फायदा Loan कम value के पैसों से चुकाते हैं — effectively कम burden। इसलिए inflation borrowers के लिए फायदेमंद है। Real Interest Rate = Nominal Interest Rate − Inflation Rate आपने ₹10,000 loan लिया। एक साल बाद inflation बहुत high है। आपने ₹10,000 वापस किए — लेकिन अब उन ₹10,000 से bank उतना नहीं खरीद सकता जितना पहले खरीद सकता था। Borrower को फायदा, Lender को नुकसान। Real Interest Rate formula exam में बहुत important है। Nominal Rate = 10%, Inflation = 6% → Real Rate = 4% only। 💸 2. Fisher's Quantity Theory of Money 👨‍🔬 Irving Fisher Irving Fisher ने Money Illusion concept दिया — लोग nominal (कागज़ी) value देखते हैं, real value नहीं। MV = PT Variables का मतलब M = Money Supply (पैसे की मात्रा) V = Velocity of Money (पैसा कितनी बार हाथ बदलता है) P = Price Level (कीमत का स्तर) T = Transactions (लेन-देन की संख्या) Theory का निष्कर्ष अगर V और T constant रहें, तो M (money supply) बढ़ाने से directly P (price level) बढ़ता है — यानी inflation बढ़ती है । इसीलिए Government बेरोकटोक पैसा नहीं छाप सकती! 🖨️ Seigniorage (Inflation Tax) Definition: Government द्वारा currency print करने से होने वाला profit = Seigniorage । Why \"Tax\"? जब government ज़्यादा पैसा छापती है → Inflation बढ़ती है → आपकी जेब के पैसों की value घटती है। आपने directly tax नहीं दिया, लेकिन आपकी purchasing power कम हुई — यही Inflation Tax है। Deficit Financing: Government अपने loans चुकाने के लिए पैसा print कर सकती है — लेकिन ज़्यादा करने से Venezuela जैसी hyperinflation हो जाती है। COVID के दौरान कई देशों ने बड़ी मात्रा में पैसा print किया (stimulus packages)। बाद में 2022-23 में दुनियाभर में inflation spike हुई — यही Fisher's Theory को prove करता है। 📊 3. Types of Inflation (Intensity के आधार पर) 1. Creeping Inflation (रेंगती महंगाई) Rate: 3–4% | Economy के लिए healthy — खाने में नमक जैसा, थोड़ा ज़रूरी है। Growth को stimulate करती है। 2. Walking Inflation (चलती महंगाई) Rate: 4–10% | Government के लिए Warning Signal — अब control करना ज़रूरी है। 3. Running Inflation (दौड़ती महंगाई) Rate: 10–20% | Strong monetary intervention की ज़रूरत। Economy पर serious असर। 4. Galloping Inflation (सरपट महंगाई) Rate: 20–100% | Currency की value rapidly drop होती है। Economy unstable हो जाती है। 5. Hyper Inflation (अति महंगाई) Rate: >100% | Prices uncontrollably skyrocket। Currency practically worthless। Examples: Venezuela, Zimbabwe। Zimbabwe में 2008 में Hyperinflation इतनी थी कि लोग grocery के लिए wheelbarrow भर notes ले जाते थे। India में 2022-23 में CPI ~7% था — Walking Inflation zone। Creeping = Healthy (3-4%), Walking = Warning (4-10%), Running = Dangerous (10-20%), Galloping = Very Dangerous (20-100%), Hyper = Economy Collapse (>100%)। यह sequence याद रखें। ⚙️ 4. Causes of Inflation (Demand Pull vs Cost Push) Feature Demand Pull Inflation Cost Push Inflation Cause Demand बढ़ने से (Demand side) Production cost बढ़ने से (Supply side) Key Phrase \"Too much money chasing too few goods\" Factors of Production की cost बढ़ना Triggered by Strong economic growth, Govt. spending, Exports बढ़ना Wages बढ़ना, Raw material महंगा होना, Indirect taxes Duration Short-term हो सकती है Long-term हो सकती है 🛢️ Imported Inflation (आयातित महंगाई) जब कोई देश essential goods (जैसे Oil) import करता है और global prices बढ़ जाती हैं, तो domestic prices भी बढ़ती हैं। India का Example Chain: Global Crude Oil prices बढ़े → India में Petrol/Diesel महंगा → Transport cost बढ़ी → Vegetables, Milk, हर चीज़ महंगी। 2022 में Russia-Ukraine war की वजह से global crude oil prices spike हुई → India में petrol ₹110/litre पहुंचा → सब्जियों और दूध की कीमतें भी बढ़ीं — यही Imported Inflation है। 📏 5. Measurement of Inflation — WPI, CPI, PPI Inflation Rate = [(Current Year Index − Previous Year Index) ÷ Previous Year Index] × 100 Price Index = (Cost of Market Basket in Current Year ÷ Cost in Base Year) × 100 🏭 Wholesale Price Index (WPI) — थोक मूल्य सूचकांक Goods के wholesale level (consumer तक पहुँचने से पहले) पर average price change measure करता है। Focus: Corporations के बीच bulk trading की prices। Services: ❌ WPI में शामिल नहीं — only goods। Publishing Body: Office of Economic Adviser (OEA) — Ministry of Commerce & Industry। Base Year: 2011-12 (Upcoming: 2022-23)। Frequency: Monthly। WPI Basket Weightage: Manufactured Goods 64.2% — Highest weight Primary Articles 22.6% Fuel & Power 13.5% 🛒 Consumer Price Index (CPI) — उपभोक्ता मूल्य सूचकांक Retail/consumer level पर goods और services की average price change measure करता है। Common man की cost of living reflect करता है। Focus: Final consumer जो price pay करता है। Services: ✅ शामिल हैं — Education, Medical, Transport। Publishing Body: National Statistical Office (NSO) — Ministry of Statistics & Programme Implementation (MoSPI)। Base Year: 2012 (Upcoming: 2024)। Used By: RBI uses CPI (Combined) for inflation targeting and monetary policy। CPI Basket Weightage: Food & Beverages 45.8% — Highest (सबसे ज़्यादा) Housing 10% Fuel & Power 6.8% Four Types of CPI: CPI Type Target Group Published By Base Year CPI-IW Industrial Workers Labour Bureau (Min. of Labour) 2016 CPI-AL Agricultural Labourers Labour Bureau (Min. of Labour) 1986-87 (2019) CPI-RL Rural Labourers Labour Bureau (Min. of Labour) 1986-87 (2019) CPI (Combined) Rural + Urban (General) NSO (MoSPI) 2012 (2024) 🏭 Producer Price Index (PPI) — उत्पादक मूल्य सूचकांक Domestic producers को उनके output के लिए मिलने वाली selling prices में average change measure करता है। Perspective: CPI = buyer's perspective। PPI = seller's (producer's) perspective । Significance: \"Factory gate\" पर price change capture करता है — taxes और distribution costs add होने से पहले। Leading Indicator: यहाँ cost बढ़ती है → बाद में consumers पर pass होती है। इसलिए future inflation का indicator है। Stages Tracked: Raw materials → Intermediate goods → Finished products। Wheat (WPI) → Flour mill (WPI) → Atta packet at Kirana store (CPI)। WPI factory/wholesale level, CPI आपकी रसोई तक। अगर wheat expensive हुई (WPI बढ़ी) → कुछ महीनों बाद रोटी भी महंगी होगी (CPI बढ़ेगी)। RBI inflation targeting के लिए CPI (Combined) use करती है — WPI नहीं। यह question exam में बहुत आता है। 📰 6. Headline Inflation vs Core Inflation 📰 Headline Inflation CPI पर based raw inflation figure । Scope: Basket की सभी items — Food, Energy सब included। यह common consumer की daily life को directly affect करती है। News में \"Inflation X% है\" = Headline Inflation। 🔩 Core Inflation Headline से volatile items (Food + Fuel) हटाकर बचती है। Scope: Stable, structural price trends। Policymakers इसे देखते हैं क्योंकि यह long-term trend बताती है। Food और fuel seasonal/external shocks से बढ़ते हैं। Core Inflation = Headline Inflation − Volatile Inflation (Food + Fuel) 2023 में India की Headline Inflation ~6.5% थी — जिसमें tomatoes की price में 300% spike major reason थी। लेकिन Core Inflation ~5% थी। RBI Core को ज़्यादा seriously लेता है क्योंकि tomato prices seasonal हैं। 🏭 7. Index of Industrial Production (IIP) 📌 Definition IIP एक statistical indicator है जो किसी country में एक specific period में industrial production की growth measure करता है। Key Difference: CPI/WPI = Prices measure करते हैं। IIP = Production का volume/growth measure करता है। Publishing Body: National Statistical Organisation (NSO) — MoSPI। Base Year: 2011-12 (Upcoming: 2022-23)। Significance: Manufacturing, Mining और Electricity sector की health gauge करता है। ⭐ Eight Core Industries (8 प्रमुख उद्योग) ये industries IIP के total weight का ~40.27% account करती हैं। Highest से Lowest weightage के order में: 🛢️ Refinery Products — Highest Weightage (imported crude oil पर depend) ⚡ Electricity 🔩 Steel ⚫ Coal 🛢️ Crude Oil 💨 Natural Gas 🏗️ Cement 🌱 Fertilizers — Lowest Weightage 8 Core Industries की order याद करें: \"Refinery, Electricity, Steel, Coal, Crude Oil, Natural Gas, Cement, Fertilizers\" — Trick: RESCC NGCf 🌀 8. Special Types & Dynamics of Inflation 1️⃣ Disinflation (अपस्फीति दर में कमी) Inflation की rate घटती है — लेकिन prices अभी भी बढ़ रही हैं , बस slowly। Example: Year 1 = 10% → Year 2 = 8% → Year 3 = 5% — prices बढ़ रही हैं, लेकिन speed कम है। RBI ने 2022-23 में Repo Rate बढ़ाई → Credit महंगा हुआ → Money supply slow हुई → Inflation 7% से घटकर 5% पर आई — यही Disinflation है। 2️⃣ Deflation (अपस्फीति) — \"Negative Inflation\" Goods और services की prices सामान्यतः कम होती हैं । Purchasing power बढ़ती है। Why is it BAD? — Low prices sound good, लेकिन deflation = shrinking economy। Deflation का Dangerous Cycle: Prices गिरती हैं → Consumers wait करते हैं (और सस्ता होगा) → Demand और घटती है → Production कम होती है → Job losses → और demand कम… Japan 1990s में \"Lost Decade\" — Deflation की वजह से economy shrink हुई। लोग खर्च नहीं करते थे। 📉 Phillips Curve Unemployment और Inflation के बीच Inverse Relationship दिखाती है। 📈 High Inflation = Low Unemployment 📉 Low Inflation = High Unemployment 3️⃣ Stagflation (ठहराव + महंगाई) = Stagnation + Inflation Paradox: High Inflation + Low Economic Growth (Stagnation) + High Unemployment — तीनों एक साथ। Why Unique? यह Phillips Curve को defy करता है — normally high inflation = low unemployment। लेकिन Stagflation में economy stagnant होने पर भी prices बढ़ती हैं। Cause: Goods और services का production slow हो जाना। 1970s Oil Crisis — OPEC ने oil supply cut की → Production costs बढ़े → Prices बढ़ीं + Economy slow हुई + Unemployment बढ़ी = Classic Stagflation। 4️⃣ Shrinkflation (सिकुड़न महंगाई) Companies product की price same रखती हैं लेकिन quantity/size कम कर देती हैं । यह hidden price hike है। Purpose: Customers को visible price hike से डराए बिना rising production costs छुपाना। Lays chips का packet — same price ₹20, लेकिन अंदर chips कम और air ज़्यादा। Pepsi का bottle 320ml से 250ml — price same। आप same पैसे में कम पाते हैं। 5️⃣ Bottleneck Inflation / Structural Inflation Supply chain में \"choke points\" की वजह से supply demand के साथ नहीं चल पाती। Cause: Labor shortage, raw material scarcity, या shipping delays। Analogy: Economic traffic jam — सब खर्च करने को तैयार हैं, लेकिन एक \"narrow road\" पूरी supply को slow कर देती है। COVID-19 के बाद 2021 में semiconductor chip shortage — Automotive industry को chips नहीं मिलीं → Cars की supply कम → Car prices spike → Bottleneck Inflation। 6️⃣ Skewflation (असमान महंगाई) Overall economy में prices stable हों, लेकिp एक या दो specific sectors में sharp price increase । Problem: Overall inflation number misleadingly low दिखता है — लेकिन consumers daily essentials में \"pinch\" feel करते हैं। India में 2023 में overall CPI ~5% था, लेकिन tomato prices ने 400% की छलांग लगाई। Vegetable buyers बहुत affect हुए — rest of economy ठीक था। यही Skewflation है। 7️⃣ Reflation (पुनः स्फीति) Government का deliberate fiscal या monetary policy — recession या deflation के बाद economy को stimulate करना । Goal: Price levels को \"re-inflate\" करना, demand boost करना। Method: Interest rates घटाना या Government spending बढ़ाना। Challenge: सही समय पर रोकना ज़रूरी है — वरना uncontrolled inflation हो जाती है। COVID के बाद India सरकार ने ₹20 lakh crore का stimulus package दिया → Economy को reflate करने की कोशिश। 8️⃣ Inflationary Gap (स्फीतिक अंतराल) जब economy की total demand (Aggregate Demand) उसकी full employment पर produce करने की maximum capacity (Aggregate Supply) से ज़्यादा हो जाती है। Result: Factories और labor already full capacity पर हैं — extra demand more production नहीं बना सकती, सिर्फ prices push करती है। Economy \"Overheating\" होती है। Solution: Taxes बढ़"}, {"title": "National Income National income concepts and aggregates.", "subject": "Economics", "url": "../economics/national_income_notes.html", "text": "National Income – Lecture 4 | Parmar SSC 🏦 National Income Complete Detailed Notes — Lecture 4 | Parmar SSC SSC Exam Preparation 🏛️ 1. National Income क्या है? (Fundamentals) 📌 Definition National Income = एक country के residents (nationals) द्वारा एक specific period (usually financial year) में produce किए गए सभी final goods और services का total monetary value । Scope: यह एक Macroeconomic concept है — पूरी economy को एक साथ analyze करता है। 📅 Financial Year (India) India में National Income calculate होती है Financial Year के basis पर। Period: 1st April → 31st March 📌 Constitution में \"Budget\" शब्द नहीं है — Article 112 इसे \"Annual Financial Statement\" कहता है। 🔄 Macro vs Micro Microeconomics: Individual consumers या firms study करना। (e.g., एक person की utility) Macroeconomics: पूरी economy को एक साथ analyze करना। (e.g., पूरे India की income) जैसे एक school में हर बच्चे का report card = Micro। पूरे school का overall result = Macro। National Income = पूरे India का \"Report Card\"। 📜 2. Historical Evolution of National Income in India 👴 Dadabhai Naoroji — Pioneer of National Income in India First Estimation: National Income concept India में Dadabhai Naoroji ने introduce किया। Book: \"Poverty and Un-British Rule in India\" — जिसमें उन्होंने Drain Theory दी। Drain Theory: British colonial rule India की wealth drain कर रही है। East India Association (1866) — London में establish किया। Newspaper: Rast Goftar publish किया। 🏛️ Political Legacy First Asian to become a member of the British Parliament । Indian National Congress के 3 sessions presided किए (famous 1906 Calcutta session सहित)। 📊 P.C. Mahalanobis — Institutionalization of National Income National Income Committee (1949): Independence के बाद formal data collection के लिए committee बनी — chaired by P.C. Mahalanobis । Title: \"Father of Statistics in India\" । ISI: Indian Statistical Institute establish किया। Second Five-Year Plan: India का 2nd Five-Year Plan Mahalanobis Model पर based था। 🔬 V.K.R.V. Rao — Scientific Approach V.K.R.V. Rao ने National Income calculate करने के लिए scientific approach use किया। उन्होंने two-sector economy classification भी दी। तीनों names exam में बहुत आते हैं — Dadabhai Naoroji = First/Pioneer। Mahalanobis = Committee 1949 + Father of Statistics। V.K.R.V. Rao = Scientific approach। 🔄 3. Circular Flow of Income (आय का चक्रीय प्रवाह) 📌 Concept Economy में goods, services, resources और money का continuous movement = Circular Flow। Fundamental Idea: एक sector का expenditure दूसरे sector की income बन जाती है। The Cycle (चक्र): 1 Households → Firms को Factor Services (Land, Labour, Capital) provide करते हैं। ↓ 2 Firms → Households को goods & services produce करके देते हैं। ↓ 3 Households → Goods पर पैसा spend करते हैं (Consumer Expenditure)। ↓ 4 Firms → Households को Factor Payments देते हैं (Wages, Rent, Interest, Profit)। Factors of Production → Factors of Payment: 🏭 Factor of Production 💰 Factor of Payment 🌾 Land Rent (किराया) 👷 Labour Wages (मज़दूरी) 🏦 Capital Interest (ब्याज) 💡 Entrepreneurs Profit (लाभ) Economic Models of Flow (3 Types): 2-Sector Model Simple Economy Only: Households + Firms No government, no foreign trade 3-Sector Model + Government Added Households + Firms + Govt Taxes, Subsidies, Transfer payments 4-Sector Model + Rest of World + Foreign Sector Exports (X) & Imports (M) included आपका salary = Households को Wages (payment from Firm)। आपने उससे grocery खरीदी = Consumption Expenditure (payment to Firm)। पैसा फिर Firm के पास पहुँच गया — यही Circular Flow है। 💉 4. Injections vs Leakages (Economy में बदलाव) ✅ Injections (पैसा अंदर आना) Economy में additional funds enter होते हैं → Total spending बढ़ती है → Economic growth। I — Investment: Businesses का capital goods पर spending। G — Government Spending: Public services, defense, infrastructure। X — Exports: Foreign buyers से domestic economy में पैसा आता है। ❌ Leakages (पैसा बाहर जाना) Circular flow से funds exit होते हैं → Total spending घटती है → Economy slow। S — Savings: Households/Firms जो खर्च करने की बजाए save करते हैं। T — Taxes: Government को compulsory payments। M — Imports: Foreign goods पर spending — पैसा बाहर जाता है। ✅ Injections > Leakages → Economy Grows / Expands ❌ Leakages > Injections → Economy Contracts / Slows Down India में FDI आया (Injection) + Government ने highways पर ₹10 lakh crore invest किए (Injection) → Economy grow हुई। लेकिन लोगों ने ज़्यादा import करना शुरू किया + Tax ज़्यादा cut हुआ (Leakages बढ़ी) → Economy slow हो सकती है। Injections = I, G, X (IGX याद रखें)। Leakages = S, T, M (STM याद रखें)। 📐 5. Methods of Calculating National Income (3 Methods) Important: तीनों methods theoretically same result देते हैं — क्योंकि वे same income flow को अलग-अलग angles से देखते हैं: Production, Distribution, और Disposition। 📦 Method 1: Value Added Method (Production / Output Method) Economy के production side पर focus करता है। हर stage पर add की गई value sum करके National Income calculate करता है। Value Added = Value of Output − Intermediate Input (Consumption) GVA = GVA₁ + GVA₂ + GVA₃ + … GVAₙ Cotton-Shirt Chain Example (Double Counting avoid करना): Stage Output Value Input Used Value Added (VA) 🌾 Cotton ₹100 ₹0 ₹100 🧵 Yarn ₹200 ₹100 ₹100 🪡 Cloth ₹400 ₹200 ₹200 👕 Shirt ₹800 ₹400 ₹400 TOTAL ₹1,500 ❌ (Wrong) — ₹800 ✅ (Correct) Double Counting: सभी stages का Output (₹1500) जोड़ना गलत है — Cotton की value बार-बार count होती है। सिर्फ Value Added (₹800) जोड़ना सही है। GVA Methodology (2015): Central Statistics Office (CSO) — अब National Statistical Office (NSO) — ने 2015 में India के GDP calculation के लिए GVA methodology adopt की। 💰 Method 2: Income Method (Distribution Side) Economy के distribution side पर focus करता है। Production के Factors of Production (Land, Labour, Capital, Entrepreneur) द्वारा earn की गई सभी incomes sum करता है। National Income = Compensation of Employees + Operating Surplus + Mixed Income Components: Compensation to Employees: Workers को दी गई total wages/salaries। Operating Surplus: Businesses का profit — employee compensation deduct करने के बाद। (Profit + Rent + Interest शामिल।) Mixed Income: Self-employed और unincorporated businesses की income — जहाँ Labour और Capital income separately identify नहीं होती। Example: अपना clinic चलाने वाले Doctor। 🛒 Method 3: Expenditure Method (Disposition Side) सभी goods और services पर हुई total spending जोड़कर GDP calculate करता है। Most common method है। GDP = C + G + I + (X − M) C — Consumption Expenditure: Households का goods & services पर spending। G — Government Spending: Public expenditure — Defense, Roads, Salaries। I — Investment Expenditure: Businesses का capital goods पर spending (Machinery, Infrastructure)। (X−M) — Net Exports: X = Exports (foreign buyers से आया पैसा)। M = Imports (बाहर गया पैसा — subtract होता है)। आपने grocery खरीदी (C) + Government ने नई road बनाई (G) + Tata ने नई factory लगाई (I) + India ने software export किया (X) − China से goods import किए (M) = India का GDP। 📦 6. Final Goods vs Intermediate Goods Feature Final Goods Intermediate Goods Economic Process कोई और economic process नहीं होगा Semi-finished — और processes होंगी Usage Personal consumption या investment के लिए Other goods produce करने के लिए input Demand Type Direct consumption / capital investment Further processing या resale Example घर पर पीने के लिए Chai खरीदी = Final Good Hotel ने Chai बनाने के लिए tea powder खरीदा = Intermediate 🎯 Key Insight: Same good — different context में Final या Intermediate हो सकती है! Tea (घर के लिए) = Final Good। Tea (hotel में sell करने के लिए) = Intermediate Good। Context matters! Types of Final Goods: 1. Consumer Goods (उपभोक्ता वस्तुएं) Individuals द्वारा personal consumption के लिए use। Consumer Non-Durables: Immediately consume होती हैं। Examples: Food, Drinks, Milk। Consumer Durables: Long time चलती हैं। Examples: TV, Fridge, AC, Car। 2. Capital Goods (पूंजी वस्तुएं) Businesses द्वारा other goods produce करने के लिए use — खुद consume नहीं होती। Examples: Factory machines, Industrial equipment, Computers in offices। Example: T-shirt बनाने वाली machine = Capital Good। 📦 Inventory (माल-सूची) Business द्वारा stock में रखी गई items — raw materials, work-in-progress, और finished goods। Sales बढ़े → Inventory decumulates (घटती है)। Sales घटे → Inventory accumulates (बढ़ती है)। यह planned या unplanned दोनों हो सकती है। Diwali से पहले Haldiram ने ₹50 crore की sweets stock की (Inventory accumulate)। Diwali पर सब sell हो गया (Inventory decumulate)। अगर expected से कम बिकी — unplanned inventory। ⚖️ 7. Stock vs Flow Variables 📦 Stock Variable एक specific point in time पर measure होने वाली quantity। Examples: Wealth, Loan, Inventory, Capital, Money Supply 🌊 Flow Variable एक period of time में measure होने वाली quantity। Examples: Income, Expenditure, Change in Inventory, Depreciation आपके bank account में आज ₹1 lakh है = Stock (point in time)। आपकी monthly salary ₹50,000 है = Flow (per month)। Dam में पानी का level = Stock। Dam में पानी का flow rate = Flow। GDP = Flow variable (एक year की period में measure)। Capital = Stock variable। यह distinction exam में आता है। 📊 8. Aggregates of National Income (GDP, GNP, NDP, NNP) GDP developed by: Russian-American economist Simon Kuznets in 1934। 🌍 GDP — Gross Domestic Product (सकल घरेलू उत्पाद) किसी country की territorial boundary के अंदर produce किए गए सभी final goods और services का total value — चाहे produce करने वाले कोई भी हों (Indian या Foreign)। Key: DOMESTIC = Geography based। Resident या non-resident — जो भी India में produce करे। Key Exclusion: Second-hand goods count नहीं होती (Double Counting avoid करने के लिए)। Note: घर पर women का काम GDP में शामिल नहीं होता। GDP (MP) = C + G + I + (X − M) 🌐 GNP — Gross National Product (सकल राष्ट्रीय उत्पाद) किसी country के nationals (citizens) द्वारा produce किए गए goods और services का total value — चाहे वे देश के अंदर हों या बाहर । Key: NATIONAL = Citizens based। Indian in USA की income भी count होगी। GNP = GDP + Net Factor Income From Abroad (NFIA) GNP = GDP − Factor Income to Abroad + Factor Income From Abroad Indian software engineers जो USA में काम करते हैं और India पैसा भेजते हैं → वो GNP में आएगा। Samsung की India factory का production → GDP में आएगा लेकिन GNP में नहीं (क्योंकि Korean company है)। 📉 NDP — Net Domestic Product (शुद्ध घरेलू उत्पाद) GDP में से Depreciation (घिसाई) घटाने के बाद बचता है। Depreciation: Time के साथ capital goods (machines, buildings) की value कम होती है = Depreciation। यह wear and tear है। NDP = GDP − Depreciation 🌟 NNP — Net National Product (शुद्ध राष्ट्रीय उत्पाद) GNP में से Depreciation घटाने के बाद। NNP = GNP − Depreciation ⭐ National Income = NNP at Factor Cost (NNP FC ) यह India की true National Income है — Net (depreciation adjusted) + National (citizens) + Factor Cost (बिना taxes के)। All Formulas एक साथ: Formula Result GNP = GDP + NFIA National से Domestic तुलना NDP = GDP − Depreciation Net Domestic Output NNP = GNP − Depreciation Net National Output National Income = NNP FC True National Income 🏷️ 9. Market Price vs Factor Cost 🛒 Market Price (MP) Consumer जो price pay करता है = Net Indirect Taxes included । यह वो price है जो market में दिखती है। Example: आप AC के लिए ₹40,000 pay करते हैं — यह MP है। 🏭 Factor Cost (FC) Factors of Production की actual earning — Net Indirect Tax शामिल नहीं । Taxes distort नहीं करते actual production cost को। Factory को AC बनाने में जितना actually लगा = FC। FC = MP − Net Indirect Tax FC = MP − (Indirect Tax − Subsidy) Basic Price = FC + Net Production Tax *Net Production Tax = Production Tax − Subsidy Petrol pump पर ₹100/litre = Market Price (Tax included)। Government ने ₹40 tax लगाया है। Factor Cost = ₹100 − ₹40 = ₹60 (Refinery को actually मिला)। National Income = NNP FC — यानी Factor Cost पर। इसलिए taxes को remove करते हैं। 📈 10. Real GDP vs Nominal GDP Feature Real GDP Nominal GDP Price Basis Constant prices (Base Year की prices) Current prices (उस साल की prices) Reference Base year को reference लेते हैं Current year की prices use होती हैं Inflation ✅ Inflation adju"}, {"title": "Budget & Taxation Government budget and taxation.", "subject": "Economics", "url": "../economics/budget_taxation_notes.html", "text": "Budget & Taxation – Lecture 5 | Parmar SSC 📋 Budget & Taxation Complete Detailed Notes — Lecture 5 | Parmar SSC SSC Exam Preparation 📄 1. Union Budget — Fundamentals & Constitutional Framework 📌 Definition Budget = एक specific period (Financial Year: April 1 – March 31) में government की expected Revenue (Receipts) और Expenditure का अनुमान । ⚖️ Constitutional Reference — Article 112 Constitution में \"Budget\" शब्द कहीं नहीं है — यह Article 112 में \"Annual Financial Statement (AFS)\" कहलाता है। Mandate: President shall cause the AFS to be laid before both Houses of Parliament । Presentation: President के नाम से laid होता है — लेकिन present करते हैं Finance Minister । Prepared By: Department of Economic Affairs — Ministry of Finance । 🍬 Halwa Ceremony (हलवा समारोह) Budget documents की printing शुरू होने से पहले एक customary ritual। Budget printing में involved सभी officials को \"quarantine\" (isolation) में रखा जाता है — secrecy बनाए रखने के लिए — जब तक Budget Parliament में present न हो जाए। जैसे आप महीने की शुरुआत में plan करते हैं — \"इस महीने ₹30,000 income होगी, ₹20,000 खर्च होगी\" — यही Budget है। India का Union Budget पूरे देश के लिए ऐसा ही annual plan है। 📜 2. Budget — Historical Facts & Trivia Category Details 🥇 First Budget Presented by R.K. Shanmukham Chetty — First Finance Minister of Independent India 🥈 Second Budget Presented by John Mathai — who was also the first Railway Minister 📊 Maximum Budgets Morarji Desai — record holder with 10 Budgets (as Finance Minister) Notable FMs P. Chidambaram — 9 times। Pranab Mukherjee — 8 times Current FM Nirmala Sitharaman — 9 times (consecutive), equaling Chidambaram's record। First full-time female Finance Minister। (Note: Indira Gandhi held it temporarily as PM) Gender Budget Introduced in 2005-06 । Women/female welfare के लिए separate fund allocation Presentation Date Change 2017 से Feb end से February 1st पर shift किया — ताकि Financial Year (April 1) शुरू होने तक funds available हों 🗓️ Budget on Sunday First time in India's history — Union Budget presented on a Sunday, 1 February 2026 Morarji Desai = Maximum 10 budgets। Nirmala Sitharaman = First full-time female FM। First Budget = R.K. Shanmukham Chetty। ये तीनों बहुत आते हैं exam में। 🚂 3. Railway Budget Evolution + Vote on Account + Economic Survey 🚂 Evolution of Railway Budget Separation (1921): Railway Budget को General Budget से अलग किया — Acworth Committee की recommendations पर। Merger (2016): Railway Budget को General Budget में वापस merge किया — Bibek Debroy Committee की recommendations पर। First Merged Budget: FY 2017-18 के लिए present किया गया। 🗳️ Vote on Account — Article 116 यह एक advance grant है जो Government को full Budget pass होने से पहले Consolidated Fund of India से essential expenses (salaries, pensions) withdraw करने की permission देता है। Duration: Usually 2 months (1/6th of the annual budget)। Scope: Expenditure cover करता है only। Taxes alter नहीं कर सकता, new schemes introduce नहीं कर सकता। Relevance: 2017 से (जब Budget Feb 1 हो गया)। 📊 Economic Survey (आर्थिक सर्वेक्षण) India की economic performance का \"Report Card\" — पिछले financial year का analysis और future trends। Timing: Union Budget से 1-2 days पहले Parliament में present होता है। Prepared By: Department of Economic Affairs — Chief Economic Advisor (CEA) की guidance में। Current CEA: V. Anantha Nageswaran। Acworth Committee = Railway Budget separation 1921। Bibek Debroy Committee = Railway Budget merger 2016। Vote on Account = Article 116। ⚙️ 4. Functions of Budget (बजट के कार्य) 📦 Allocation Function Resources को public goods और private goods के बीच divide करना। Decide करना — कौन से social services और infrastructure projects fund होंगे। Example: Hospitals, Roads, Schools के लिए budget allocate करना। ⚖️ Redistribution Function Income inequality कम करना। Method: Progressive taxation (ज़्यादा income → ज़्यादा tax) + Social welfare programs (unemployment benefits, scholarships)। Example: Rich पर higher income tax + Poor को free ration। 📈 Stabilisation Function Economic stability बनाए रखना । Recession में: Spending बढ़ाओ → economy boost करो। Inflation में: Spending घटाओ → economy cool down करो। Example: COVID में stimulus package। 2020-21 COVID Budget — Government ने health, food, और rural schemes पर spending बढ़ाई (Stabilisation + Redistribution function)। PMGKAY — गरीबों को free ration — Redistribution function। 🏦 5. Asset, Liability, Revenue & Capital — Concepts 🏆 Asset (संपत्ति) Economic value वाला resource जो individual/company/country own या control करता है — future benefit की expectation से। Examples: Gold, Property, Land, Factory machinery 💳 Liability (देनदारी) किसी दूसरी party को debt या duty fulfill करने का obligation । Examples: Bank loan repayment, Bond payments, EMI Budget को 2 parts में divide करते हैं: 💰 Revenue — Regular Recurring Items Revenue Receipt: Regular income जो assets-liabilities change नहीं करती। Examples: Salary, Interest मिला, Tuition fees, Bonus Revenue Expenditure: Regular खर्च जो assets-liabilities change नहीं करता। Examples: Groceries, Gym fee, Interest/EMI दिया 🏗️ Capital — One-time/Long-term Items Capital Receipt: Asset कम करे या Liability बढ़ाए। Examples: Property बेचना (Asset↓), Loan लेना (Liability↑), Vehicle बेचना Capital Expenditure: Asset बढ़ाए या Liability कम करे। Examples: Gold/Property खरीदना (Asset↑), Loan चुकाना (Liability↓), Gift देना Revenue = Regular, Routine, Recurring। Capital = One-time, Long-term, creates/reduces assets/liabilities। यह distinction exam में बहुत आता है। 🏛️ 6. Government Budget Structure — Receipts & Expenditure Government Budget के 4 Main Components: 💚 Revenue Receipts (Revenue Budget) Asset × | Liability × (न asset बनता, न liability) 1. Tax Revenue: → Direct Tax: Income Tax, Corporate Tax → Indirect Tax: GST, Excise Duty, Customs 2. Non-Tax Revenue: → Interest (loans दिए पर), Dividend (PSU से), Fees/Fines 💙 Capital Receipts (Capital Budget) Asset ↓ | Liability ↑ (asset कम होता या liability बढ़ती) → Loan (Borrowing): Market से funds उधार लेना → Liability↑ → Disinvestment: Govt. PSU shares बेचना → Asset↓ Examples: Market borrowings, Small savings, RBI borrowing 🟠 Revenue Expenditure (Revenue Budget) Asset × | Liability × Regular day-to-day government expenses। → Salary (govt. employees की) → Pension → Interest payments (loans पर) → Grants (States को, other governments को) → Subsidies, Welfare schemes running costs 💜 Capital Expenditure (Capital Budget) Asset ↑ | Liability ↓ Long-term asset creation या liability reduction। → Development: Hospitals, Schools, Highways → Loan Given: States, Govt. companies को → Loan Repayment: Earlier borrowings चुकाना 🔢 Order of Expenditure in Government Budget (Largest to Smallest) Interest Payment > Central Sector Schemes > Subsidies > Pension 2026-27 Budget में: Interest Payment ~20% → Central Sector Schemes ~17% → Subsidies ~6% → Pension ~2% of expenditure। 💰 \"Rupee Comes From\" (Revenue Sources 2026-27): ₹ Rupee कहाँ से आता है Borrowings & Liabilities 24% Income Tax 21% Corporation Tax 18% GST & other taxes 15% Non-Tax Revenues 10% Union Excise Duties 6% Customs 4% Non-Debt Capital 2% ₹ Rupee कहाँ जाता है Revenue Expenditure 41% Interest Payment 20% States Share of Taxes 22% Central Sector Scheme 17% Defence 11% Centrally Sponsored 8% Finance Commission 7% Major Subsidies 6% 💸 7. Taxation System in India (Direct vs Indirect Taxes) ✅ Direct Taxes (प्रत्यक्ष कर) Government को directly pay किए जाते हैं। दूसरे person को transfer नहीं हो सकते। Nature: Progressive — Income बढ़ने पर tax rate बढ़ता है। Examples: Income Tax Corporate Tax (Companies पर) Capital Gains Tax Wealth Tax (abolished) Gift Tax 🔄 Indirect Taxes (अप्रत्यक्ष कर) Government को indirectly pay होते हैं (seller के through)। दूसरे person को transfer हो सकते हैं। Nature: Regressive/Proportional — income के हिसाब से नहीं बदलता। Examples: GST Excise Duty Customs Duty Tax on petrol, diesel, aviation turbine fuel Petrol/Diesel outside GST: Centre levies Central Excise। States levy VAT/Sales Tax। Alcohol (human consumption) outside GST: No Central Excise। States levy State Excise + VAT/Sales Tax + Licence fees। Income Tax = Direct Tax — आप directly IT Department को pay करते हैं। GST = Indirect Tax — आप shopkeeper को ₹118 pay करते हैं, shopkeeper government को ₹18 जमा करता है। आप directly नहीं दे रहे। Direct Tax = Progressive + Non-transferable। Indirect Tax = Regressive + Transferable। यह distinction exam में fixed है। 🛒 8. Goods and Services Tax (GST) — Complete Notes 📌 GST क्या है? GST एक Destination-based Consumption Tax है — जहाँ goods/services consume होती है वहाँ tax लगता है। Cascading Effect को हटाया: पहले \"Tax on Tax\" लगता था हर production stage पर — GST ने यह समाप्त किया। 📋 Key Facts about GST Introduced through: 101st Constitutional Amendment Act Came into force: 1 July 2017 First State to ratify GST Bill: Assam Constitutional body: GST Council — Article 279A GST Council Members: 33 members (2 from Centre + 31 from States) Chairperson: Union Finance Minister 🌊 Cascading Effect (कर पर कर) — GST ने इसे खत्म किया पहले हर production stage पर previous stage के tax के ऊपर भी tax लगता था = \"Tax on Tax\" = Cascading Effect। GST से पहले: Cotton पर tax लगा → Yarn बनाई, Yarn पर tax + पहले वाला tax → Cloth बनी, फिर tax on tax on tax। GST के बाद: Input Tax Credit — पिछले stage का tax claim हो जाता है। Overall price कम। 101st Amendment = GST। 1 July 2017 = GST launch। Assam = First to ratify। Article 279A = GST Council। FM = Chairperson। ये सब exam में आते हैं। 🔖 9. Other Important Taxes (Surcharge, Cess, Pigouvian, Paper Tax) 📌 Surcharge (अधिभार) एक additional tax — specified income limit से ऊपर की income वाले लोगों पर। यह Article 271 के under levied है और States के साथ share नहीं होता । Income ₹1 crore से ज़्यादा होने पर extra 15% surcharge — यह extra tax है normal income tax के ऊपर। 🎯 Cess (उपकर) एक specific purpose के लिए levy किया गया tax। Central Government collect करती है — States के साथ share नहीं होता । Education Cess (education के लिए), Swachh Bharat Cess, Health & Education Cess — ये सब Cess हैं। 🌿 Pigouvian Tax (पिगोवियन कर) उन activities पर tax जो negative externalities (harmful effects on society) create करती हैं — harmful effects को reduce करने के लिए। Pollution फैलाने वाली factories पर tax। Cigarettes/alcohol पर sin tax। Carbon tax। — ये सब Pigouvian taxes हैं। 📄 Paper Taxes (Nominal/Symbolic Tax) वो taxes जो सिर्फ paper पर exist करते हैं — revenue collection में significant contribution नहीं। Other names: Nominal Tax, Symbolic Tax Examples: Wealth Tax, Gift Tax, Estate Duty (अब abolished)। Surcharge = Additional tax on high income, not shared with states। Cess = Specific purpose tax, not shared with states। Pigouvian = Negative externalities पर tax। 📊 10. Types of Budget (3 Types) ⚖️ 1. Balanced Budget Total Revenue = Total Expenditure Income = Spending Ideal in theory, rare in practice 📈 2. Surplus Budget Total Revenue > Total Expenditure Income > Spending Government के पास extra पैसा है 📉 3. Deficit Budget Total Expenditure > Total Revenue Spending > Income India का हर budget typically यही है India almost हर साल Deficit Budget present करता है — Government ज़्यादा खर्च करती है development के लिए। इस gap को borrowings से fill किया जाता है। India mostly Deficit Budget — Developing economies की यह common feature है। 📉 11. Types of Deficit (5 प्रकार) — सबसे Important Topic 1. Budget Deficit (बजट घाटा) Total Expenditure और Total Receipts (सभी receipts) का फर्क। Budget Deficit = Total Expenditure − Total Receipts 2. Revenue Deficit (राजस्व घाटा) Government की Revenue Expenditure Revenue Receipts से ज़्यादा है। यह दिखाता है कि government अपने regular खर्च के लिए भी पर्याप्त revenue नहीं generate कर रही। Revenue Deficit = Revenue Expenditure − Revenue Receipts Govt. की salary, pension, interest payments = ₹40 lakh crore। Tax + non-tax income = ₹35 lakh crore → Revenue Deficit = ₹5 lakh crore। 3. Fiscal Deficit (राजकोषीय घाटा) — Most Important! Total expenditure और Total receipts excluding borrowings का फर्क। यह बताता है कि Government को"}, {"title": "Monetary Policy Policy tools and monetary concepts.", "subject": "Economics", "url": "../economics/monetary_policy_notes.html", "text": "Monetary Policy – Lecture 6 | Parmar SSC 🏦 Monetary Policy Complete Detailed Notes — Lecture 6 | Parmar SSC SSC Exam Preparation 🏦 1. Basics of Banking & Balance Sheet 📌 Primary Function of Banks Banks की primary function: Public से Deposits accept करना और Borrowers को Loans provide करना । The Spread (Bank का Profit): Loan पर लिया गया interest rate (9%) − Depositors को दिया गया interest rate (7%) = 2% = Bank का profit । 📊 Balance Sheet — Assets Loans = ASSET Bank ने यह पैसा लोगों को दिया है — यह bank के लिए काम करता है, interest generate करता है। Bank इसे \"own\" करता है जब तक repaid न हो। 📊 Balance Sheet — Liabilities Deposits = LIABILITY यह पैसा bank ने public से लिया है — on demand या maturity पर वापस करना होगा। Bank इसे \"owe\" करता है। Types of Deposits (NDTL का हिस्सा): 1. Demand Deposits (Demand Liabilities) कभी भी withdraw हो सकते हैं — On Demand। Examples: → Savings Account (interest मिलता है) → Current Account (business use, usually 0% interest) 2. Time Deposits (Time Liabilities / Term Deposits) Fixed tenure के लिए locked। Early withdrawal पर penalty। Examples: → Fixed Deposits (FD) → Recurring Deposits (RD) Banks prefer Time Deposits — funds stable रहते हैं। 📌 NDTL — Net Demand and Time Liabilities Bank के total deposits = NDTL — Demand Deposits + Time Deposits। NDTL = RBI के लिए reserve requirements calculate करने का base । NDTL से decide होता है कि bank को कितना CRR और SLR maintain करना है। SBI के पास ₹100 lakh crore deposits हैं (NDTL)। इसका 4% (~₹4 lakh crore) CRR के रूप में RBI के पास रखना होगा। 18% (~₹18 lakh crore) SLR के रूप में खुद के पास रखना होगा। बाकी lending के लिए। 🔒 2. Reserves Maintained by Banks — CRR vs SLR Purpose: RBI banks को NDTL का एक हिस्सा reserve में रखवाता है — emergency में sufficient cash हो, depositors का पैसा safe रहे। 💰 CRR — Cash Reserve Ratio Definition: Bank के NDTL का वह specific percentage जो RBI के पास रखना होता है । Form: Cash ONLY — कोई और form नहीं। Interest: ❌ No Interest — Banks को CRR पर कोई return नहीं मिलता। Purpose: Liquidity ensure करना, depositors के पैसे की safety। Current Trend: ~4% (variable — RBI decide करती है)। Floor Limit Removed: RBI amendment ने CRR का floor limit हटाया — RBI अब इसे previous statutory limits से नीचे भी ले जा सकती है। 🏛️ SLR — Statutory Liquidity Ratio Definition: NDTL का वह percentage जो bank को खुद के पास (own vault में) maintain करना होता है । Form: Cash, Gold, या Government Securities (G-Secs) — तीनों में से कोई भी। Interest: ✅ Earns Interest — G-Secs component पर interest मिलता है। Current Trend: ~18% (variable)। 1991 Narasimham Committee: SLR जैसी statutory requirements घटाने की recommendation — ताकि banks को Government Securities में बड़ी amount lock नहीं करनी पड़े। लेकिन banks safety, liquidity और stable returns के लिए G-Secs hold करना continue करती हैं। 📊 CRR vs SLR — Quick Comparison: Feature CRR SLR Feature CRR SLR Kept Where With RBI With Bank itself Form Cash Only Cash, Gold, G-Secs Interest ❌ No Interest ✅ Earns Interest (on G-Secs) Current Rate ~4% ~18% Purpose Liquidity & depositor safety Solvency & forced investment in G-Secs ⚠️ Penalties for Non-Maintenance — RBI Act 1934, Section 42(3) First Default: Bank Rate + 3% penalty Subsequent Default: Bank Rate + 5% penalty CRR = RBI के पास, Cash Only, No Interest। SLR = Bank के पास, Cash/Gold/G-Sec, Earns Interest। यह distinction exam में हर बार आती है। 📋 3. Monetary Policy — Definition & Overview 📌 Definition Monetary Policy = RBI द्वारा money supply और interest rates को regulate करने की process — ताकि price stability maintain हो, inflation control हो, और economic growth ensure हो। 🔴 Monetary Policy — RBI करती है RBI interest rates और money supply control करती है। Tools: CRR, SLR, Repo Rate, OMO, etc. Central Bank की policy 🟡 Fiscal Policy — Government करती है Government taxes, spending और borrowing adjust करती है। Tools: Tax rates, Subsidies, MSP, Government expenditure Ministry of Finance की policy Key Rule: Monetary Policy = RBI। Fiscal Policy = Government। दोनों confuse नहीं करना! 📦 Quantitative Tools Economy में money की volume/quantity control करते हैं। CRR — Cash Reserve Ratio SLR — Statutory Liquidity Ratio Bank Rate Repo Rate / Reverse Repo OMO (Open Market Operations) MSF (Marginal Standing Facility) 🎯 Qualitative Tools Credit की direction और use control करते हैं — specific sectors को target। Changing Margin Requirements Consumer Credit Regulation Moral Suasion Credit Rationing 🔧 4. Quantitative Monetary Policy Tools — सभी Rates 1. CRR और 2. SLR — ऊपर Section 2 में विस्तार से cover किया गया है। 3. 🏦 Bank Rate (बैंक दर) Definition: वह interest rate जिस पर RBI commercial banks को Long-Term के लिए loans देती है । Usage: Long-term lending — banks और government को। Collateral: ❌ No Collateral required (security देने की ज़रूरत नहीं)। Effect: Bank Rate बढ़ाने से borrowing costly → money supply घटती है। 📌 Collateral क्या है? Collateral = वह valuable चीज़ जो borrower loan guarantee के रूप में देता है। अगर repay नहीं हुआ तो lender वो ले लेता है। (Example: Home loan में property ही collateral होती है।) 4. 🔄 Open Market Operations (OMO) — Sterilization भी कहते हैं Definition: RBI द्वारा open market में Government Securities (G-Secs) buying और selling करना। Purpose: Economy में money supply control करना। RBI G-Secs खरीदे → Money Supply ↑ RBI market से G-Secs buy करती है → Banks को cash मिलता है → Banks ज़्यादा lend कर सकती हैं → Money supply बढ़ती है। (Expansionary — Deflation में) RBI G-Secs बेचे → Money Supply ↓ RBI market में G-Secs sell करती है → Banks का cash RBI को जाता है → Banks कम lend करती हैं → Money supply घटती है। (Contractionary — Inflation में) OMO के दो Types: Outright Purchase: RBI directly G-Secs buy/sell करती है — कोई repurchase agreement नहीं। Repurchase Obligation (Repo): Banks G-Secs collateral देकर RBI से money borrow करती हैं — बाद में repurchase का promise। Reverse Repo = Banks extra funds RBI में deposit करती हैं G-Secs के बदले। 5. 🚨 Marginal Standing Facility (MSF) — Emergency Lending Definition: Emergency lending facility — जब banks को acute (अचानक) funds की shortage होती है। Introduced: 2011-12 में। Rate: Repo Rate + 1% (100 basis points higher) — यह penal rate है। Duration: Overnight loans। Collateral: ✅ Required — G-Secs (SLR quota से भी use कर सकते हैं)। Last Resort: Extreme situations में ही use होता है। Eligible: Only Scheduled Commercial Banks । Borrowing Limit: Generally 1–2% of NDTL । किसी bank को अचानक एक रात में बहुत सारा withdrawal मिला और cash कम पड़ गई → वो MSF use करेगी — RBI से overnight emergency funds लेगी, Repo Rate से 1% ज़्यादा pay करके। 6. 📊 Repo Rate & Reverse Repo Rate Repo Rate: जिस rate पर Banks RBI से short-term borrow करती हैं — G-Secs collateral देकर। Repo ↑ → Borrowing costly → Money supply ↓ (Contractionary) Repo ↓ → Borrowing cheap → Money supply ↑ (Expansionary) Most important policy rate — MPC decide करती है। Reverse Repo Rate: जिस rate पर Banks अपना surplus fund RBI के पास park करती हैं। 2022-23 से LAF framework में Reverse Repo को SDF (Standing Deposit Facility) ने replace किया। Reverse Repo ↑ → Banks ज़्यादा RBI में park करती हैं → Market में money कम 🔄 Liquidity Adjustment Facility (LAF) RBI का framework जिससे banking system में short-term liquidity manage होती है। Earlier: Repo + Reverse Repo = LAF। 2022-23 से: Reverse Repo को SDF (Standing Deposit Facility) ने replace किया — जो अब interest rate corridor का Floor है। SDF: Banks बिना collateral दिए surplus funds RBI के पास park कर सकती हैं। यह liquidity absorption tool है। Legal Provision: Union Budget 2018-19 में introduce हुआ। Operationalised: RBI ने 2022 में। 📊 Interest Rate Corridor (ब्याज दर गलियारा): RBI का Interest Rate Corridor MSF Rate = Repo Rate + 1% → CEILING (ऊपरी सीमा) — Emergency borrowing की maximum cost Repo Rate = Policy Rate (MPC decide करती है) → MIDDLE — Main benchmark rate SDF Rate = Repo Rate − 0.25% → FLOOR (निचली सीमा) — Banks का surplus parking rate MSF = Ceiling। Repo = Middle। SDF = Floor। 2022 से Reverse Repo की जगह SDF है। यह corridor concept exam में आता है। 🏛️ 5. Monetary Policy Committee (MPC) 📌 Overview MPC वह committee है जो Repo Rate और अन्य policy rates decide करती है — inflation को 4% (±2%) पर target रखने के लिए। 📋 Key Facts Established: 2016 Basis: Urjit Patel Committee recommendations Members: 6 total → 3 from RBI (Governor, Deputy Governor, Executive Director) → 3 appointed by Government of India Chairperson: RBI Governor ⚙️ Functioning Function: Policy rates (Repo, etc.) decide करना — inflation control के लिए Meeting Frequency: Bi-monthly (हर 2 महीने में) Casting Vote: Tie होने पर RBI Governor का vote deciding होता है Inflation Target: CPI = 4% ±2% 2022-23 में India में inflation 7%+ हो गई थी → MPC ने Repo Rate बढ़ाई (4% से 6.5% तक) → Loans costly हुए → Spending कम हुई → Inflation control हुई। यही MPC का काम है। MPC = 2016, Urjit Patel Committee recommendations। 6 members (3 RBI + 3 Govt)। Chairperson = RBI Governor। Bi-monthly meetings। 📞 6. Base Rate, Call Money & Money Market 📌 Base Rate वह minimum rate जिससे नीचे banks loans नहीं दे सकती — except RBI द्वारा specified cases में। यह banks का floor lending rate है। 🤝 Interbank Lending Market Banks आपस में short-term funds borrow/lend करती हैं — liquidity और regulatory requirements manage करने के लिए। 📞 Call Money Rate Banks के बीच overnight (1 day से कम) loans पर लगने वाला interest rate। Duration: 1 day (Less than a day / Overnight)। How decided: RRR (Reverse Repo Rate) और MSF (Marginal Standing Facility) के basis पर। Money Market Durations: Market Duration Participants Call Money Market 1 day (Overnight) Banks & Financial Institutions Notice Money Market 2 to 14 days Banks & Financial Institutions Term Money Market 15 days to 1 year Banks SBI को रात में पता चला कि उसकी CRR requirement short है। उसने HDFC Bank से Call Money लिया — 1 day के लिए overnight। यह Call Money Market है। ✖️ 7. Money Multiplier (मुद्रा गुणक) 📌 Definition Money Multiplier = वह highest possible extent जितना money supply bank deposits में changes से बढ़ सकती है। Money Multiplier = 1 ÷ CRR 📊 CRR और Money Multiplier का Relationship CRR बढ़ाओ → Banks ज़्यादा reserve रखें → Lend कम करें → Fewer loans → Less money creation → Money Multiplier घटता है । CRR घटाओ → Banks कम reserve रखें → Lend ज़्यादा करें → More money creation → Money Multiplier बढ़ता है । CRR = 4% = 0.04। Money Multiplier = 1/0.04 = 25। यानी ₹100 base money से economy में ₹2500 तक money supply create हो सकती है! CRR घटाने से यह multiplier और बड़ा होता है। NBFC (Non-Banking Financial Companies) और NBFC-MFI (Microfinance Institutions) को CRR और SLR maintain करने की ज़रूरत नहीं होती! Money Multiplier = 1/CRR। CRR ↑ → MM ↓। CRR ↓ → MM ↑। NBFC को CRR/SLR नहीं। 🔁 8. Monetary Policy Stance — Hawkish vs Dovish 🦅 Contractionary / Tight / Dear / Hawkish Policy When: During Inflation RBI Action: CRR ↑, SLR ↑, Bank Rate ↑, RRR ↑, Repo Rate ↑ Effect: Money Supply ↓ → Credit costly → Spending कम → Demand कम → Inflation control 🦅 Hawk = Aggressive — inflation fight करता है! 🕊️ Expansionary / Easy / Dovish Policy When: During Deflation / Recession RBI Action: CRR ↓, SLR ↓, Bank Rate ↓, RRR ↓, Repo Rate ↓ Effect: Money Supply ↑ → Credit cheap → Spending बढ़ी → Demand बढ़ी → Economy stimulate 🕊️ Dove = Gentle — growth support करता है! Situation RBI Action Effect Policy Name 📈 During Inflation CRR, SLR, BR, RRR, RR बढ़ाओ Money Supply ↓ Contractionary / Tight / Dear / Hawkish 📉 During Deflation CRR, SLR, BR, RRR, RR घटाओ Money Supply ↑ Expansionary / Easy / Dovish 2022-23 India: High inflation (~7%) → RBI Hawkish → Repo Rate 4% से 6.5% किया → Loans costly → EMIs बढ़ीं → लोगों ने कम खर्च किया → Inflation धीरे-धीरे ~5% पर आई। Hawk = Inflation fight = Rates बढ़ाना। Dove = Growth support = Rates घटाना। यह terminology exam में बहुत आती है। 🎯 9. Qualitative Monetary Policy Tools Definition: Qualitative tools = Selective tools — money की quantity नहीं, बल्कि credit की direction और use को specific sectors में control करते हैं। 1. Changing Margin Requirements (Margin बदलना) Margin = वह amount जो borrower को loan से पहले "}, {"title": "Banking System — Part 1 Banking fundamentals and exam concepts.", "subject": "Economics", "url": "../economics/banking_system_part1_notes.html", "text": "Banking System Part 1 – Lecture 7 | Parmar SSC 🏦 Banking System (Part 1) Complete Detailed Notes — Lecture 7 | Parmar SSC SSC Exam Preparation 🏛️ 1. Reserve Bank of India (RBI) — Introduction & History 📌 What is Banking? Banking = एक financial activity जिसमें individuals, businesses और governments को money manage करने और financial services provide करने का काम होता है। Core Activities: Deposits accept करना + Loans देना + Transactions facilitate करना। 🏦 RBI — \"Father of All Banks\" RBI = India का Central Bank । यह पूरे banking system को manage, control और regulate करती है। इसीलिए इसे \"Father of All Banks\" या \"Bank of Banks\" कहते हैं। 📅 RBI का Timeline: 1926 Hilton Young Commission ने RBI establish करने की recommendation दी। 1934 Reserve Bank of India Act, 1934 pass हुआ — RBI officially established। 1935 Operations शुरू हुई — 1st April 1935, Calcutta में। 1937 Headquarters Calcutta से Mumbai permanently move किया गया। 1949 RBI Nationalized on 1st January 1949 — Reserve Bank of India (Transfer to Public Ownership) Act, 1948 के तहत। Government ने private players से full ownership ले ली। 👑 Key Leadership & Symbols First Governor: Sir Osborne Smith First Indian Governor: Sir C.D. Deshmukh Current Governor (2026): Sanjay Malhotra Logo: Tiger and a Palm Tree 🐯🌴 RBI वही है जो commercial banks (SBI, HDFC, etc.) को regulate करती है — जैसे CBSE schools को regulate करती है। आम आदमी directly RBI से deal नहीं करता — हम banks से deal करते हैं, banks RBI से। Hilton Young Commission 1926 → RBI Act 1934 → Operations 1 April 1935 → HQ Mumbai 1937 → Nationalized 1 Jan 1949। यह sequence बहुत important है। ⚙️ 2. Functions of RBI 1️⃣ Regulator of Banks — \"Bank of Banks\" Authority: Banking Regulation Act, 1949 के तहत banking system regulate करती है। Banking companies को licenses grant करती है। CRR और SLR regulate करती है। Banks specific criteria meet करें तभी operate करें — यह ensure करती है। Scheduled Banks: वो banks जो RBI Act, 1934 की Second Schedule में listed हैं। 2️⃣ Monetary Authority Inflation control करने, money supply manage करने और credit flow ensure करने के लिए monetary policy formulate और implement करती है। Tools: Repo Rate, CRR, SLR, OMO, etc. 3️⃣ Currency Printing & Management RBI India में currency print और manage करती है। ⚠️ Exception: ₹1 note और सभी Coins = Ministry of Finance (Government of India) issue करती है — RBI नहीं। 🖨️ Note Printing Press (4 Locations): Nasik (Maharashtra) Dewas (Madhya Pradesh) Mysore (Karnataka) Salboni (West Bengal) 🪙 Coin Minting (4 Locations): Mumbai Hyderabad Kolkata (Calcutta) Noida 🔍 Coin पर Mint कहाँ था — कैसे पहचानें? Coin पर साल के नीचे छोटा mark देखें: 💎 Diamond Mumbai में Minted ⭐ Star Hyderabad में Minted — No Mark Kolkata में Minted ● Dot Noida में Minted 4️⃣ Publication of Reports Financial Stability Report (FSR): Biannual (June और December — साल में 2 बार)। Purpose: Financial system के risks assess करना। Handbook of Statistics on the Indian Economy: Annually (साल में 1 बार)। Purpose: Indian economy के comprehensive data और statistics। 5️⃣ Lender of Last Resort (अंतिम ऋणदाता) Financial crisis में जब commercial banks कहीं से loan नहीं पा सकतीं, तो RBI last resort के रूप में funding provide करती है। Public (individuals) directly RBI से account open नहीं कर सकता, और न directly borrow कर सकता है। हम Banks से deal करते हैं — Banks RBI से deal करती हैं। 📄 Clean Note Policy — 1999 Introduction: RBI ने 1999 में introduce किया। Objective: Banks soiled (गंदे), torn (फटे) या scribbled (लिखे हुए) notes customers को pass नहीं करेंगी — इन्हें RBI को वापस deposit करना होगा। Legal Basis: Section 35A of the Banking Regulation Act, 1949। ₹1 Note + सभी Coins = Ministry of Finance। बाकी सभी Notes = RBI। Clean Note Policy 1999। FSR = Biannual (June+Dec)। 🗂️ 3. Classification of Banking System in India (RBI Act 1934) ✅ Scheduled Banks RBI Act, 1934 की Second Schedule में listed। CRR maintain करना mandatory। RBI की facilities (Repo Rate, etc.) use कर सकती हैं। Types: → Commercial Banks (Profit Motive) → Cooperative Banks (Service Motive) → Local Area Banks ❌ Non-Scheduled Banks Second Schedule में listed नहीं। Small/local banks जो RBI की criteria meet नहीं करतीं। ये बहुत rare हैं। Commercial Banks (Profit Motive) के 4 Types: Type Ownership Examples Public Sector Banks Govt. owned (majority stake) SBI, PNB, BOB (12 total) Private Sector Banks Indian owned, private HDFC, ICICI, Axis, Kotak Mahindra Foreign Banks Foreign owned Citi Bank, HSBC, Standard Chartered Regional Rural Banks (RRBs) Jointly owned (Govt+Bank+State) Prathama Bank Cooperative Banks (Service Motive) के 2 Types: Urban Cooperative Banks Urban areas में — service motive + some profit Rural Cooperative Banks Rural areas में — farmers, rural workers 12 Public Sector Banks हैं currently। SBI India की largest bank है। Cooperative Banks का motive = Service (profit नहीं)। 📜 4. Evolution & History of Indian Banking India की banking history colonial era से आज तक — \"Class Banking\" से \"Mass Banking\" का सफर। 🥇 First Banks of India First Bank in India: Bank of Hindustan — 1770, Calcutta में। First Indian-Owned Bank: Allahabad Bank — 1865। 🏦 SBI की Journey — Presidency Banks से State Bank तक: Year Event Details 1806 Bank of Calcutta First Presidency Bank (British established) 1840 Bank of Bombay Second Presidency Bank 1843 Bank of Madras Third Presidency Bank 1921 Imperial Bank of India तीनों Presidency Banks merge होकर एक entity बनी 1955 State Bank of India (SBI) Imperial Bank nationalized और renamed — national development के लिए 3 Presidency Banks → 1921 Imperial Bank → 1955 SBI। यह sequence बहुत important है। 🏛️ 5. Nationalization of Banks (1969 & 1980) 📌 Why Nationalization? Commercial banks cities और trade hubs (Gujarat, Maharashtra) में concentrate थीं — \"Class Banking\" । Rural areas और गरीब लोगों तक banking नहीं पहुँच रही थी। Government ने private banks का ownership लेकर rural areas तक banking पहुँचाने के लिए nationalization की — \"Mass Banking\" की तरफ। 🔴 Phase I — 1969 PM: Indira Gandhi Action: 14 Major Banks nationalized Criteria: ₹50 Crore से ज़्यादा deposits Legislation: Banking Companies (Acquisition and Transfer of Undertakings) Act, 1969 🟠 Phase II — 1980 PM: Indira Gandhi Action: 6 Additional Banks nationalized Criteria: ₹200 Crore से ज़्यादा deposits 6 Banks: Andhra, Corporation, New Bank of India (PNB में merged 1993), OBC, Punjab & Sind, Vijaya Bank Nationalization vs. Consolidation (Merger) Nationalization: Government private banks की ownership ले लेती है। (1969, 1980) Consolidation (Merger): Multiple banks को merge करके fewer, larger, globally competitive banks बनाना। 🏦 Narasimham Committee — Banking Reforms 1991 Committee: CRR/SLR कम करने की recommendation। Mandatory government investment requirements हटाने की recommendation। 1998 Committee: Strong banks को merge करके \"Global Sized Banks\" create करने की recommendation। 2019-2021 में India ने 10 Public Sector Banks को merge करके 4 बड़े banks बनाए — यही Consolidation है। जैसे Vijaya Bank + Dena Bank → Bank of Baroda। Narasimham Committee 1998 की same recommendation थी। Phase I 1969 = 14 Banks, ₹50 Cr criteria। Phase II 1980 = 6 Banks, ₹200 Cr criteria। दोनों PM = Indira Gandhi। 💼 6. Functions of Commercial Banks 📦 A. Primary Functions 1. Accepting Deposits (Liability): Bank customer का पैसा owe करती है — Liability। → Demand Deposits: Savings, Current (anytime withdrawal) → Time Deposits: FD, RD (fixed tenure) 2. Advancing Loans (Asset): Loans interest generate करते हैं — Asset। 🛠️ B. Secondary Functions 1. Overdraft Facility: Account balance से ज़्यादा withdraw करने की permission। Credit score based short-term loan। 2. Agency Functions: → Fund Transfer → Tax Collection (Govt. की तरफ से) 3. General Utility Functions: → Locker Facility (stolen हो तो bank compensate करेगी) → Financial guarantees, info 🌾 7. Regional Rural Banks (RRBs) 📌 Purpose Commercial banks cities में थीं — rural areas, farmers, और weaker sections ignore होते थे। RRBs rural areas में credit और banking services provide करने के लिए बनाए गए। 📋 Establishment Facts First RRB: Pratham Grameen Bank Date: 2nd October 1975 (Gandhi Jayanti) Location: Moradabad, Uttar Pradesh Act: RRB Act, 1976 के तहत formally established Kelkar Committee: New RRBs खोलना बंद करने की recommendation दी — viability पर focus करने के लिए। 🏦 RRB Ownership Structure (50-35-15): Stakeholder Ownership Role Central Government 50% Largest stakeholder — govt. backing Sponsor Bank 35% Commercial Bank (SBI, HDFC) — technical & financial support State Government 15% State जहाँ RRB operate करती है 🔍 Regulation vs. Supervision Regulator: RBI (Reserve Bank of India) — guidelines और rules। Supervisor: NABARD — inspect और oversee करता है। First RRB = Pratham Grameen Bank। Date = 2 Oct 1975। Ownership = 50:35:15 (Centre:Sponsor Bank:State)। Regulator = RBI। Supervisor = NABARD। 🏦 8. Important Financial Institutions (IFIs) 🌾 NABARD — National Bank for Agriculture and Rural Development Established: 12 July 1982 Committee: B. Sivaraman Committee (1979) की recommendation पर। Act: NABARD Act, 1981 HQ: Mumbai Key Functions: Rural Credit: Agriculture और rural development को loans। Supervision: Cooperative Banks और RRBs को oversee करता है। Refinancing: Directly public को नहीं — Banks (RRBs) को funding देता है। Schemes: SHG-Bank Linkage Program (1992): Self Help Groups को banks से link करना। E-Shakti & LEDP (2015): SHGs का digitization। PMAY, KCC (Kisan Credit Cards), RuPay Kisan Cards facilitate करता है। 📊 Other Important Financial Institutions: Institution Year HQ Main Objective SEBI Securities & Exchange Board of India Est. 12 April 1988 Statutory status: SEBI Act 1992 Mumbai Tuhin Kanta Pandey Securities market में investors के interests protect करना SIDBI Small Industries Development Bank 2 April 1990 Lucknow Manoj Mittal MSMEs को financial और developmental assistance NHB National Housing Bank 1988 (Act of 1987) New Delhi Sanjay Shukla Housing finance sector को regulate और promote करना IRDAI Insurance Regulatory & Development Authority April 2000 (IRDAI Act 1999) Hyderabad Ajay Seth Insurance sector regulate करना + policyholders protect करना IDBI Industrial Development Bank of India 1964 (RBI subsidiary as origin) LIC ने 51% stake acquire किया Mumbai T.N. Manoharan (Chairman) Industries के development के लिए loans और financial facilities NAFED National Agricultural Cooperative Marketing Federation 2 October 1958 New Delhi Jethabhai Ahir Agricultural produce के लिए apex marketing cooperative organization SEBI = Stock market regulator, Mumbai। IRDAI = Insurance regulator, Hyderabad। NABARD = Rural banking supervisor, Mumbai। SIDBI = MSME finance, Lucknow। 🤝 9. Microfinance Institutions (MFIs), SHGs & JLGs 📌 Microfinance — क्या है? MFIs = Low-income population को micro-loans, credit, savings, insurance और remittances provide करती हैं। Eligibility: Annual income ₹3 lakh तक के households को बिना collateral loans। 📜 Important Facts Father of Microfinance: Muhammad Yunus — 2006 Nobel Peace Prize (Bangladesh Grameen Bank)। First MFI in India: SEWA Bank (Self Employed Women's Association) — 1974, Ahmedabad। 👩‍👩‍👧 Self Help Groups (SHG) Structure: 10-20 लोग — BPL (Below Poverty Line), rural areas Living conditions improve करने के लिए साथ आते हैं। Loans: Members को बिना collateral + low interest (informal sector / moneylenders से कम)। Impact: Women और marginalized groups को self-reliant बनाते हैं। 🤝 Joint Liability Groups (JLG) Structure: 4-10 लोग — bank loan लेने के लिए। Collateral-free Loan: Group मिलकर loan लेती है — बिना security। Target: Individuals, sharecroppers, tenant farmers, small & marginal farmers। Group members एक-दूसरे के loan के लिए jointly liable होते हैं। गाँव की 15 महिलाएं मिलकर SHG बनाती हैं। हर महीने ₹500 जोड़ती हैं। जिसे ज़रूरत हो उसे group से loan मिलता है — bank से नहीं। NABARD इन्हें banks से link करता है (SHG-Bank Linkage Program)। SHG = 10-20 members, BPL। JLG = 4-10 members, farmers। SEWA = First MFI India 1974। Muhammad Yunus = Father of Microfinance, Nobel 2006। 🏢 10. Non-Banking Financial Companies (NBFCs) 📌"}, {"title": "Banking System — Part 2 Advanced banking concepts and facts.", "subject": "Economics", "url": "../economics/banking_system_part2_notes.html", "text": "Banking System Part 2 – Lecture 8 | Parmar SSC 💰 Banking System (Part 2) Complete Detailed Notes — Lecture 8 | Parmar SSC SSC Exam Preparation 💧 1. Liquidity (तरलता) 📌 Definition Liquidity = एक asset को बिना value खोए cash में convert करने की ease और speed । Cash: Highest liquidity — already cash है, कोई conversion नहीं। 🥇 Gold vs. Bike — Liquidity Comparison Gold: ज़्यादा liquid — High acceptability। Jeweller के पास जाओ, immediately cash मिलेगी। Bike: कम liquid — Buyer ढूंढना पड़ेगा, value loss हो सकती है (distress sale)। 📊 Liquidity Order (Highest → Lowest): 💵 Cash > 🥇 Gold > 📄 Cheque > 📜 Bond Demand Deposit (Savings/Current Account) is more liquid than Term Deposit (Fixed Deposit) — क्योंकि Demand Deposit anytime withdraw हो सकती है। Demonetization (Nov 2016) के बाद लोगों के पास पुराने notes थे — वो useless हो गए। Banks में lines लगीं। Cash की liquidity instantly disappear हो सकती है — यह crisis था। Liquidity Order = Cash > Gold > Cheque > Bond। Demand Deposit > Term Deposit। यह sequence exam में आता है। 🔄 2. Evolution of Money — Barter System & Its Limitations 📌 Barter System (वस्तु-विनिमय प्रणाली) Historical Context: Harappan Civilization में कोई standardized currency नहीं थी — economy Barter System पर चलती थी। Definition: Goods for Goods exchange करना। तुम्हारे पास जो मुझे चाहिए, मेरे पास जो तुम्हें चाहिए — directly exchange। ⚠️ Limitations of Barter System: Limitation Explanation Example Double Coincidence of Wants Transaction तभी होगी जब दोनों parties exactly वही चाहें जो दूसरे के पास है — same time पर Person A के पास Fish है, Person B के पास Meat — लेकिन B को fish नहीं चाहिए → Transaction fail Lack of Divisibility कुछ goods divide नहीं हो सकती बिना value खोए Shoes ₹200 की → T-shirt ₹100 की। Person A \"आधे shoes\" नहीं दे सकता। Both or nothing। Lack of Store of Value Commodities perishable हैं — future के लिए store नहीं हो सकती Fish को future generations के लिए store नहीं कर सकते — वो सड़ जाएगी 💡 Discovery of Money — Significance Money ने Barter की limitations solve कीं — common medium of exchange बना। Double coincidence of wants की ज़रूरत खत्म हुई। लोग agriculture के अलावा other professions (teaching, business) में specialize कर सके — क्योंकि money से food खरीद सकते थे। Barter System की 3 limitations: Double Coincidence of Wants + Lack of Divisibility + Lack of Store of Value। Harappan Civilization = Barter System। 💵 3. Types of Money (पैसे के प्रकार) 1. 📜 Fiat Money (विधिग्राह्य मुद्रा) Definition: Government द्वारा legal tender declared currency। Central Bank (RBI) issue करती है। Key: Physical commodity (Gold/Silver) से backed नहीं है। Crucial Concept — Intrinsic vs Face Value: Face Value: Note/Coin पर लिखी value (₹10, ₹100) Intrinsic Value: उस note/coin बनाने का actual cost (paper/metal) Rule: Face Value > Intrinsic Value — तभी Fiat Money काम करती है। Old thick ₹5 coins को Bangladesh में smuggle किया जाता था — वहाँ metal को razor blades बनाने के लिए melt करते थे! Metal की value ₹5 से ज़्यादा थी (Intrinsic > Face Value) → Government ने वो coins discontinue किए। 2. 🤝 Fiduciary Money (विश्वास-आधारित मुद्रा) Definition: Payer और payee के बीच trust (fiduciary relationship) के आधार पर accept होने वाला medium of exchange। Examples: Cheques, Tokens, Bitcoins। Key Difference from Fiat: Fiduciary acceptance mandatory by law नहीं — अगर trust टूटा (cheque bounce हुआ) तो acceptance falls। आपने cheque दिया — वो accept किया गया क्योंकि trust था। लेकिन अगर वो bounce हो गया → trust खत्म → वो person अगली बार cash demand करेगा। 3. 💳 Plastic Money (प्लास्टिक मुद्रा) Definition: Electronic fund transfers के ज़रिए payment — electronic money भी कहते हैं। Debit Card: Account में है उतना ही spend कर सकते हैं। Credit Card: \"Spend Now, Pay Later\" — borrowed money। Prepaid Card: Pहले load करो, फिर spend। 4. 🔥 Hot Money (गर्म धन) Definition: Funds जो investors short-term opportunities (high interest rates, stock market gains) के लिए quickly countries/markets के बीच move करते हैं। Nature: Highly volatile — conditions worsen होने पर rapidly withdraw। Example: Foreign Portfolio Investment (FPI)। 2022 में जब USA ने interest rates बढ़ाईं → India से FPI funds अमेरिका चले गए (higher returns वहाँ) → Rupee weak हुआ → यही Hot Money है। Fiat = Government declared legal tender। Fiduciary = Trust based। Plastic = Electronic। Hot Money = FPI, highly volatile। ⚙️ 4. Functions of Money & Demand for Money 📦 Primary Functions (2) A. Medium of Exchange: Goods और services buy/sell करने का intermediary। Barter की Double Coincidence problem हल। B. Measure of Value (Unit of Account): Products को specific value में quote करना। (Meat = ₹100, Book = ₹200) 🔄 Secondary Functions (2) A. Standard of Deferred Payment: Future payments facilitate करना — EMI, loans। Credit system की base। B. Store of Value: Wealth future के लिए store और transfer करना। Perishable goods की तरह नहीं सड़ता। Additional Characteristics of Money Highly Portable: Easy to carry — जेब में रखो। Durable: Easily degrade नहीं होता। Divisible: Small units में divide हो सकता है। Homogeneous: सभी units same value। 🤔 Why People Hold Money? — Keynes के 3 Motives Motive Description Example 1. Transaction Motive Day-to-day transactions और current needs के लिए Groceries, bills, vegetables, transport 2. Precautionary Motive Unforeseen emergencies या unexpected expenses के लिए Sudden illness, accidents, disasters के लिए savings 3. Speculative Motive Future investment opportunities का फायदा उठाने या financial losses avoid करने के लिए cash hold करना Gold/Stock prices favorable होने का इंतज़ार 📉 Speculative Demand for Money & Interest Rates Inverse Relationship: Speculative demand ∝ 1/Rate of Interest 🔴 High Interest Rates: → People bonds/assets में invest करते हैं (high returns) → Cash hold करना costly → Speculative demand for money ↓ 🟢 Low Interest Rates (Recession): → Returns कम, rates और गिर सकती हैं → Cash hold करना prefer करते हैं → Speculative demand for money ↑ Interest Rate = Opportunity Cost of Holding Money। जब interest high होती है, cash hold करने का cost high होता है। 🪤 The Liquidity Trap (तरलता जाल) Definition: Situation जहाँ interest rates extremely low हों और लोग invest/spend करने की बजाए cash hold prefer करें । Result: Monetary Policy ineffective हो जाती है। Infinite Elasticity: Money demand perfectly elastic हो जाती है। Graph: Liquidity Preference Curve horizontal हो जाती है। Policy Failure: RBI money supply बढ़ाए तो भी लोग वो extra cash रख लेते हैं — spending नहीं बढ़ती। Japan 1990s में Liquidity Trap में था — interest rates ~0%, लेकिन लोग खर्च नहीं करते थे, economy recover नहीं हो रही थी। Monetary Policy completely ineffective थी। Liquidity Trap = Very low interest rates + Cash preference + Monetary Policy ineffective। Keynes का concept। 💹 5. Types of Money in the Economy 1. Currency in Circulation Currency with Public: Ordinary लोगों के पास spending के लिए। Currency with Banks (Vault Cash): Banks के पास daily operations के लिए। Vault Cash = Credit creation का part नहीं — यह idle cash है, lend नहीं हो रही। 2. Deposits with Banks Demand Deposits (DD): Savings + Current — anytime withdraw, highly liquid। Term Deposits (TD): FD, RD — fixed period, less liquid। 3. Deposits with RBI Banker's Deposits: CRR balances जो banks RBI के पास रखती हैं। Other Deposits: Foreign central banks, IMF, World Bank, Government institutions से। 4. Postal Deposits Post Office Savings Bank (POSB) manage करता है। Bank deposits जैसे ही — demand और term दोनों types। 📊 Currency Deposit Ratio (CDR) CDR = Money held by public in Currency ÷
