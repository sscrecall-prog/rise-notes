हिःस्रावी ग्रंथियाँ 11 मिश्रित ग्रंथियाँ (अग्न्याशय) 12 हार्मोन के प्रकार 13 पादप हार्मोन 14 पादप गतियाँ 15 अनुवर्तन गतियाँ 16 अनुकुंचन गतियाँ ↑ Back to Topics 🏛️ 1. ग्रंथियाँ और हार्मोन ग्रंथि क्या है? ग्रंथियाँ शरीर के वे अंग हैं जो विशिष्ट कार्यों के लिए हार्मोन या अन्य रसायन का उत्पादन और स्राव करते हैं। हार्मोन की खोज: ई. एच. स्टार्लिंग द्वारा | पहला हार्मोन: सेक्रेटिन (1902) विशेषता अंतःस्रावी ग्रंथियाँ बहिःस्रावी ग्रंथियाँ स्राव मुख्यतः हार्मोन एंजाइम और अन्य पदार्थ मार्ग वाहिनीहीन (ductless) वाहिनियाँ होती हैं कार्यप्रणाली हार्मोन सीधे रक्त में एंजाइम वाहिनी से स्राव ↑ Back to Topics 🧠 2. हाइपोथैलेमस 1 Hypothalamus मस्तिष्क का एक क्षेत्र — हार्मोन रिलीज, शरीर के तापमान, भूख और नींद-जागने के चक्र सहित कई कार्यों को नियंत्रित करता है। हार्मोन के स्राव को विनियमित करने के लिए जिम्मेदार है। पीयूष ग्रंथि इन हार्मोन को रक्तप्रवाह में छोड़ती है। ↑ Back to Topics ⭐ 3. पीयूष ग्रंथि (Pituitary Gland) 2 Pituitary Gland Master Gland — मटर के दाने के आकार की मस्तिष्क के आधार पर स्थित। अन्य अंतःस्रावी ग्रंथियों को नियंत्रित करने वाले हार्मोन उत्पादित करती है। स्वयं हाइपोथैलेमस द्वारा नियंत्रित होती है। 1️⃣ अग्र पीयूष (Adenohypophysis) प्रोलैक्टिन: दूध निर्माण में। वृद्धि हार्मोन (GH/Somatotropin): GHRH → GH release करता है। GH कमी → बौनापन (Dwarfism) GH अधिकता (बच्चों में) → विशालकायता (Gigantism) GH अधिकता (वयस्कों में) → एक्रोमेगाली (Acromegaly) 2️⃣ पश्च पीयूष (Neurohypophysis) खुद हार्मोन नहीं बनाता — Hypothalamus के हार्मोन संग्रहीत करके मुक्त करता है। ADH (Vasopressin): पानी की मात्रा नियंत्रित (H₂O पुनःशोषण)। ADH कमी → बार-बार पेशाब → मधुमेह इंसिपिडस ऑक्सीटोसिन (Love Hormone): दूध स्राव + प्रसव में गर्भाशय संकुचन। ↑ Back to Topics 🌙 4. पीनियल ग्रंथि (Pineal Gland) 3 Pineal Gland मस्तिष्क के मध्य में छोटी अंतःस्रावी ग्रंथि। मेलाटोनिन हार्मोन स्रावित करती है → Circadian Rhythm (दैनिक जैविक लय) नियंत्रित। मेलाटोनिन = \"अंधेरे का हार्मोन\" — रात को अधिक, दिन में कम। आँख की Retina से संकेत पाकर नींद-जागरण चक्र नियंत्रित करती है। सेरोटोनिन (Happy Hormone): पीनियल ग्रंथि में बनता है (केवल 5-10% मस्तिष्क में) | Tryptophan (अमीनो एसिड) → Serotonin → रात में → Melatonin में बदल जाता है। ↑ Back to Topics 🛡️ 5. थाइमस (Thymus) 4 Thymus 📍 छाती के ऊपरी हिस्से में, उरोस्थि के पीछे, हृदय के सामने। प्रतिरक्षा प्रणाली में — विशेष रूप से बचपन के दौरान — महत्वपूर्ण भूमिका। T-लसीकाणुओं (T-Cells) की परिपक्वता के लिए जिम्मेदार — संक्रमण से लड़ने के लिए आवश्यक। ↑ Back to Topics 🦋 6. थायराइड ग्रंथि (Thyroid Gland) 5 Thyroid Gland तितली के आकार की — गर्दन में थायरोक्सिन (T4) और T3 (Tri-iodothyronine) का उत्पादन। थायरोक्सिन के लिए आयोडीन आवश्यक है। कैल्सीटोनिन: रक्त में कैल्शियम का स्तर कम करता है। T4 और T3 के कार्य चयापचय नियमन ऊर्जा उत्पादन शरीर तापमान हृदय गति 🔗 हार्मोनल मार्ग: H (Hypothalamus) → TRH मुक्त करता है → P (Pituitary) → TSH मुक्त करता है → Thyroid उत्तेजित → T3/T4 उत्पादन स्थिति कारण परिणाम Hypothyroidism आयोडीन की कमी थायराइड ग्रंथि बढ़ जाती है → घेंघा (Goiter) Hyperthyroidism आयोडीन की अधिकता थायराइड अति सक्रिय → अत्यधिक थायरोक्सिन ↑ Back to Topics 🔴 7. पैराथायराइड ग्रंथि (Parathyroid Gland) 6 Parathyroid Gland 📍 गर्दन में — थायराइड ग्रंथि के पीछे स्थित चार छोटी ग्रंथियाँ । रक्त और हड्डियों में कैल्शियम के स्तर को नियंत्रित करना। PTH (Parathyroid Hormone) → रक्त में कैल्शियम का स्तर बढ़ाता है। ↑ Back to Topics ⚡ 8. अधिवृक्क ग्रंथि (Adrenal Gland) 7 Adrenal Gland \"लड़ो या भागो\" हार्मोन 📍 दोनों गुर्दों (वृक्क) के ऊपर — टोपी जैसी संरचना। एड्रिनल हार्मोन = \"Fight or Flight Response\" — तनाव में रक्तचाप, हृदय गति, चयापचय बढ़ाता है। Medulla (भीतरी भाग) एड्रेनालिन: हृदय गति और BP बढ़ाता है, रक्त शर्करा बढ़ाता है (तत्काल ऊर्जा)। नॉरएड्रेनालिन: बेहतर सांस लेने के लिए वायुमार्ग (श्वासनली) को फैलाता है। एड्रेनालिन + नॉरएड्रेनालिन = Fight or Flight (आपात स्थिति में सक्रिय)। Cortex (बाहरी भाग) कोर्टिसोल: तनाव हार्मोन। एल्डोस्टेरोन: रक्तचाप (BP) नियंत्रित। एण्ड्रोजन: कम मात्रा में सेक्स हार्मोन। ⚠️ एडिसन रोग (Addison's Disease) अधिवृक्क ग्रंथियाँ पर्याप्त मात्रा में कोर्टिसोल और एल्डोस्टेरोन नहीं बनातीं। (दुर्लभ, पुरानी स्थिति) ANF (Atrial Natriuretic Factor): मानव हृदय की अलिंद भित्ति द्वारा स्रावित — रक्तचाप नियंत्रण में सहायक। ↑ Back to Topics 🔬 9. जनन ग्रंथियाँ (Gonads) 🔵 वृषण (Testes) — पुरुषों में टेस्टोस्टेरोन हार्मोन मुक्त करते हैं। पुरुष विशेषताओं के लिए जिम्मेदार। 🔴 अंडाशय (Ovaries) — महिलाओं में एस्ट्रोजन: महिला विशेषताओं के लिए। प्रोजेस्टेरोन: मासिक धर्म + गर्भावस्था बनाए रखना। ↑ Back to Topics 💧 10. बहिःस्रावी ग्रंथियाँ (Exocrine Glands) बहिःस्रावी ग्रंथियाँ एंजाइम नलिकाओं (Ducts) के माध्यम से स्रावित करती हैं। 1. स्वेद ग्रंथियाँ वाहिकाओं से त्वचा पर पसीने का स्राव। 2. लार ग्रंथियाँ मुख गुहा में — लार उत्पादन (पाचन, चिकनाई, मुँह सुरक्षा)। 3. यकृत (Liver) शरीर की सबसे बड़ी ग्रंथि। रक्त छानना, पित्त बनाना, ग्लाइकोजन + विटामिन भंडारण। 4. आमाशय (Stomach) HCL + Enzymes से भोजन तोड़ना। Ghrelin = \"भूख का हार्मोन\" स्रावित करता है। ↑ Back to Topics 🔀 11. मिश्रित ग्रंथि — अग्न्याशय (Pancreas) मिश्रित ग्रंथि = अंतःस्रावी + बहिःस्रावी दोनों की तरह कार्य करती है। अग्न्याशय शरीर की दूसरी सबसे बड़ी ग्रंथि है। लैंगरहैंस की द्वीपिकाएँ (Islets of Langerhans) पूरे अग्न्याशय में बिखरी हुई कोशिकाएँ — 2 प्रकार: α-कोशिकाएँ ग्लूकागन उत्पादन। ग्लाइकोजन → ग्लूकोज (Glycogenolysis)। Blood sugar बढ़ाता है। β-कोशिकाएँ इंसुलिन उत्पादन। ग्लूकोज → ग्लाइकोजन (Glycogenesis)। Blood sugar घटाता है। ⚠️ डायबिटीज मेलिटस (Diabetes Mellitus / मधुमेह) तब होता है जब शरीर द्वारा पर्याप्त इंसुलिन का उत्पादन नहीं किया जाता है — रक्त में शर्करा बढ़ जाती है। ↑ Back to Topics ⚗️ 12. हार्मोन के रासायनिक प्रकार प्रकार किससे बने उदाहरण गति अवधि पेप्टाइड अमीनो अम्ल इंसुलिन, GH तेज कम / छोटी स्टेरॉयड कोलेस्ट्रॉल कोर्टिसोल, एस्ट्रोजन धीमी लंबी एमीन अमीनो अम्ल व्युत्पन्न एड्रेनालिन, T3/T4 तेज भिन्न-भिन्न ↑ Back to Topics 🌿 13. पादप हार्मोन (Plant Hormones) प्रकार हार्मोन मुख्य कार्य वृद्धि प्रवर्तक ऑक्सिन तने का विस्तार | शीर्ष प्रभाविता (Apical Dominance) बढ़ाना जिबरेलिन अंकुरण और पुष्पन | तने का विस्तार साइटोकाइनिन कोशिका विभाजन | शीर्ष प्रभाविता रोकना | पार्श्व कलियों का विकास | वृद्धावस्था में पौधे का बूढ़ा होना रोकना | नई पत्तियों का निर्माण वृद्धि अवरोधक एब्सिसिक एसिड (ABA) तनाव हार्मोन | वृद्धि रोकना | रंध्रों का बंद होना गैसीय हार्मोन एथिलीन फलों को पकाने के लिए जिम्मेदार गैसीय हार्मोन Trick: ऑक्सिन = ऊँचाई (तने को लंबा) | जिबरेलिन = जल्दी फूल (अंकुरण + पुष्पन) | साइटोकाइनिन = सेल विभाजन | ABA = रुको (growth stop) | एथिलीन = पकाओ (fuit ripening) ↑ Back to Topics 🌱 14. पादप गतियाँ (Plant Movements) 1️⃣ अनुवर्तन गतियाँ (Tropic Movements) वृद्धि पर निर्भर गतियाँ — दिशात्मक होती हैं। उद्दीपन (stimulus) की प्रतिक्रिया में होती हैं। 2️⃣ अनुकुंचन गतियाँ (Nastic Movements) वृद्धि से स्वतंत्र गतियाँ — गैर-दिशात्मक होती हैं। बाहरी उद्दीपन की प्रतिक्रिया। धनात्मक अनुवर्तन (+) जब पौधे का कोई भाग उद्दीपन की ओर गति करता है। ऋणात्मक अनुवर्तन (−) जब पौधे का कोई भाग उद्दीपन से दूर गति करता है। ↑ Back to Topics ☀️ 15. अनुवर्तन गतियाँ — प्रकार अनुवर्तन उद्दीपन तना (प्ररोह) जड़ उदाहरण प्रकाशानुवर्तन (Phototropism) प्रकाश + धनात्मक (प्रकाश की ओर) − ऋणात्मक (प्रकाश से दूर) Sunflower प्रकाश की ओर झुकता है गुरुत्वानुवर्तन (Geotropism) गुरुत्वाकर्षण − ऋणात्मक (ऊपर, गुरुत्व से दूर) + धनात्मक (नीचे, गुरुत्व की ओर) जड़ें नीचे, तना ऊपर बढ़ता है जलानुवर्तन (Hydrotropism) जल — + धनात्मक (जल स्रोत की ओर) जड़ें पानी की तरफ बढ़ती हैं रसायनानुवर्तन (Chemotropism) रसायन पराग नलिका → अंडाशय की ओर — निषेचन के दौरान पराग नलिका की गति ↑ Back to Topics 🌸 16. अनुकुंचन गतियाँ (Nastic Movements) ये गतियाँ गैर-दिशात्मक हैं — प्रकाश, स्पर्श या तापमान जैसे उद्दीपन की प्रतिक्रिया में होती हैं। 1️⃣ प्रकाशानुकुंचन (Photonasty) प्रकाश की तीव्रता में परिवर्तन की प्रतिक्रिया। आमतौर पर फूलों की पंखुड़ियों की गैर-दिशात्मक गति। Example: दिन में फूल खुलता है, रात में बंद हो जाता है। 2️⃣ स्पर्शानुकुंचन (Thigmonasty) स्पर्श या कंपन के प्रति गैर-दिशात्मक प्रतिक्रिया। Example: Mimosa pudica (छुई-मुई) — छूने पर पत्तियाँ बंद हो जाती हैं। Venus Flytrap — मक्खी बैठने पर पत्तियाँ बंद → मक्खी अंदर फँस जाती है। विशेषता अनुवर्तन गतियाँ अनुकुंचन गतियाँ दिशा दिशात्मक (Directional) गैर-दिशात्मक वृद्धि से संबंध वृद्धि पर निर्भर वृद्धि से स्वतंत्र उद्दीपन प्रकाश, गुरुत्व, जल, रसायन प्रकाश, स्पर्श, तापमान उदाहरण Sunflower, जड़ों की वृद्धि छुई-मुई, Venus Flytrap, फूलों का खुलना"}, {"title": "Reproduction", "subject": "Biology", "url": "../biology/reproduction_notes.html", "text": "Reproduction Notes – RISE NOTES RISE NOTES 🧬 Reproduction Complete Study Notes – Simple aur Easy Language mein 📋 Topics at a Glance 1 Introduction to Reproduction 2 Types of Gametic Fusion 3 Asexual Reproduction 4 Binary & Multiple Fission 5 Fragmentation & Budding 6 Regeneration 7 Vegetative Propagation 8 Tissue Culture 9 Sexual Reproduction in Plants 10 Anatomy of a Flower 11 Types of Flowers 12 Pollination 13 Fruit-Related Terms 14 Human Reproductive System 15 Menopause & Placenta 16 Fertilization 17 Process of Fertilization 18 IVF, Totipotency, Parthenogenesis 19 Metamorphosis 20 Types of Cultures (Farming) ↑ Back to Topics 🌱 1. Introduction to Reproduction Reproduction kya hai? Reproduction woh biological process hai jisme living organisms offspring produce karte hain — species ko continue karne ke liye. Ye individual survival ke liye zaruri nahi, but species ke survival ke liye crucial hai. Feature Asexual Reproduction Sexual Reproduction Parents involved Only one parent Both male & female Occurs in Unisexual / lower plants Bisexual / higher plants Genetics Genetic similarity Genetic diversity (higher survival chance) Reproductive organs Not present Fully developed parts present Metagenesis: Ek aisa life cycle jisme ek generation asexually reproduce kari, doosri sexually. Kuch diploid kuch haploid hote hain. E.g. Obelia ↑ Back to Topics 🔗 2. Types of Gametic Fusion Isogamy Morphologically similar gametes ka fusion (same size & shape). E.g. Chlamydomonas Anisogamy Morphologically dissimilar gametes ka fusion (different size & shape). E.g. Some algae, fungi Oogamy Anisogamy ka type — large, non-motile egg + small, motile sperm. E.g. Humans Sexual Reproduction Flow: Male Gamete (Sperm) + Female Gamete (Ovum/Egg) → Zygote ↑ Back to Topics 🔄 3. Asexual Reproduction — Overview Method 1 Binary Fission Method 2 Multiple Fission Method 3 Fragmentation Method 4 Budding Method 5 Regeneration Method 6 Vegetative Propagation ↑ Back to Topics ✂️ 4. Binary Fission & Multiple Fission Binary Fission Unicellular organism 2 equal, genetically identical daughter cells mein divide hota hai. Sirf unicellular organisms mein common. E.g. Amoeba, Leishmania Multiple Fission Nucleus multiple times divide hota hai, cytoplasm baad mein → many daughter cells. Many offsprings produced. E.g. Plasmodium (malarial parasite) ↑ Back to Topics 🧩 5. Fragmentation & Budding Fragmentation Body pieces mein break hoti hai → har fragment ek naya organism banata hai. Simple multicellular organisms mein hota hai. E.g. Spirogyra (green algae), Rhodophyte (red algae), Sea anemone Budding Parent organism pe bud ya outgrowth se naya organism develop hota hai. Cell division se chhota bud banta hai → grow karke detach hota hai. Simple multicellular + unicellular dono mein hota hai. E.g. Hydra (multicellular), Yeast (unicellular) ↑ Back to Topics 🔁 6. Regeneration Regeneration kya hai? Original organism ke ek part se naya organism develop hota hai. E.g. Planaria, Hydra ↑ Back to Topics 🌿 7. Vegetative Propagation Kya hota hai? Naya plant parent plant ke vegetative parts (root, stem, leaf) se grow karta hai. Cutting ya grafting se bhi ho sakta hai. Seeds involve nahi hote — naya plant genetically identical to parent. Root Propagation Sweet Potato Rhizome Ginger Tuber (Eyes/Buds) Potato Leaf Bryophyllum Bulb Onion Runner Oxalis Sucker Mint 📌 Potato ke \"Eyes\" Potato ke buds ko \"eyes\" kehte hain — ye axillary buds hote hain stem ke nodes pe. Ye new potato plant mein grow ho sakte hain. Types of Vegetative Propagation Cutting: Plant ka part (stem/leaf) cut karke soil mein plant karo. Rose, Money Plant, Banana, Sugarcane Layering: Stem ko bend karke soil se cover karo. Lemon, Strawberry Grafting: Doosre plant ki cutting ko plant ke stem se attach karo. Rose ↑ Back to Topics 🧪 8. Tissue Culture Kya hai? Modern method of asexual reproduction — laboratory mein sterile conditions mein cells/tissues se naye plants grow kiye jaate hain. E.g. Ornamental plants like snake plant mein widely used. Aise plants ki cost bahut high hoti hai. ↑ Back to Topics 🌸 9. Sexual Reproduction in Plants Kaise hota hai? Male (pollen) + Female (ovule) gametes fuse → Zygote → Seed → New plant. Ye process flowers ke through hota hai — plants ke reproductive organs. ↑ Back to Topics 🌺 10. Anatomy of a Flower 🟡 Male Part — Stamen Filament: Anther ko support karta hai. Anther: Pollen produce karta hai (yellow colour). 🔴 Female Part — Pistil Stigma: Sticky bulb — pollen pakadta hai. Style: Pollen ke liye passageway. Ovary: Eggs hold karta hai — fertilization ke baad fruit ban jaata hai. ↑ Back to Topics 🌻 11. Types of Flowers & Plants Bisexual Flowers (Hermaphrodite) Same flower mein dono male (stamens) + female (pistil) organs. Self-pollination + Cross-pollination dono capable. Hibiscus, Mustard, Lily, Sunflower Unisexual Flowers Sirf ek organ — ya stamens ya pistil. Only cross-pollination capable. Male (stamens only): Corn, Cucumber Female (carpels only): Papaya, Watermelon Monoecious Plants Male + female reproductive parts same plant pe. Maize, Cucumber Dioecious Plants Male + female reproductive parts separate plants pe. Papaya, Date Palm ↑ Back to Topics 🐝 12. Pollination Pollination kya hai? Pollen (plant ke male reproductive cells) ka transfer anther se stigma (female part) tak → fertilization → seed development. 1. Self-Pollination (Autogamy) Same flower ya same plant ke doosre flower ke stigma pe pollen. No genetic variation. Pea, Tomato 2. Cross-Pollination (Allogamy) Ek plant ke anther se different plant ke same species ke stigma pe pollen. Genetic diversity promote karta hai. Apple, Sunflower Agent Type of Pollination Examples 🐝 Insect Entomophily Rose, Lotus 💨 Wind Anemophily Maize, Grass 💧 Water Hydrophily Vallisneria ↑ Back to Topics 🍎 13. Fruit-Related Specific Terms False Fruit Ovary ke alawa flower ke doosre parts se develop hota hai. Fertilization zaruri nahi — thallus bhi involved. Apple, Cashew nut Drupe Fruit Hard shell + seed + inner flesh wala fruit. Coconut Parthenocarpic Fruits Seedless fruits — ovule ke fertilization ke bina develop. Banana, Grape, Cucumber ↑ Back to Topics 👤 14. Human Reproductive System 🔵 Male Reproductive Parts Testes: Scrotum mein — sperm + testosterone produce. Sperm production ~age 10-12 yrs. Vas Deferens (Sperm Duct): Mature sperm ko epididymis se urethra tak le jaata hai. Seminal Vesicles + Prostate Gland: Seminal fluid add → Semen banta hai (nutrients + medium for sperm). Urethra: Semen aur urine dono carry karta hai — kabhi ek saath nahi. 🔴 Female Reproductive Parts Fallopian Tubes (Oviducts): Sperm + egg meet → fertilization hota hai. Cilia egg ko uterus ki taraf push karte hain. Uterus (Womb): Fertilized egg implant hota hai → foetus develop hota hai. Innermost lining = Endometrium . Cervix: Uterus ka lower part → vagina se connect. Childbirth mein open hona zaroori. 📌 Important Facts Cervical Cancer: Human Papillomavirus (HPV) se hota hai. Uterine wall pregnancy ke liye thick hoti hai → agar pregnancy nahi hoti → lining shed → Menstruation . ↑ Back to Topics ⏰ 15. Menopause & Placenta Menopause Women mein menstruation ka permanent cessation . Reproductive years ka ant. Late 40s to early 50s — average age 51 . Ovaries eggs release karna band → Estrogen + Progesterone decrease. Placenta Mother aur baby ke beech link . Umbilical cord = placenta se — substances carry karta hai foetus se/tak. Umbilical cord mein 3 blood vessels: 1 Umbilical Vein: O₂ + nutrients → Mother to Foetus. 2 Umbilical Arteries: CO₂ + waste → Foetus to Mother. ↑ Back to Topics 🔬 16. Fertilization Fertilization: Male gamete (sperm) + Female gamete (egg) = Zygote Internal Fertilisation Female body ke andar fusion. Humans External Fertilisation Body ke bahar fertilisation. Frog, Earthworms, Crab Feature Oviparous Ovoviviparous Viviparous Egg laying Yes Eggs kept inside No Development Outside body Inside egg (inside mother) Inside uterus Nourishment Yolk Yolk Placenta Birth Hatch outside Live birth Live birth Example Hen, Birds, Frogs Sharks, Snakes Cats, Dogs, Humans ⚠️ Exception Platypus ek mammal hai jo eggs deta hai! ↑ Back to Topics 📋 17. Process of Fertilization (Step-by-Step) 1 Gametogenesis Gametes banane ka process — males mein sperm, females mein eggs. 2 Insemination Sperm ka female reproductive tract mein transfer (intercourse ke doran). 3 Fertilisation Sperm + Egg fuse → Zygote (new baby ki pehli cell). 4 Implantation Zygote → Blastocyst develop → Uterine wall se attach → Pregnancy start. 5 Gestation Embryo grow karta hai → Foetus banta hai uterus ke andar. 6 Parturition Final stage — baby delivered through childbirth. ↑ Back to Topics 🧫 18. IVF, Totipotency & Parthenogenesis 🔬 In-Vitro Fertilisation (IVF) Egg + Sperm ko mother ke body ke bahar laboratory mein combine kiya jaata hai. \"Test tube baby\" method. 🌱 Totipotency Single cell ki ability ki ek fertile, adult individual produce kar sake. Tissue culture ka basis. 🐝 Parthenogenesis Asexual reproduction — organism unfertilised egg se develop hota hai, sperm ki zarurat nahi. Honey bees, Lizards ↑ Back to Topics 🦋 19. Metamorphosis in Butterfly Complete Transformation — 4 Stages Butterfly metamorphosis ek complete transformation hai 4 distinct stages mein: Stage 1 🥚 Egg Stage 2 🐛 Larva (Caterpillar) Stage 3 🫘 Pupa (Chrysalis) Stage 4 🦋 Adult Butterfly ↑ Back to Topics 🌾 20. Types of Cultures (Farming) Activity / Type Culture Name 🥦 Vegetable farming Horticulture 🐛 Silk rearing Sericulture 🐝 Bee keeping Apiculture 🐟 Fish farming Pisciculture 🌺 Flower farming Floriculture 🦐 Rearing aquatic plants and animals Aquaculture 🍇 Cultivation of grapevines Viticulture / Viniculture 🐦 Bird farming Aviculture Trick — Culture Names yaad karo: Horti = Vegetable | Seri = Silk | Api = Bee 🐝 | Pisci = Fish 🐟 | Flori = Flower 🌸 | Aqua = Water 💧 | Viti = Grape 🍇 | Avi = Bird 🐦"}, {"title": "Digestion and Respiration", "subject": "Biology", "url": "../biology/digestion_respiration_notes.html", "text": "Digestion & Respiration – RISE NOTES RISE NOTES 🫁 Digestion & Respiration Complete Study Notes – Simple aur Easy Language mein 📋 Topics at a Glance 1 Digestive System Intro 2 Mouth & Oesophagus 3 Stomach 4 Small Intestine 5 Bile & Pancreas 6 Large Intestine 7 Liver 8 Villi, Rectum & Anus 9 Food Pathway 10 Respiration in Plants 11 Human Respiratory System 12 Nose → Alveoli 13 Inhale vs Exhale 14 Epiglottis 15 Aerobic vs Anaerobic 16 Cellular Respiration 17 Steps in Cellular Respiration 🍽️ PART 1 — THE HUMAN DIGESTIVE SYSTEM ↑ Back to Topics 🍽️ 1. Digestive System — Introduction Digestive System kya hai? Food ko simpler substances mein break down karne ka process — nutrient absorption ke liye. Largest Organ 🧴 Skin Largest Gland 🫀 Liver Study of Liver Hepatology Study of Blood Hematology ↑ Back to Topics 👄 2. Mouth & Oesophagus 👄 Mouth (Oral / Buccal Cavity) Digestion yahan se start hoti hai. Teeth → food chew karte hain ( mechanical digestion ). Saliva (salivary glands se) → Salivary Amylase contain karta hai → starch (complex carbs) → simple carbs. Tongue food mix karne aur swallowing mein help karta hai. 🔗 Pharynx & Oesophagus Pharynx: Mouth ko oesophagus se connect karta hai. Oesophagus: Length = 25 cm — muscular tube jo food ko stomach tak push karta hai peristalsis (wave-like movement) se. ↑ Back to Topics 🫙 3. Stomach Stomach — J-shaped muscular organ Gastric Juice pH: 1.6 HCl (Hydrochloric Acid): Germs kill karta hai, acidic medium provide karta hai. Gastric juice mein present (pH 1.6). Pepsin: Proteins digest karta hai — sirf acidic medium mein kaam karta hai . Mucus: Delicate stomach lining ko acid se protect karta hai. Sphincter Muscle: Food ko stomach se small intestine mein pass karne deta hai. ↑ Back to Topics 🌀 4. Small Intestine Small Intestine — Longest part of alimentary canal Length: 6.5 to 7.5 meters Main site of digestion and absorption. 3 parts mein divided: Duodenum Jejunum Ileum Yahan liver se bile aur pancreas se pancreatic juice receive hoti hai. ↑ Back to Topics 💛 5. Bile & Pancreas 💛 Bile (Bile Juice) Liver se, Gall Bladder mein stored Bile ek enzyme nahi — supporting role play karta hai. Alkaline (basic) in nature. Acidic food ko neutralize karta hai small intestine se pehle. Pancreatic + intestinal enzymes ke liye favorable pH create karta hai. Emulsification of Fats: Large fat globules → small globules. 🟡 Pancreas Pancreatic Juice release karta hai Function: Carbs, proteins aur fats digest karta hai. Amylase: Carbs break down. Lipase: Fats → fatty acids + glycerol. Trypsin: Basic medium mein kaam karta hai → Proteins → amino acids. Pepsin vs Trypsin: Pepsin = Acidic medium (Stomach) | Trypsin = Basic medium (Small Intestine) — dono protein digest karte hain! ↑ Back to Topics 🔵 6. Large Intestine Large Intestine — Length: 1.5 m Function: Remaining undigested food se water + electrolytes absorb karna → feces solidify → elimination. Cecum: Large intestine ka pehla part — small intestine ko colon se connect karta hai. Colon: Indigestible food residues se water absorb karna. ↑ Back to Topics 🟤 7. Liver Liver — Human body ki sabse badi gland Hepatology = Study of Liver | Dark red-brown, right side of abdomen Glucose → Glycogen (storage) — process = Glycogenesis . Plasma proteins synthesize karta hai. Amino acid metabolism (deamination + urea formation). Blood sugar levels maintain karne ke liye glycogen store karta hai. Kupffer Cells Star-shaped phagocytic cells — liver sinusoids ki lining mein. Old/damaged RBCs break down karte hain. Blood se pathogens + debris clean karte hain. Regenerative ability hoti hai. Hepatocytes Liver ki main parenchymal (functional) cells. Carbs, proteins aur fats ka metabolism. Blood detoxification. ↑ Back to Topics 🔬 8. Villi, Rectum & Anus Villi Small intestine ki inner wall pe finger-like projections. Surface area significantly increase karte hain. Nutrient absorption (assimilation) enhance karte hain. Rectum Feces store karta hai. Anus Opening jisse waste body se excrete hota hai. ↑ Back to Topics 🗺️ 9. Food Pathway — Complete Route 🍽️ HUMAN DIGESTIVE SYSTEM — PATHWAY OF FOOD MOUTH → PHARYNX → ESOPHAGUS → STOMACH → SMALL INTESTINE (Duodenum → Jejunum → Ileum) → LARGE INTESTINE (Cecum → Colon → Rectum) → ANUS Organ Secretion Works On Medium Mouth Salivary Amylase Starch → Simple sugars Neutral Stomach HCl + Pepsin + Mucus Proteins → Peptides Acidic (pH 1.6) Liver Bile (not enzyme) Fat emulsification Alkaline Pancreas Amylase, Lipase, Trypsin Carbs, Fats, Proteins Basic Small Intestine Intestinal enzymes Final digestion + Absorption Basic Large Intestine — Water + Electrolyte absorption — 🌬️ PART 2 — RESPIRATION ↑ Back to Topics 🌿 10. Respiration in Plants Respiration: Biochemical process — organic compounds ka oxidative breakdown → energy ATP (Adenosine Triphosphate) ke form mein release. Breathing: Oxygen inhale karna aur Carbon Dioxide exhale karna (lungs ke through). 🌱 By Roots Air soil particles ke beech spaces mein hoti hai (soil interspaces). Root hairs + epiblema cells (outermost layer of young roots) soil air ke direct contact mein. O₂ diffuse hoti hai root hairs → inner tissues → aerobic respiration → glucose break down → energy. 🍃 By Leaves Leaves + young stems — thin structure + pores → quick gas exchange. Mature stems → impermeable epidermis → water loss prevent. Epidermis mein stomata (tiny openings) hote hain. Har stoma ke 2 guard cells hote hain → opening/closing control. Gas exchange + transpiration regulate karte hain. 📌 Guttation Plants mein raat ko water loss — hydathodes (leaf edges pe present) ke through — water droplets ki form mein. ↑ Back to Topics 🫁 11. Human Respiratory System 🌬️ Mechanism of Respiration — Air Pathway Nose → Pharynx → Larynx → Trachea → Bronchi → Bronchioles → Alveoli ↑ Back to Topics 👃 12. Nose → Pharynx → Larynx → Trachea → Bronchi → Bronchioles → Alveoli 👃 Nose & Nasal Cavity First entry point for air Nose ke andar hair → dust + impurities trap karte hain. Mucus lining → air moisten karta hai, dust + bacteria trap karta hai, respiratory tract protect karta hai. 🗣️ Pharynx Air aur food dono ke liye common passage. Nasal cavity ko larynx se connect karta hai. Air ko trachea ki taraf direct karta hai. 🎤 Larynx (Voice Box) Adam's Apple bhi kehte hain Vocal cords contain karta hai — air pass hone par sound produce hoti hai. Trachea ke top pe located hai. 🌬️ Trachea (Windpipe) Long tube — larynx se bronchi tak air carry karta hai. C-shaped cartilage rings — trachea ko collapse hone se rokते hain, airway open rakhte hain. 🌿 Bronchi Trachea 2 bronchi mein divide hoti hai — ek har lung ke liye. Har bronchus lung mein enter karta hai, air deeper carry karta hai. Mucus + cilia — dust aur microbes trap karte hain. 🌱 Bronchioles Lungs ke andar har bronchus aur chhoti tubes mein branch karta hai = bronchioles. Narrower + more numerous — lungs mein air spread karte hain. Directly alveoli (air sacs) mein lead karte hain. 🫧 Alveoli Gas Exchange Site Tiny balloon-like structures — bronchioles ke ends pe. Lungs mein millions of alveoli — capillaries (tiny blood vessels) se surrounded. Function: O₂ air se blood mein diffuse hoti hai → CO₂ blood se alveoli mein → exhale. Thin walls + large surface area → gas exchange bahut efficient. Diaphragm: Chest cavity ka floor banata hai. | Respiration Centre: Medulla Oblongata mein hota hai. ↑ Back to Topics ↕️ 13. Inhale vs Exhale Process Rib Cage Movement Diaphragm Movement Lungs O₂ (%) CO₂ (%) Inhale Goes UP ↑ Goes DOWN ↓ Expands 21% 0.04% Exhale Goes DOWN ↓ Goes UP ↑ Contracts 16.40% 4.4% Trick: Inhale mein sab expand hota hai (rib cage up, diaphragm down, lungs expand) | Exhale mein sab contract hota hai (rib cage down, diaphragm up, lungs contract) ↑ Back to Topics 🚪 14. Epiglottis Epiglottis kya karta hai? Hamara airway protect karta hai — swallowing ke time food aur liquid ko lungs mein enter hone se rokta hai. ↑ Back to Topics ⚡ 15. Aerobic vs Anaerobic Respiration Basis Aerobic Respiration Anaerobic Respiration Oxygen O₂ required O₂ NOT required Site Mitochondria + Cytoplasm Cytoplasm only End Products CO₂ + H₂O + Energy CO₂ + C₂H₅OH (ethanol) + Energy Energy Released Large amount Small amount ATP Produced 38 ATP Only 2 ATP Example Humans, most animals Yeast (dough), Muscle cells (lack of O₂) 🍞 Yeast in Dough Yeast anaerobic respiration karta hai → CO₂ release → dough soft aur fluffy banta hai (baked goods mein use). 💪 Muscle Cramps Muscles mein O₂ ki kami → Anaerobic respiration → Lactic acid accumulate hota hai → Cramps . Glycolysis pathway: Glucose (C₆H₁₂O₆) → Pyruvate (3C) + 2 ATP In Yeast (no O₂): Pyruvate → Ethanol + CO₂ + Energy In Muscles (no O₂): Pyruvate → Lactic Acid + Energy In Mitochondria (O₂ present): Pyruvate → CO₂ + H₂O + Energy (Aerobic) ↑ Back to Topics 🔋 16. Cellular Respiration Cellular Respiration kya hai? Process jisme cells glucose (sugar) break down karte hain — O₂ ki presence mein — energy ATP (Adenosine Triphosphate) ke form mein release karte hain. Formula: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + Energy (ATP & heat) ↑ Back to Topics 📋 17. Steps in Cellular Respiration 1 Glycolysis — Cytoplasm mein Glucose (6C) → 2 molecules of Pyruvate (3C each). Small amount of ATP + NADH produce hote hain. 2 Krebs Cycle (Citric Acid Cycle) — Mitochondria mein Pyruvate further break down hota hai. CO₂ release hoti hai. Energy carriers NADH + FADH₂ produce hote hain. 3 Electron Transport Chain (ETC) — Inner Mitochondrial Membrane mein NADH + FADH₂ electrons donate karte hain. O₂ = final electron acceptor. Up to 34 ATP produce hota hai. Total ~ 38 ATP per glucose aerobic respiration mein. NADH (Nicotinamide Adenine Dinucleotide): ek coenzyme hai jo cellular respiration mein electrons ko Electron Transport Chain tak transport karta hai — vital role. Step Location Input Output ATP Glycolysis Cytoplasm Glucose (6C) 2 Pyruvate (3C) 2 ATP Krebs Cycle Mitochondria Pyruvate CO₂ + NADH + FADH₂ 2 ATP ETC Inner mitochondrial membrane NADH + FADH₂ H₂O ~34 ATP Total — — — ~38 ATP"}, {"title": "Circulatory System and Excretory System", "subject": "Biology", "url": "../biology/circulatory_excretory_system.html", "text": "Circulatory & Excretory System | RISE NOTES RISE NOTES Circulatory & Excretory System पूरा notes आसान Hindi-English भाषा में ❤️ Heart • 🩸 Blood • 🫘 Kidney • 🚰 Excretion 📌 Topics at a Glance किसी भी topic पर click करो — सीधा उसी section पर पहुँच जाओगे 👇 1. Human Heart दिल (Heart) एक fist-sized (मुट्ठी के आकार का) अंग है जो पूरे शरीर में oxygenated blood pump करता है। यह heart rate की rhythm और speed को control करता है। यह blood pressure को भी maintain रखता है। Anatomy of Human Heart (हृदय की संरचना) Heart में 4 chambers (4 कक्ष) होते हैं: ऊपर के 2 कक्ष Atrium (Left + Right) — इन्हें \"अलिंद\" कहते हैं। नीचे के 2 कक्ष Ventricles (Left + Right) — इन्हें \"निलय\" कहते हैं। Heart Wall की 3 Layers Epicardium — सबसे बाहरी परत (outer layer) Myocardium — बीच की परत (middle layer, मांसपेशी वाली) Endocardium — सबसे अंदरूनी परत (inner layer) Yaad rakho: Epi = बाहर, Myo = बीच (muscle), Endo = अंदर — E-M-E क्रम से याद करो! 2. Heart Beat, Cardiac Output & ECG Heart Beat (धड़कन) हृदय के rhythmic contraction और relaxation को Heart Beat कहते हैं। इसमें एक होता है: Systole — Contraction phase (सिकुड़ना / Ventricular Contraction) Diastole — Relaxation phase (फैलना / Ventricular Relaxation) एक healthy व्यक्ति की heartbeat लगभग 72 बार/मिनट होती है। Heart Sound: \"Lub-Dub\" 🔊 Lub Mitral और Tricuspid valves के बंद (close) होने की आवाज़। 🔊 Dub Aortic और Pulmonary valves के बंद होने की आवाज़। Cardiac Output (हृदय-निर्गम) हृदय द्वारा प्रति मिनट pump किए गए blood की मात्रा को Cardiac/Heart Output कहते हैं। 72 bpm × 70 mL/beat = ≈ 5040 mL (~5 L/min) Sphygmomanometer — blood pressure नापने का instrument है। Electrocardiogram (ECG) ECG एक test है जो हृदय की electrical activity record करता है। यह skin पर लगे electrodes की मदद से voltage vs time का graph बनाता है। इससे abnormal heart rhythms और heart की condition का पता चलता है। 3. Structure & Functions of Heart Chambers 🔴 Right Atrium (दायाँ अलिंद) Location: Heart का ऊपरी दायाँ हिस्सा Function: शरीर के अलग-अलग भागों से deoxygenated blood प्राप्त करता है, through: Superior vena cava (ऊपरी शरीर से) Inferior vena cava (निचले शरीर से) Blood, Tricuspid valve से होकर right ventricle में जाता है। Artery vs Vein: 🔺 Artery → Thick-walled, oxygenated blood ले जाती है (Exception: Pulmonary artery — deoxygenated blood ले जाती है) 🔻 Vein → Thin-walled, valves होते हैं (backflow रोकने के लिए), deoxygenated blood ले जाती है (Exception: Pulmonary vein — oxygenated blood ले जाती है) 🔴 Right Ventricle (दायाँ निलय) Location: Heart का निचला दायाँ हिस्सा Function: Right atrium से blood receive करता है और Pulmonary artery के जरिए फेफड़ों को deoxygenated blood pump करता है। Valves: Tricuspid valve — right atrium में backflow रोकता है Pulmonary valve — right ventricle से pulmonary artery तक flow control करता है 🔵 Left Atrium (बायाँ अलिंद) Location: Heart का ऊपरी बायाँ हिस्सा Function: फेफड़ों से 4 pulmonary veins के जरिए oxygenated blood receive करता है। Blood, Bicuspid (Mitral) valve से left ventricle में जाता है। 🔵 Left Ventricle (बायाँ निलय) Location: Heart का निचला बायाँ हिस्सा यह heart का सबसे मोटा (thickest) chamber है। Function: Left atrium से oxygen-rich blood receive करता है और Aorta के जरिए पूरे शरीर में pump करता है। Valves: Bicuspid (Mitral) valve — left atrium में backflow रोकता है Aortic valve — aorta से left ventricle में backflow रोकता है Aorta शरीर की सबसे बड़ी artery Inferior Vena Cava शरीर की सबसे बड़ी vein Coronary Artery heart को blood supply करती है 4. Double Circulation Double Circulation वह प्रकार है जिसमें blood, एक complete cycle में दो बार heart से होकर गुजरता है — यह humans और सभी mammals में होता है। खोज (Discovery): Blood circulation की खोज William Harvey ने की थी। उदाहरण (Examples) Right ventricle से pump किया deoxygenated blood → Pulmonary artery → Lungs (यहाँ CO₂, O₂ से exchange होती है, diffusion द्वारा) → Pulmonary vein से वापस heart में। Left ventricle से oxygenated blood → Aorta → शरीर के सभी अंग (cells/tissues) (यहाँ O₂, CO₂ से exchange होती है) → Vena cava से वापस heart में। Right Ventricle → Lungs → Left Atrium Left Ventricle → Body → Right Atrium Important Points Coronary Artery: Heart की muscles को oxygen-rich blood supply करने वाली main blood vessel। Sinoatrial Node (SA Node): Right atrium में स्थित, यह heart का \"natural pacemaker\" है — electrical signals generate करता है जो heart के ऊपरी chamber को contract कराते हैं। 5. Sphygmomanometer & Pulse Rate Sphygmomanometer यह एक medical instrument है जो blood pressure नापने के लिए use होता है। यह 2 चीज़ें measure करता है: Pressure Type Meaning Normal Value Systolic Pressure Heart contract होकर blood body में pump करता है ~120 mm Hg Diastolic Pressure Heart relax होकर अगली धड़कन के लिए blood से भरता है ~80 mm Hg Pulse Rate (नब्ज़ दर) यह बताता है कि आपका heart प्रति मिनट कितनी बार धड़कता है । Normal range: 60–100 beats per minute (bpm) 6. Blood (रक्त) Blood एक special connective tissue है, जिसमें होते हैं: Fluid matrix — Plasma Solid components — Blood cells (RBC, WBC, Platelets) 🔴 Red Blood Cells (RBC) Structure: लाल रंग, गोल और biconcave shape, denucleated (nucleus नहीं होता), elastic, इसमें ER, ribosomes, mitochondria जैसे organelles नहीं होते। Normal count: 4.5 – 5.5 million/cubic mm बनती कहाँ है: Bone marrow में (जन्म से) Lifespan: लगभग 120 दिन Function: Oxygen और थोड़ी CO₂ transport करना Graveyard of RBC: Spleen (bean के आकार का lymphoid organ) RBC count कम होने से Anemia होता है। ⚪ WBC (White Blood Cells) / Leukocytes Normal count: 5000–8000/cubic mm Leukemia: Blood cancer का एक प्रकार जो bone marrow की blood cells (मुख्यतः WBCs) को प्रभावित करता है। 💧 Plasma Blood/lymph का liquid भाग, पीले रंग का viscous fluid, जिसमें 90–92% पानी और 6–8% proteins होते हैं। 7. Blood Group & Rh Factor चार मुख्य blood groups (A, B, AB, O) की खोज Austrian scientist Karl Landsteiner ने 1900 में की — इसे ABO blood group system कहते हैं। Bombay Blood Group की खोज Y. M. Bhende ने 1952 में की थी। Blood Type Gives (Donates to) Receives from A+ A+, AB+ A+, A-, O+, O- O+ O+, A+, B+, AB+ O+, O- B+ B+, AB+ B+, B-, O+, O- AB+ AB+ Everyone (Universal Recipient) A- A+, A-, AB+, AB- A-, O- O- Everyone (Universal Donor) O- B- B+, B-, AB+, AB- B-, O- AB- AB+, AB- AB-, A-, B-, O- Rh Factor Rh factor (Rhesus factor) एक inherited protein है जो RBC की सतह पर पाया जाता है। अगर यह protein है → Rh-positive (Rh+) अगर यह protein नहीं है → Rh-negative (Rh-) 8. Excretory System (उत्सर्जन तंत्र) Excretory System शरीर से waste products हटाकर internal chemical balance ( homeostasis ) बनाए रखता है। मुख्य waste product urea है, साथ में excess water और salts भी निकलते हैं। मुख्य अंग (Main Organs) 🫘 Kidneys (2) मुख्य filtering organ 🔗 Ureters (2) Urine को bladder तक ले जाते हैं 🎈 Urinary Bladder Urine को temporarily store करता है 🚿 Urethra Urine शरीर से बाहर निकलता है 9. Kidney (गुर्दा) Size: 10–12 cm लंबाई, 5–7 cm चौड़ाई, 2–3 cm मोटाई, average weight ~120–170 g यह bean-shaped organ है जो backbone के दोनों ओर, ribcage के नीचे स्थित होता है। Right kidney , left kidney से थोड़ा नीचे होती है। Main function: Blood से urea, excess salts और पानी छानकर urine बनाना। हर kidney में लगभग 1 million nephrons होते हैं (basic functional units)। Outer layer: Renal cortex और Renal capsule 10. Nephron (वृक्काणु) Kidney की basic functional unit । Nephrons, ultrafiltration के जरिए blood से waste material निकालते हैं। Structure of Nephron Bowman's Capsule Cup-shaped structure जो glomerulus को घेरे रहता है। Glomerulus Capillaries का bunch जहाँ blood filter होता है। हर मिनट ~1100–1200 mL blood filter होता है। PCT (Proximal Convoluted Tubule) Glucose, पानी और salts जैसे useful substances को reabsorb करता है। Collecting Duct Urine को collect करके renal pelvis तक पहुँचाता है। JGA (Juxtaglomerular Apparatus): Blood pressure और Glomerular Filtration Rate (GFR) को regulate करता है। 11. Processes in the Nephron Ultrafiltration → Reabsorption → Secretion → Excretion Ultrafiltration: Blood pressure, पानी और solutes को Bowman's capsule में push करता है। Reabsorption: Useful substances (जैसे glucose और कुछ पानी) tubule में वापस reabsorb होते हैं। Secretion: कुछ अतिरिक्त waste actively tubule में secrete किए जाते हैं। Excretion: Final urine, collecting duct में भेजा जाता है। 12. Ureters, Urinary Bladder & Urethra Ureters दो narrow tubes जो urine को kidneys से urinary bladder तक ले जाती हैं। Urinary Bladder यह एक muscular sac है जो urine को temporarily store करता है और expand/contract कर सकता है। जब bladder भर जाता है, तो brain को signal भेजता है ताकि urination शुरू हो सके। Urethra यह वह tube है जिससे urine शरीर से बाहर निकलता है। यह एक sphincter muscle द्वारा control होती है जो urination के दौरान खुलती है। 13. Urine (मूत्र) Components: पानी (95%) और Urea (2%) pH: 4.5 – 5.5 Waste Product: Ammonia Urine का पीला रंग — urochrome/urobilin नाम के waste product से आता है, जो haemoglobin के टूटने से बनता है। Yaad rakho: Feces का पीला रंग stercobilin से आता है (जो bilirubin से बनता है) — Urine वाला pigment अलग है (urochrome)! 14. Dialysis & Kidney Stone Dialysis जब kidneys सही से काम नहीं कर पातीं, तो यह procedure blood से waste और excess fluid छानता है — machine शरीर से blood निकालकर dialyzer से filter करती है और साफ blood वापस शरीर में भेजती है। Kidney Stone Kidney stones (Calcium Oxalate से बने) minerals और acid salts के hard deposits होते हैं जो concentrated urine में जमा हो जाते हैं। मुख्य कारण: रोज़ 2L से कम पानी पीना, obesity, ज़्यादा नमक-चीनी वाला खाना। Bilirubin: Liver में haemoglobin के टूटने से बनने वाला orange-yellow pigment, जो bile में excrete होता है। मल (solid waste) का पीला रंग इसी से आता है। 15. Role of Other Organs in Excretion 🫁 Lungs CO₂ (18 L/day) और पानी को remove करते हैं। 🧫 Liver Bilirubin और biliverdin जैसे bile pigments secrete करता है (hemoglobin टूटने से बनते हैं), साथ में cholesterol, कुछ drugs और steroids hormones भी bile के जरिए निकलते हैं। 💦 Sweat & Sebaceous Glands Sweat glands थोड़ा urea, NaCl और lactic acid निकालती हैं। Sebaceous glands, sebum (oily substance) निकालती हैं जो steroids, hydrocarbons और waxes जैसे lipid-based waste हटाता है। 💧 Saliva थोड़ी मात्रा में nitrogenous waste हटाने में मदद करती है। 16. Excretion in Animals Type Waste Excreted Animals (Examples) Ammonotelism Ammonia Amoeba, Sycon, Hydra, Liver fluke, Tapeworm, Leech, Prawn, Bony fishes Ureotelism Urea Mammals, कई terrestrial amphibians, marine fishes और sting rays Uricotelism Uric acid अधिकतर insects, land snails, lizards Trick to remember: जानवर जितना अधिक पानी बचाना चाहता है, उतना ठोस waste निकालता है → Ammonia (सबसे ज़्यादा पानी चाहिए, aquatic animals) → Urea (मध्यम) → Uric acid (सबसे कम पानी, land/dry animals — solid/paste रूप में) ↑"}, {"title": "Diseases", "subject": "Biology", "url": "../biology/diseases_notes.html", "text": "Diseases Notes – RISE NOTES RISE NOTES · Biology Notes Diseases Complete Notes · Simple Language 🦠 Disease क्या होती है? Disease = शरीर के किसी organ या हिस्से की internal structure और function में कोई disturbance , जो specific signs और symptoms के साथ आती है। सीधे शब्दों में — जब body की normal working बिगड़ जाए, उसे disease कहते हैं। 1 Disease का Classification ⏱️ Acute Diseases Short period में आती हैं जल्दी बड़ा असर करती हैं E.g.: Fever, Cold, Cough 📅 Chronic Diseases लंबे समय तक चलती हैं धीरे-धीरे असर करती हैं E.g.: Diabetes, TB, Elephantiasis 🔁 Communicable Diseases एक person से दूसरे को फैलती हैं Pathogens से होती हैं E.g.: Malaria, AIDS, TB, COVID 🚫 Non-Communicable Diseases एक से दूसरे को नहीं फैलतीं Nutrients की कमी, allergy, या abnormal cells से E.g.: Diabetes, Arthritis, Asthma, Cancer 🐾 Zoonotic Diseases = Animals से Humans में transfer होने वाली बीमारियाँ। E.g. — Rabies, Bird Flu 2 Pathogens — Disease के कारण 🦠 Virus छोटे infectious agents — 20–400 nm Genetic material: DNA या RNA + Protein coat (Capsid) Host cell के
