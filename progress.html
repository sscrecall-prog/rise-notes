<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISE NOTES — Progress</title>
<link rel="stylesheet" href="assets/css/rise-unified.css">
<link rel="stylesheet" href="assets/css/rise-progress.css">
<link rel="stylesheet" href="assets/css/rise-navigation.css">
<link rel="stylesheet" href="assets/css/rise-search.css">
<link rel="stylesheet" href="assets/css/rise-bookmarks.css">
<link rel="stylesheet" href="assets/css/rise-analytics.css">
<link rel="stylesheet" href="assets/css/rise-timer.css">
<link rel="stylesheet" href="assets/css/rise-planner.css">
<link rel="stylesheet" href="assets/css/rise-revision.css">
<link rel="stylesheet" href="assets/css/rise-test.css">
<link rel="stylesheet" href="assets/css/rise-library.css">
</head>
<body>
<main class="container" style="max-width:980px;margin:auto;padding:32px 18px;">
  <p><a href="index.html">← Study Dashboard</a></p>
  <h1>Study Progress</h1>
  <p>Track completed chapters, bookmarks and practice performance in one place.</p>

  <section class="rise-progress-panel" data-rise-dashboard-progress data-total="48">
    <div class="rise-progress-head">
      <div class="rise-progress-title">Overall Progress</div>
      <div class="rise-progress-percent" data-progress-percent>0%</div>
    </div>
    <div class="rise-progress-track"><div class="rise-progress-fill" data-progress-fill></div></div>
    <div class="rise-stat-grid">
      <div class="rise-stat"><strong data-completed-count>0</strong><span>Chapters completed</span></div>
      <div class="rise-stat"><strong data-bookmark-count>0</strong><span>Bookmarked</span></div>
      <div class="rise-stat"><strong data-average-score>0%</strong><span>Best practice average</span></div>
      <div class="rise-stat"><strong data-rise-global-progress>0%</strong><span>Overall progress</span></div>
    </div>
  </section>

  <section class="rise-progress-panel">
    <h2>Subject Progress</h2>
    <div class="rise-subject-progress">
      <div class="rise-subject-row" data-subject-progress data-subject="Polity" data-total="8"><span class="rise-subject-name">Polity</span><div class="rise-mini-track"><div class="rise-mini-fill"></div></div><span data-subject-percent>0%</span></div>
      <div class="rise-subject-row" data-subject-progress data-subject="History" data-total="8"><span class="rise-subject-name">History</span><div class="rise-mini-track"><div class="rise-mini-fill"></div></div><span data-subject-percent>0%</span></div>
      <div class="rise-subject-row" data-subject-progress data-subject="Geography" data-total="8"><span class="rise-subject-name">Geography</span><div class="rise-mini-track"><div class="rise-mini-fill"></div></div><span data-subject-percent>0%</span></div>
      <div class="rise-subject-row" data-subject-progress data-subject="Economics" data-total="8"><span class="rise-subject-name">Economics</span><div class="rise-mini-track"><div class="rise-mini-fill"></div></div><span data-subject-percent>0%</span></div>
      <div class="rise-subject-row" data-subject-progress data-subject="Physics" data-total="8"><span class="rise-subject-name">Physics</span><div class="rise-mini-track"><div class="rise-mini-fill"></div></div><span data-subject-percent>0%</span></div>
      <div class="rise-subject-row" data-subject-progress data-subject="Chemistry" data-total="8"><span class="rise-subject-name">Chemistry</span><div class="rise-mini-track"><div class="rise-mini-fill"></div></div><span data-subject-percent>0%</span></div>
    </div>
  </section>
</main>
<script src="assets/js/rise-progress.js"></script>
<script src="assets/js/rise-navigation.js"></script>
<script src="assets/js/rise-search-index.js"></script>
<script src="assets/js/rise-search.js"></script>
<script src="assets/js/rise-bookmarks.js"></script>
<script src="assets/js/rise-analytics.js"></script>
<script src="assets/js/rise-timer.js"></script>
<script src="assets/js/rise-planner.js"></script>
<script src="assets/js/rise-revision.js"></script>
<script src="assets/js/rise-test-bank.js"></script>
<script src="assets/js/rise-test.js"></script>
<script src="assets/js/rise-library.js"></script>
</body>
</html>
