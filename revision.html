<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RISE NOTES — Revision</title>
<link rel="stylesheet" href="assets/css/rise-unified.css">
<link rel="stylesheet" href="assets/css/rise-navigation.css">
<link rel="stylesheet" href="assets/css/rise-revision.css">
<link rel="stylesheet" href="assets/css/rise-test.css">
<link rel="stylesheet" href="assets/css/rise-library.css">
</head><body>
<main class="container" style="max-width:1050px;margin:auto;padding:28px 18px">
<h1>Revision</h1>
<p>Use spaced review to revisit completed chapters instead of relying on memory alone.</p>

<section class="rise-revision" data-rise-revision aria-label="Revision system">
  <div class="rise-revision-panel">
    <div class="rise-revision-head">
      <div>
        <div class="rise-revision-title">Today's Revision</div>
        <div class="rise-revision-subtitle">Review completed chapters when they become due.</div>
      </div>
    </div>
    <div class="rise-revision-filters">
      <button class="rise-revision-filter is-active" type="button" data-revision-filter="due">Due Now</button>
      <button class="rise-revision-filter" type="button" data-revision-filter="all">All Completed</button>
    </div>
    <div class="rise-revision-list" data-rise-revision-list data-revision-list></div>
  </div>
</section>

</main>
<script src="assets/js/rise-navigation.js"></script>
<script src="assets/js/rise-revision.js"></script>
<script src="assets/js/rise-test-bank.js"></script>
<script src="assets/js/rise-test.js"></script>
<script src="assets/js/rise-library.js"></script>
</body></html>
